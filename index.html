ney for charity","To thank employees"],"a":3,"e":"Staff Appreciation Dinner → 感謝員工。","p":"S7-11"},{"id":"P7-11-2","i":"p7","pt":7,"t":"跨篇推論","q":"Why did Ms. Park miss the deadline?","o":["She was on vacation.","She forgot about the event.","She was traveling for work.","The online form was not working."],"a":2,"e":"第二篇：I was on a business trip in Singapore。","p":"S7-11"},{"id":"P7-11-3","i":"p7","pt":7,"t":"跨篇推論","q":"When should Ms. Park have registered?","o":["By November 6","By December 6","By November 22","By November 25"],"a":2,"e":"第一篇的截止日 November 22；她 11/25 才寫信。雙篇題要把兩篇的資訊對起來。","p":"S7-11"},{"id":"P7-11-4","i":"p7","pt":7,"t":"細節","q":"What will Ms. Park's husband most likely eat?","o":["Salmon","Chicken","Beef","Pasta"],"a":3,"e":"丈夫要 vegetarian option，第一篇顯示素食是 Vegetarian Pasta。","p":"S7-11"},{"id":"P7-11-5","i":"p7","pt":7,"t":"推論","q":"What is suggested about Ms. Park?","o":["She will arrive late.","She works in the events department.","She will not take the shuttle bus.","She has attended the dinner before."],"a":2,"e":"we will be driving there ourselves, so we won't need the shuttle。","p":"S7-11"},{"id":"P7-12-1","i":"p7","pt":7,"t":"細節","q":"What is NOT mentioned as a feature of the T200?","o":["It can be controlled by phone.","It works with most systems.","It has a voice assistant.","It adjusts temperature on its own."],"a":2,"e":"第一篇沒提到語音助理。","p":"S7-12"},{"id":"P7-12-2","i":"p7","pt":7,"t":"細節","q":"What problem does Mr. Mendes report?","o":["The device was never delivered.","He received the wrong model.","The device is not working properly.","He was charged twice."],"a":2,"e":"stopped responding、screen stays blank。","p":"S7-12"},{"id":"P7-12-3","i":"p7","pt":7,"t":"跨篇推論","q":"What is most likely true about Mr. Mendes's thermostat?","o":["It can be returned for a full refund.","It is still under warranty.","It is an older model.","It was shipped for free."],"a":1,"e":"買了 18 個月，保固 2 年 → 仍在保固內。60 天退貨期已過。","p":"S7-12"},{"id":"P7-12-4","i":"p7","pt":7,"t":"推論","q":"What does Mr. Mendes offer to provide?","o":["A copy of the warranty","His home address","A photograph of the device","Proof of purchase"],"a":3,"e":"I still have my order confirmation = proof of purchase。","p":"S7-12"},{"id":"P7-12-5","i":"p7","pt":7,"t":"同義字","q":"In the e-mail, the word \"stays\" in paragraph 1 is closest in meaning to","o":["stops","visits","remains","lives"],"a":2,"e":"the screen stays blank = 螢幕一直是空白的，remains。","p":"S7-12"},{"id":"P7-13-1","i":"p7","pt":7,"t":"細節","q":"What is indicated about the courses?","o":["They are free for students.","They are taught online.","They last for eight weeks.","They are held on weekends."],"a":2,"e":"All courses run for eight weeks。","p":"S7-13"},{"id":"P7-13-2","i":"p7","pt":7,"t":"跨篇推論","q":"Why will Ms. Wu most likely receive a discount?","o":["She is a former student.","She is taking two courses.","Her employer is a partner company.","She registered before February 15."],"a":3,"e":"表單提交日 2/10，早於 2/15 早鳥期限。","p":"S7-13"},{"id":"P7-13-3","i":"p7","pt":7,"t":"跨篇推論","q":"Which course has had a schedule change?","o":["Business Writing","Presentation Skills","Excel for Beginners","Project Management"],"a":3,"e":"E-mail 說週四的課改期；廣告顯示週四是 Project Management。三篇題常要跨兩篇才能找到答案。","p":"S7-13"},{"id":"P7-13-4","i":"p7","pt":7,"t":"細節","q":"What time will the rescheduled course be held?","o":["6–8 P.M.","8–10 P.M.","5–7 P.M.","7–9 P.M."],"a":3,"e":"at the same time → 原本週四 7–9 P.M.。","p":"S7-13"},{"id":"P7-13-5","i":"p7","pt":7,"t":"細節","q":"What is Ms. Wu asked to do by February 28?","o":["Pay the course fee","Inform the college of her decision","Contact the instructor","Submit a new registration form"],"a":1,"e":"Please let us know your decision by February 28。","p":"S7-13"},{"id":"P7-14-1","i":"p7","pt":7,"t":"目的","q":"What is the main purpose of Mr. Okafor's trip?","o":["To interview job candidates","To take a vacation","To conduct business","To attend a training course"],"a":2,"e":"業務會議與商展 → 出差洽公。","p":"S7-14"},{"id":"P7-14-2","i":"p7","pt":7,"t":"細節","q":"What does the hotel rate include?","o":["Dinner","A conference room","Late check-out","Transportation to the airport"],"a":3,"e":"airport shuttle 含在房價中；延遲退房要另外申請。","p":"S7-14"},{"id":"P7-14-3","i":"p7","pt":7,"t":"跨篇推論","q":"What will Sophie most likely ask the hotel to do?","o":["Change the room type","Extend the stay by one night","Book an airport shuttle","Allow a late check-out"],"a":3,"e":"簡訊說 the request mentioned in my booking，飯店確認單上可申請的是延遲退房到兩點，不想帶行李去開會。","p":"S7-14"},{"id":"P7-14-4","i":"p7","pt":7,"t":"推論","q":"What is suggested about Mr. Okafor's meeting on May 14?","o":["It will be held at the hotel.","It was planned before the trip.","It will take place before his flight.","It will be held at the trade fair."],"a":2,"e":"會議 11 A.M.，班機 6:10 P.M. → 在班機之前。地點是對方辦公室。","p":"S7-14"},{"id":"P7-14-5","i":"p7","pt":7,"t":"細節","q":"When did Mr. Okafor first meet with Hanshin Retail?","o":["On the morning of May 13","On May 14","On the afternoon he arrived","At the trade fair"],"a":2,"e":"行程表：5/12 抵達當天下午三點和 Hanshin 開會。","p":"S7-14"}],"sets":{"S3-01":{"i":"p34","k":"conv","pt":3,"t":"影印資料","au":[["W","Good morning, Jack. Could you do me a favor and make copies of these handouts? I need forty of them for the staff meeting tomorrow morning."],["M","Sure, but the copier on our floor is being repaired. I'll have to use the one in the marketing department."],["W","That's fine. Oh, and could you staple each set? There are three pages per handout."],["M","No problem. I'll bring them to your office before lunch."]],"zh":"女：早安 Jack，可以幫我把這些講義印出來嗎？明早員工會議要 40 份。男：好，不過我們這層的影印機在修，我得用行銷部那台。女：沒關係。對了，可以每份都釘起來嗎？每份三頁。男：沒問題，午餐前拿到妳辦公室。","g":null},"S3-02":{"i":"p34","k":"conv","pt":3,"t":"飯店訂房","au":[["M","Hello, Harbor View Hotel. How may I help you?"],["W","Hi, I'd like to book a room for three nights, from October twelfth. I'm attending a conference at the convention center nearby."],["M","Let me check... We have a standard room available, but the rooms with an ocean view are fully booked for those dates."],["W","A standard room is fine. Does the rate include breakfast?"],["M","Yes, and since you're attending the conference, you're also eligible for a ten percent discount. I'll just need your conference registration number."]],"zh":"男：港景飯店您好。女：我想訂 10 月 12 日起三晚，我要去附近會展中心參加研討會。男：標準房有空，但海景房那幾天都滿了。女：標準房就好，有含早餐嗎？男：有，而且您參加研討會可享九折，我需要您的報名編號。","g":null},"S3-03":{"i":"p34","k":"conv","pt":3,"t":"新產品延期（三人對話）","au":[["W","Kevin, Raj, do you have a minute? I just heard from the factory that the new blenders won't be ready until the end of next month."],["M","That's a problem. We've already scheduled the product launch for the fifteenth."],["M2","Well, we could still hold the launch event, but take pre-orders instead of selling the blenders on the spot."],["W","That's a good idea, Raj. Customers could get a discount if they order in advance."],["M","Let's do it. I'll update the advertising materials this afternoon."]],"zh":"女：Kevin、Raj，有空嗎？工廠說新果汁機要到下個月底才能做好。男1：麻煩了，我們已經把發表會訂在 15 號。男2：發表會還是可以辦，只是改成接受預購，不當場賣。女：好主意，預購的客人可以打折。男1：就這麼辦，我今天下午更新廣告文宣。","g":null},"S3-04":{"i":"p34","k":"conv","pt":3,"t":"會議室預約（意圖題）","au":[["M","Hi, Sandra. I need to reserve the large conference room for Thursday afternoon. Our clients from Osaka are visiting."],["W","Hmm, the sales team has it booked from one to four."],["M","Oh no. The clients' flight lands at noon, so two o'clock would have been perfect."],["W","Well, the room on the fifth floor is free all day. It's a bit smaller, but it has a brand-new video system."],["M","That should work. There will only be six of us anyway."]],"zh":"男：Sandra，我要預約週四下午的大會議室，大阪的客戶要來。女：嗯，業務部一點到四點訂走了。男：糟了，客戶中午落地，兩點最剛好。女：五樓的會議室整天都空著，小一點，但有全新的視訊設備。男：那可以，反正我們只有六個人。","g":null},"S3-05":{"i":"p34","k":"conv","pt":3,"t":"面試安排","au":[["W","Hello, this is Grace Liu from Bellwood Engineering. I'm calling about the project coordinator position you applied for."],["M","Oh, hello! Thank you for calling."],["W","We were impressed with your application, and we'd like to invite you for an interview next Tuesday at ten."],["M","I'd love to come, but I have a final exam that morning. Would it be possible to meet in the afternoon?"],["W","Let me see... Yes, three o'clock is open. Please bring samples of projects you've managed."]],"zh":"女：我是 Bellwood 工程的 Grace Liu，打來是關於你應徵的專案協調員職位。男：您好，謝謝來電。女：我們對你的申請印象深刻，想邀你下週二十點面試。男：我很想去，但那天早上有期末考，可以改下午嗎？女：三點可以，請帶你負責過的專案範例。","g":null},"S3-06":{"i":"p34","k":"conv","pt":3,"t":"餐廳外燴（圖表題）","au":[["M","Hi, I'm organizing a retirement party for a colleague next Friday, and I'd like to order catering for about twenty-five people."],["W","Certainly. Have you looked at our package options?"],["M","Yes. We'd like to have both hot dishes and dessert, but we don't need drinks. We'll buy those ourselves."],["W","Then this package would be perfect for you. We can deliver it to your office at noon."],["M","Great. I'll pay the deposit online today."]],"zh":"男：我下週五要幫同事辦退休派對，想訂大約 25 人的外燴。女：好的，看過我們的套餐了嗎？男：看了，我們要熱食和甜點，但不需要飲料，我們自己買。女：那這個套餐最適合，中午可以送到辦公室。男：太好了，我今天線上付訂金。","g":"<table class=\"gtab\"><caption>Catering Packages（每人價格）<\/caption><tr><th>Package<\/th><th>Includes<\/th><th>Price<\/th><\/tr><tr><td>Basic<\/td><td>Sandwiches, salad<\/td><td>$12<\/td><\/tr><tr><td>Classic<\/td><td>Hot dishes, drinks<\/td><td>$18<\/td><\/tr><tr><td>Deluxe<\/td><td>Hot dishes, dessert<\/td><td>$22<\/td><\/tr><tr><td>Premium<\/td><td>Hot dishes, dessert, drinks<\/td><td>$27<\/td><\/tr><\/table>"},"S3-07":{"i":"p34","k":"conv","pt":3,"t":"電腦故障","au":[["W","Hi, is this the IT help desk? My computer keeps shutting down whenever I open the accounting software."],["M","That sounds like the update we installed last night. A few other people have had the same issue."],["W","I really need it today. I have to finish the monthly payroll by five."],["M","I understand. I'll come up to your desk in about ten minutes. In the meantime, you could use the laptop in the meeting room—it hasn't been updated yet."]],"zh":"女：資訊服務台嗎？我一開會計軟體電腦就關機。男：應該是昨晚裝的更新，已經有幾個人遇到同樣問題。女：我今天真的需要，五點前要做完當月薪資。男：了解，我大約十分鐘後上去。這段時間妳可以先用會議室那台筆電，它還沒更新。","g":null},"S3-08":{"i":"p34","k":"conv","pt":3,"t":"辦公室搬遷（三人對話）","au":[["M","So, the movers are coming on Saturday to take everything to the new office building. Is everyone's equipment packed?"],["W","Almost. The design team still needs boxes. We ran out yesterday."],["W2","I can pick some up from the supply store on my way in tomorrow."],["M","Thanks, Lucy. Also, remember that the new building requires security badges. Please make sure your team members have their photos taken by Thursday."],["W","Where do we go for that?"],["M","The security office on the ground floor of the new building."]],"zh":"男：搬家公司週六會把東西搬到新辦公大樓，大家的設備都打包好了嗎？女1：差不多，設計組還需要箱子，昨天用完了。女2：我明天上班路上去文具店拿一些。男：謝了 Lucy。另外，新大樓需要識別證，請確定組員週四前拍好照片。女1：要去哪裡拍？男：新大樓一樓的保全室。","g":null},"S3-09":{"i":"p34","k":"conv","pt":3,"t":"包裹寄送","au":[["M","Hi, I'd like to send this package to Vancouver. How long will it take?"],["W","Standard shipping takes five to seven business days. Express shipping takes two days, but it costs about twice as much."],["M","It's a birthday gift for my sister, and her birthday is this Saturday."],["W","Then I'd recommend express. If you want, you can also add tracking for one dollar so you can check where it is online."],["M","Sure, let's do that."]],"zh":"男：我想把這個包裹寄到溫哥華，要多久？女：一般寄送五到七個工作天；快遞兩天，但價錢大約兩倍。男：這是給我妹妹的生日禮物，她的生日是這週六。女：那建議快遞。你也可以加一美元追蹤服務，在網路上查包裹位置。男：好，就這樣。","g":null},"S3-10":{"i":"p34","k":"conv","pt":3,"t":"健身房會員（圖表題）","au":[["W","Hi, I'm interested in joining the gym. I mostly want to use the swimming pool."],["M","Great. Our pool is open every day, but it's closed for cleaning on one weekday morning. Here's the schedule."],["W","Hmm, I usually swim before work, around seven. So I'd have to skip that day."],["M","Right. By the way, if you sign up this week, the registration fee is waived."],["W","Oh, that's nice. I'll fill out the form now."]],"zh":"女：我想加入健身房，主要想用游泳池。男：游泳池每天開，但平日有一個早上要清潔。這是時間表。女：我通常上班前七點左右游，那天就得跳過了。男：對。順帶一提，這週報名免入會費。女：真好，我現在就填表。","g":"<table class=\"gtab\"><caption>Pool Hours<\/caption><tr><th>Day<\/th><th>Hours<\/th><\/tr><tr><td>Monday<\/td><td>6:00 A.M. – 10:00 P.M.<\/td><\/tr><tr><td>Tuesday<\/td><td>6:00 A.M. – 10:00 P.M.<\/td><\/tr><tr><td>Wednesday<\/td><td>12:00 P.M. – 10:00 P.M.<\/td><\/tr><tr><td>Thursday<\/td><td>6:00 A.M. – 10:00 P.M.<\/td><\/tr><tr><td>Friday<\/td><td>6:00 A.M. – 9:00 P.M.<\/td><\/tr><\/table>"},"S3-11":{"i":"p34","k":"conv","pt":3,"t":"供應商報價","au":[["M","Ms. Novak, I've reviewed the three quotes for the new office furniture. Morrison Supplies is the cheapest, but they can't deliver until March."],["W","That's too late. The new hires start on February first, and they'll need desks."],["M","Then I'd suggest Delta Interiors. They're only slightly more expensive, and they can deliver within two weeks."],["W","All right. Go ahead and place the order with them. And ask if they offer free assembly."]],"zh":"男：Novak 女士，我看過三家辦公家具的報價。Morrison 最便宜，但三月才能交貨。女：太晚了，新進員工 2 月 1 日報到，需要桌子。男：那建議 Delta Interiors，只貴一點點，兩週內可交貨。女：好，就向他們下單，並問他們有沒有免費組裝。","g":null},"S3-12":{"i":"p34","k":"conv","pt":3,"t":"研討會報名","au":[["W","Did you register for the digital marketing seminar next month?"],["M","Not yet. I wanted to, but I heard it's already full."],["W","The morning session is, but they just opened an afternoon session because so many people were interested."],["M","Really? Then I'll sign up right away. Is the company paying for it?"],["W","Yes, just submit a training request form to your manager first."]],"zh":"女：你報名下個月的數位行銷研討會了嗎？男：還沒，本來想報，但聽說滿了。女：早上場滿了，但因為太多人有興趣，剛加開下午場。男：真的？那我馬上報。公司會出錢嗎？女：會，只要先交訓練申請表給你主管。","g":null},"S4-01":{"i":"p34","k":"talk","pt":4,"t":"機場廣播","au":[["N","Attention, passengers on Pacific Air flight 482 to Sydney. Due to a mechanical issue, this flight will now depart from Gate 36 instead of Gate 22. The new departure time is 4:15 P.M. We apologize for the inconvenience. Passengers who would like a meal voucher may pick one up at the service counter near Gate 30. Thank you for your patience."]],"zh":"太平洋航空 482 號班機飛往雪梨的旅客請注意：因機械問題，本班機改由 36 號登機門出發，不是 22 號。新起飛時間為下午 4:15。造成不便，敬請見諒。需要餐券的旅客可到 30 號登機門附近的服務櫃台領取。感謝您的耐心。","g":null},"S4-02":{"i":"p34","k":"talk","pt":4,"t":"語音留言","au":[["N","Hi, this is Martin Reyes from Clearview Optometry, calling for Ms. Ellen Park. I'm calling to remind you of your eye examination appointment tomorrow, Wednesday, at 2:30. Please remember to bring your current glasses and your insurance card. If you need to reschedule, please call us at least twenty-four hours in advance, or a cancellation fee may apply. Our number is 555-0198. Thank you."]],"zh":"您好，我是 Clearview 眼科的 Martin Reyes，找 Ellen Park 小姐。提醒您明天週三 2:30 有眼睛檢查的預約，請記得帶目前的眼鏡和保險卡。如需改期請至少提前 24 小時來電，否則可能收取取消費。電話 555-0198，謝謝。","g":null},"S4-03":{"i":"p34","k":"talk","pt":4,"t":"新人訓練開場","au":[["N","Good morning, everyone, and welcome to Norton Financial. I'm Teresa Mills, head of Human Resources. Today's orientation will last until four o'clock. This morning, you'll learn about our company history and policies. After lunch, which will be served in the cafeteria on the second floor, you'll meet your department managers and get a tour of your work areas. Before we begin, please take a moment to make sure your name badge is correct. If there are any mistakes, let my assistant, Paul, know."]],"zh":"大家早安，歡迎加入 Norton 金融，我是人資主管 Teresa Mills。今天的新人訓練到四點。上午介紹公司歷史和規定；午餐在二樓員工餐廳，下午和部門主管見面並參觀工作區域。開始前請確認名牌是否正確，有錯請告訴我的助理 Paul。","g":null},"S4-04":{"i":"p34","k":"talk","pt":4,"t":"廣告","au":[["N","Is your home office too crowded? At Space Smart, we design custom storage solutions that fit any room. From wall-mounted shelves to hidden drawers, our designers will help you make the most of every square meter. And this month only, we're offering a free in-home consultation. Just visit our Web site to book an appointment. Space Smart—organize your space, organize your life."]],"zh":"你的居家辦公室太擠了嗎？Space Smart 設計適合任何房間的訂製收納方案，從壁掛層架到隱藏抽屜，設計師幫你善用每一平方公尺。本月限定提供免費到府諮詢，上網站預約即可。","g":null},"S4-05":{"i":"p34","k":"talk","pt":4,"t":"會議開場（意圖題）","au":[["N","Thanks for joining today's meeting. As you know, our customer satisfaction scores dropped last quarter, mostly because of long wait times on the phone. Starting next month, we'll add an online chat option on our Web site so customers can get help without calling. Now, I know some of you are worried about extra work. Well, we're hiring five new support agents. I'll pass around the training schedule now—please choose a session that fits your schedule."]],"zh":"謝謝大家參加今天的會議。如各位所知，上一季顧客滿意度下降，主要是電話等待太久。下個月起網站會新增線上客服，讓顧客不用打電話也能得到協助。我知道有些人擔心工作量增加——嗯，我們會招聘五位新客服人員。我現在把訓練時間表傳下去，請選一個適合的場次。","g":null},"S4-06":{"i":"p34","k":"talk","pt":4,"t":"導覽解說","au":[["N","Welcome to the Riverside Chocolate Factory tour. My name is Oliver, and I'll be your guide today. The tour takes about an hour. We'll start in the roasting room, where cocoa beans are heated, and finish in our gift shop, where you can taste samples. For safety reasons, please stay with the group and don't touch any of the machines. Also, photography is not allowed inside the production area, but feel free to take pictures in the gift shop."]],"zh":"歡迎參觀河畔巧克力工廠，我是導覽員 Oliver。行程約一小時，從烘焙可可豆的烘焙室開始，最後到禮品店試吃。為了安全請跟緊團體、不要碰機器。生產區禁止拍照，但禮品店可以拍。","g":null},"S4-07":{"i":"p34","k":"talk","pt":4,"t":"路況報導","au":[["N","This is Radio 98.5 with your morning traffic update. Drivers heading downtown on Highway 9 should expect delays of up to thirty minutes because of road repairs near the Lincoln Bridge. Two lanes are closed until Friday. If possible, take Route 4 instead. Commuters may also want to consider the city's new express bus line, which started service yesterday. Stay tuned—after the news, we'll have the weekend weather forecast."]],"zh":"98.5 電台為您帶來早晨路況：往市中心的 9 號公路因林肯橋附近道路施工，預計延誤最多 30 分鐘，兩線車道封閉到週五。可以的話請改走 4 號公路。通勤族也可以考慮昨天開始營運的新快捷公車。請別轉台，新聞之後是週末天氣預報。","g":null},"S4-08":{"i":"p34","k":"talk","pt":4,"t":"樓層指引（圖表題）","au":[["N","Hello, everyone, and welcome to the Greenfield Conference. Just a few announcements before we begin. Registration is on the first floor, next to the main entrance. Lunch will be served at noon. Please note that the keynote speech by Dr. Amira Hassan has been moved to a larger room because so many people signed up. It will now be held in the room next to the elevators on the third floor. Enjoy the conference!"]],"zh":"大家好，歡迎參加 Greenfield 研討會。開始前幾項宣布：報到在一樓主入口旁。中午供應午餐。請注意，Amira Hassan 博士的主題演講因報名人數太多，改到較大的房間，地點在三樓電梯旁的那間。祝大家研討會愉快！","g":"<table class=\"gtab\"><caption>Third Floor<\/caption><tr><th>Room<\/th><th>Location<\/th><th>Seats<\/th><\/tr><tr><td>Room 301<\/td><td>Next to the elevators<\/td><td>300<\/td><\/tr><tr><td>Room 302<\/td><td>Next to the stairs<\/td><td>80<\/td><\/tr><tr><td>Room 303<\/td><td>Near the café<\/td><td>120<\/td><\/tr><tr><td>Room 304<\/td><td>End of the hall<\/td><td>60<\/td><\/tr><\/table>"},"S4-09":{"i":"p34","k":"talk","pt":4,"t":"頒獎致詞","au":[["N","Good evening. It's my great pleasure to present this year's Employee of the Year award to Hannah Cole from our customer service department. Over the past year, Hannah introduced a new system for tracking customer requests, which cut our response time in half. She also volunteered to train new team members every month. Hannah, please come up to the stage to receive your award—and a gift certificate for a weekend stay at the Lakeside Resort."]],"zh":"晚安。很榮幸頒發年度最佳員工獎給客服部的 Hannah Cole。過去一年她導入新的顧客需求追蹤系統，讓回應時間縮短一半，還自願每月訓練新同仁。Hannah，請上台領獎——還有湖畔度假村週末住宿禮券。","g":null},"S4-10":{"i":"p34","k":"talk","pt":4,"t":"產品使用說明","au":[["N","Thank you for purchasing the AquaPure water filter. Before using it for the first time, rinse the filter cartridge under cold water for about two minutes. This removes any dust from the manufacturing process. The cartridge should be replaced every three months. When the indicator light turns red, it's time to order a new one. You can buy replacement cartridges on our Web site, and if you subscribe, we'll ship them to you automatically at a discount."]],"zh":"感謝購買 AquaPure 濾水器。第一次使用前，請用冷水沖洗濾芯約兩分鐘，去除製程中的灰塵。濾芯每三個月更換一次，指示燈變紅就該訂新的。可以在網站購買替換濾芯；訂閱的話，我們會自動以折扣價寄給您。","g":null},"S6-01":{"i":"p6","k":"text","pt":6,"t":"E-mail：訂單延遲","docs":[["E-mail","<div class=\"ptext\">To: Brian Holt &lt;bholt@marlowdesign.com&gt;\nFrom: Customer Service &lt;service@papercraft.com&gt;\nSubject: Your order #4471\n\nDear Mr. Holt,\n\nThank you for your recent order of business cards and letterhead. Unfortunately, the special cream-colored paper you selected is temporarily <span class=\"blank\">(1)<\/span>. Our supplier expects to send us a new shipment by May 10.\n\nWe can either wait for the new paper to arrive or print your order on a similar white paper right away. <span class=\"blank\">(2)<\/span>, we will ship it within two business days. <span class=\"blank\">(3)<\/span>\n\nPlease let us know your preference by replying to this e-mail. We apologize for the inconvenience and <span class=\"blank\">(4)<\/span> your understanding.\n\nSincerely,\nNadia Brooks\nPaperCraft Printing<\/div>"]]},"S6-02":{"i":"p6","k":"text","pt":6,"t":"公告：電梯維修","docs":[["公告","<div class=\"ptext\">NOTICE TO ALL TENANTS\n\nThe elevators in the east wing of Carlton Tower will be <span class=\"blank\">(1)<\/span> maintenance from Monday, June 3, to Wednesday, June 5. During this time, tenants and visitors should use the elevators in the west wing.\n\n<span class=\"blank\">(2)<\/span> Deliveries to offices in the east wing should be made through the loading dock on Baker Street. Building staff will be available to help move large items.\n\nWe understand that this may cause some <span class=\"blank\">(3)<\/span>. <span class=\"blank\">(4)<\/span> questions about the maintenance schedule should be directed to the building management office at extension 200.\n\nThank you for your cooperation.<\/div>"]]},"S6-03":{"i":"p6","k":"text","pt":6,"t":"信件：錄取通知","docs":[["信件","<div class=\"ptext\">Dear Ms. Alvarez,\n\nOn behalf of Brightline Software, I am pleased to offer you the position of Junior Data Analyst. We were very impressed by your <span class=\"blank\">(1)<\/span> during the interview process.\n\nAs discussed, your starting salary will be $52,000 per year, and you will be eligible for health benefits after a 90-day probationary period. Your first day of work <span class=\"blank\">(2)<\/span> Monday, August 12.\n\n<span class=\"blank\">(3)<\/span> Please sign the enclosed contract and return it to me by July 31. If you have any questions, do not hesitate to contact me.\n\nWe look forward to <span class=\"blank\">(4)<\/span> you to our team.\n\nBest regards,\nDaniel Kim\nHuman Resources Manager<\/div>"]]},"S6-04":{"i":"p6","k":"text","pt":6,"t":"文章：社區新聞","docs":[["文章","<div class=\"ptext\">GREENVILLE — The Greenville Public Library will open a new branch on Elm Street next month. The two-story building will feature a children's reading room, a computer lab, and a community meeting space that can be <span class=\"blank\">(1)<\/span> free of charge by local groups.\n\nThe project was funded <span class=\"blank\">(2)<\/span> by a donation from the Harper Family Foundation. \"We wanted to give something back to the town where our business started,\" said Ellen Harper.\n\n<span class=\"blank\">(3)<\/span> Library director Tom Grady says the branch will also offer weekend language classes. \"Many residents have asked for these classes, and we're excited to <span class=\"blank\">(4)<\/span> them,\" he said.\n\nThe opening ceremony will take place on Saturday, September 7, at 10 A.M.<\/div>"]]},"S6-05":{"i":"p6","k":"text","pt":6,"t":"備忘錄：新休假系統","docs":[["備忘錄","<div class=\"ptext\">MEMO\nTo: All Staff\nFrom: Rachel Moore, Human Resources\nRe: New leave request system\n\nStarting October 1, all vacation and sick leave requests must be submitted through the new online system, LeaveTrack. Paper forms will no longer be ay.\n\nLaura Chen [10:12 A.M.]\nHmm. Could we send 30 on Friday and the rest next week?\n\nMark Davies [10:14 A.M.]\nThat should work. I'll update the shipping schedule.\n\nLaura Chen [10:15 A.M.]\nGreat. I'll call the client and explain.<\/div>"]]},"S7-03":{"i":"p7","k":"single","pt":7,"t":"單篇：徵才廣告","docs":[["Job advertisement","<div class=\"ptext\">Sunrise Hotel Group is seeking an experienced Front Desk Supervisor for our downtown location.\n\nResponsibilities:\n• Supervise a team of eight front desk agents\n• Handle guest complaints and special requests\n• Prepare weekly staff schedules\n\nRequirements:\n• At least three years of hotel experience, including one year in a supervisory role\n• Excellent communication skills\n• Ability to speak a second language is preferred but not required\n\nApplicants must be available to work weekends and holidays. To apply, send a résumé and cover letter to jobs@sunrisehotels.com by June 30.<\/div>"]]},"S7-04":{"i":"p7","k":"single","pt":7,"t":"單篇：E-mail（插入句）","docs":[["E-mail","<div class=\"ptext\">To: Olivia Grant\nFrom: Samuel Ortiz\nSubject: Thank you\nDate: March 3\n\nDear Ms. Grant,\n\nThank you for speaking at our small-business workshop last Thursday. <b class=\"ins\">[1]<\/b> Many participants told us your advice on online marketing was the most useful part of the day.\n\nAs promised, I have attached the participant feedback forms. <b class=\"ins\">[2]<\/b> You will see that the average rating for your session was 4.8 out of 5.\n\nWe are planning another workshop in September and would be delighted if you could join us again. <b class=\"ins\">[3]<\/b> I will contact you next month with more details.\n\nThank you again for your contribution. <b class=\"ins\">[4]<\/b>\n\nBest regards,\nSamuel Ortiz\nRiverside Business Association<\/div>"]]},"S7-05":{"i":"p7","k":"single","pt":7,"t":"單篇：發票","docs":[["Invoice","<div class=\"ptext\">GREEN LEAF OFFICE SUPPLIES\nInvoice #20931     Date: November 4\nBill to: Harmon &amp; Pric <script>window.TUT={"hub":[{"t":"多益是什麼？一張表看懂 200 題","b":"TOEIC Listening & Reading（多益聽力與閱讀）是 ETS 出的<b>職場英語<\/b>測驗：全部是選擇題，共 <b>200 題、約 2 小時<\/b>。<br><b>聽力 100 題約 45 分鐘<\/b>，錄音只播一次，題目一題接一題，不能回頭。<br><b>閱讀 100 題 75 分鐘<\/b>，自己分配時間，可以跳題。<br>兩部分各 5–495 分，<b>總分 10–990<\/b>，沒有及格不及格，用分數和證書顏色表示程度。考題情境都是辦公室、出差、購物、餐廳、人事、財務等日常工作場景，不需要專業知識。","a":"把多益想成一場<b>職場的一天<\/b>：早上進辦公室聽同事說話（Part 1–2）、開會和講電話（Part 3–4）、下午處理信件和文件（Part 5–7）。考的不是學術英文，而是「你能不能在公司裡用英文把事情辦好」。","w":{"type":"grid","cols":["Part","題型","題數","形式"],"rows":[["Part 1","照片描述 Photographs","6","看照片，聽 4 個描述選最符合的"],["Part 2","應答問題 Question-Response","25","聽一句話，選 3 個回應中最適當的"],["Part 3","簡短對話 Conversations","39","13 段對話 × 3 題，含三人對話、圖表題"],["Part 4","簡短獨白 Talks","30","10 段獨白 × 3 題，含圖表題"],["Part 5","句子填空 Incomplete Sentences","30","單句挖空，考文法與單字"],["Part 6","段落填空 Text Completion","16","4 篇短文 × 4 題，每篇 1 題插入句"],["Part 7","閱讀測驗 Reading Comprehension","54","單篇 29 題、雙篇 10 題、三篇 15 題"]]},"k":["聽力 4 個 Part 共 100 題，閱讀 3 個 Part 共 100 題","Part 3（39 題）和 Part 7（54 題）佔最多分，是拉分關鍵","成績單有效期限一般以兩年為參考"],"q":{"q":"多益哪一個 Part 題數最多？","o":["Part 7 閱讀測驗","Part 5 句子填空","Part 3 簡短對話","Part 2 應答問題"],"a":0,"e":"Part 7 共 54 題，是全卷題數最多的部分；其次是 Part 3 的 39 題。"}},{"t":"分數怎麼算？五色證書與 CEFR","b":"多益不是「答對幾題就幾分」，而是把答對題數換算成<b>量尺分數<\/b>，每一回的換算表都不一樣，所以網路上的換算只能當參考。<br>台灣的證書依總分分成<b>五種顏色<\/b>：橘色 10–215、棕色 220–465、綠色 470–725、藍色 730–855、金色 860–990。很多企業會用 600、700、800 當門檻；聽力通常比閱讀好拿分，答錯幾題仍可能滿分，閱讀錯兩三題就可能開始扣分。","a":"量尺分數像<b>考駕照的路考評分<\/b>：不是只算你做對幾個動作，而是換算成統一的標準，讓不同場次的考試可以互相比較。","w":{"type":"layers","items":[{"h":"🟡 金色 860–990","s":"CEFR 約 C1","tag":"國際溝通專業級","d":"能在不熟悉的情境中流暢、得體地用英語溝通，可以主持會議、處理談判。外商、國際業務、外派常見要求。"},{"h":"🔵 藍色 730–855","s":"CEFR 約 B2","tag":"職場進階","d":"能應付大部分工作溝通，在壓力下或冷門話題時可能不夠流利。科技業、金融業常見門檻區間。"},{"h":"🟢 綠色 470–725","s":"CEFR 約 A2–B1","tag":"日常溝通","d":"能處理例行性工作與日常社交，聽懂會議大部分要點。許多大學畢業門檻落在這一區。"},{"h":"🟤 棕色 220–465","s":"CEFR 約 A1–A2","tag":"基礎","d":"能進行簡單的日常對話，還無法用英文處理工作。"},{"h":"🟠 橘色 10–215","s":"CEFR A1 以下","tag":"入門","d":"只能理解非常簡單的句子，建議從單字和基礎文法開始。"}]},"k":["總分 10–990，聽力、閱讀各 5–495","證書顏色：橘 / 棕 / 綠 / 藍 / 金，金色從 860 分開始","答對題數 → 量尺分數的換算每回不同，網路換算表只是估計"],"q":{"q":"總分 735 分會拿到哪一種顏色的證書？","o":["藍色","綠色","金色","棕色"],"a":0,"e":"藍色證書是 730–855 分，735 分落在藍色區間。"}},{"t":"時間分配：閱讀 75 分鐘怎麼用","b":"聽力的節奏由錄音決定，你能控制的是<b>閱讀的 75 分鐘<\/b>。最多人寫不完的原因是在 Part 5 想太久。建議：<br><b>Part 5：每題 20–30 秒，總共 10–12 分鐘<\/b><br><b>Part 6：每篇約 2 分鐘，總共 8–10 分鐘<\/b><br><b>Part 7：剩下約 55 分鐘<\/b>，單篇每題約 1 分鐘，多篇留 25 分鐘以上。<br>不會的題目先猜一個答案、做記號，<b>多益答錯不倒扣<\/b>，絕對不要留空。","a":"閱讀就像<b>吃到飽餐廳只有 75 分鐘<\/b>：前菜（Part 5）不要吃太久，不然主菜（Part 7）還沒吃到就要結帳了。","w":{"type":"steps","order":true,"items":[["聽力時段：利用說明時間預讀","Part 1、2、3、4 開頭的說明廣播都可以拿來先看後面的照片和題目"],["Part 5：快速判斷題型","先看選項：同字根不同詞性就看空格位置，幾秒內作答"],["Part 6：讀前後句","時態、連接詞、插入句都要看上下文"],["Part 7 單篇：先看題目再找答案","帶著關鍵字去文章裡找，不要從頭精讀"],["Part 7 多篇：對照資訊","注意兩篇間的日期、價格、人名對應"],["最後 1 分鐘：全部畫滿","答錯不倒扣，沒做到的題目也要猜一個答案"]]},"k":["Part 5 + 6 盡量在 20 分鐘內完成","Part 7 至少留 50–55 分鐘","答錯不扣分，全部都要作答"],"q":{"q":"多益答錯會倒扣嗎？","o":["不會，所以每題都要作答","會，答錯一題扣 1/4 題","只有閱讀會倒扣","只有聽力會倒扣"],"a":0,"e":"多益分數只看答對題數，不倒扣。時間不夠時，剩下的題目也一定要猜一個答案。"}},{"t":"備考計畫：依目標分數安排","b":"準備方向取決於你現在的程度：<br><b>目標 600 以下<\/b>：先背 1,500–2,000 個多益核心單字，搞懂詞性和基本時態，聽力先練 Part 1、2。<br><b>目標 600–750<\/b>：Part 5 文法題要穩定答對，Part 3、4 練「先看題目」，閱讀練習找關鍵字。<br><b>目標 750–860<\/b>：做完整模擬考抓時間，加強 Part 7 多篇閱讀和同義改寫。<br><b>目標 860+<\/b>：錯題分析、聽寫與跟讀（shadowing），把速度和穩定度拉高。","a":"準備多益像<b>健身<\/b>：初學者先打基礎（單字、文法 = 基礎肌力），中階開始練技巧（解題策略 = 動作），高階才拚速度和穩定度（模擬考 = 比賽）。","w":{"type":"layers","items":[{"h":"第 1–2 週","s":"摸底與單字","tag":"打底","d":"做一回模擬考了解程度；每天背 30–50 個多益單字（可以用本站釣魚碼頭）；每天 10 題 Part 5。"},{"h":"第 3–4 週","s":"聽力題型","tag":"聽力","d":"Part 1 熟悉 being/been 陷阱；Part 2 練疑問詞反應；每天聽寫 5 句。"},{"h":"第 5–6 週","s":"Part 3、4 與 Part 6","tag":"技巧","d":"練習先看題目、抓關鍵字；整理同義改寫筆記；Part 6 練插入句。"},{"h":"第 7–8 週","s":"Part 7 與模擬考","tag":"衝刺","d":"每週兩回完整模擬考，嚴格計時；寫錯題本，針對弱點島嶼重練。"}]},"k":["單字是所有 Part 的基礎，越早開始越好","每週至少一次完整計時模擬","錯題比新題重要：搞懂為什麼錯"],"q":{"q":"目標 600 分以下的考生，最應該優先加強什麼？","o":["核心單字與基本文法","三篇閱讀的時間控制","英式口音辨識","高難度同義字題"],"a":0,"e":"基礎不穩時，單字和詞性、時態等基本文法對所有 Part 都有幫助，CP 值最高。"}},{"t":"考試當天流程與注意事項","b":"台灣多益大多在週末舉行，<b>通常提前 30 分鐘入場<\/b>，開考後就不能進場（以准考證規定為準）。<br>要帶：<b>有效的身分證件<\/b>（依官方規定）、<b>2B 鉛筆、橡皮擦<\/b>、准考證或報名資訊。手機、手錶等電子產品要關機收好。<br>考試開始前會先填個人資料與問卷；聽力和閱讀中間<b>沒有休息<\/b>，聽力結束直接接閱讀。<br>試題本不能寫字或畫記，所有答案都畫在答案卡上。","a":"考試當天像<b>搭國際線班機<\/b>：提早報到、證件帶齊、登機（開考）後就不能再上車，中途也不能下機。","w":{"type":"steps","order":true,"items":[["前一天：確認證件與考場","看清楚准考證上的考場地址、入場時間與證件規定"],["提早到考場","找教室、上廁所，聽力和閱讀中間沒有休息時間"],["填寫答案卡資料","姓名、准考證號碼、問卷，照監考人員指示"],["聽力 45 分鐘","跟著錄音走，答不出來就猜，立刻看下一題"],["閱讀 75 分鐘","自己控制時間，Part 5 不要卡太久"],["交卷前檢查答案卡","每一題都有畫、沒有畫錯格"]]},"k":["試題本上不能做筆記或畫記","聽力與閱讀之間沒有中場休息","所有規定以當次官方准考證與考生須知為準"],"q":{"q":"多益聽力和閱讀之間有休息時間嗎？","o":["沒有，聽力結束直接開始閱讀","有 10 分鐘","有 30 分鐘","可以自由決定"],"a":0,"e":"多益聽力約 45 分鐘結束後會直接進入閱讀 75 分鐘，中間沒有休息，要事先上好廁所。"}}],"p1":[{"t":"Part 1 怎麼考？四步驟解題法","b":"Part 1 共 <b>6 題<\/b>，試題本上只有照片，四個描述 (A)–(D) <b>只念一次、不印出來<\/b>。每題作答時間約 5 秒。<br>照片分兩大類：<b>人物照<\/b>（考人在做什麼動作）和<b>景物照<\/b>（考東西在哪裡、什麼狀態）。<br>解題順序：先看照片 → 預測可能的主詞和動詞 → 聽主詞、動詞、受詞是否和照片相符 → 用<b>刪去法<\/b>，聽到錯的就刪掉。","a":"就像玩<b>「大家來找碴」<\/b>：四句話裡有三句跟照片有一點點不同，你要抓出唯一完全對的那一句。","w":{"type":"steps","order":true,"items":[["看照片分類","人物照還是景物照？有幾個人？"],["預測描述","人物照想動作動詞（V-ing），景物照想位置與狀態"],["聽主詞＋動詞","主詞對不對？動作對不對？時態對不對？"],["刪去法作答","聽到明顯錯的就在心裡刪掉，剩下的就是答案"],["立刻看下一張","答完馬上預看下一題的照片"]]},"k":["Part 1 只有 6 題，但很容易因為輕忽而丟分","答案只描述照片「看得到」的事實，不要推論","刪去法比找正解更有效"],"q":{"q":"Part 1 的四個描述會印在試題本上嗎？","o":["不會，只用聽的而且只念一次","會，印在照片下方","只印出正確答案","會，但沒有中文"],"a":0,"e":"Part 1 的試題本只有照片，四個描述都只播放一次。"}},{"t":"人物照：最常考的動作動詞","b":"人物照的正解大多是<b>現在進行式 be + V-ing<\/b>，描述照片當下的動作。常見動詞要能「聽到就想到畫面」：<br>拿東西 <b>holding / carrying<\/b>、看 <b>looking at / examining<\/b>、放 <b>placing / putting<\/b>、整理 <b>arranging / stacking<\/b>、伸手拿 <b>reaching for<\/b>、靠著 <b>leaning against<\/b>。<br>特別注意 <b>wearing（穿著，狀態）<\/b> 和 <b>putting on（正在穿上，動作）<\/b> 的差別，這是經典陷阱。","a":"wearing 像<b>照片裡已經戴好的帽子<\/b>；putting on 像<b>影片裡正把帽子往頭上戴的那一秒<\/b>。照片裡通常只能看到「已經戴著」。","w":{"type":"listen","tip":"點 ▶ 聽句子，再點「看原文」對照","items":[["She's holding a cup of coffee.","她拿著一杯咖啡。"],["He's reaching for a file on the shelf.","他正伸手去拿架上的檔案。"],["They're examining a document together.","他們正一起查看一份文件。"],["A man is wearing safety glasses.","一位男士戴著護目鏡（狀態）。"],["A man is putting on safety glasses.","一位男士正在戴上護目鏡（動作）。"],["She's leaning against a railing.","她正靠著欄杆。"],["Some people are standing in line.","有些人正在排隊。"],["He's sweeping the floor.","他正在掃地。"]]},"k":["人物照正解多是 be + V-ing","wearing = 穿著（狀態）；putting on / trying on = 正在穿上（動作）","主詞的單複數也要聽清楚：A man / Some people"],"q":{"q":"照片中一位女士已經戴著安全帽站在工地，下列哪一句最正確？","o":["She's wearing a helmet.","She's putting on a helmet.","She's taking off a helmet.","She's buying a helmet."],"a":0,"e":"已經戴好了用 wearing。putting on 是「正在戴上」的動作，taking off 是「正在脫下」。"}},{"t":"景物照：being 和 been 的生死線","b":"照片裡<b>沒有人<\/b>時，描述物品狀態要用：<br><b>have/has been + p.p.<\/b>（已經被……好了）：<i>The chairs have been arranged.<\/i><br><b>be + p.p.<\/b>（處於……狀態）：<i>The door is closed.<\/i><br><b>be + V-ing<\/b>（不及物動詞的狀態）：<i>A picture is hanging on the wall.<\/i><br>而 <b>is being + p.p.<\/b>（正在被……）表示<b>有人正在做這個動作<\/b>，照片裡沒人就幾乎一定是錯的。","a":"being 像<b>現場直播<\/b>：一定要有人在鏡頭裡動作；been 像<b>完工照<\/b>：事情做完了，人走了，只留下結果。","w":{"type":"sort","tip":"照片裡「沒有任何人」，這句話可能是正解嗎？","buckets":["可能正確","幾乎一定錯"],"items":[["The tables have been set for dinner.",0,"have been set：已經擺好，描述完成的狀態。"],["The tables are being set for dinner.",1,"are being set：正在被擺放，需要有人在做。"],["Some boxes are stacked in a corner.",0,"are stacked：被堆放著的狀態。"],["A floor is being mopped.",1,"正在被拖，照片裡要有人拖地才對。"],["A lamp is standing next to a sofa.",0,"stand 不及物，描述位置狀態。"],["The windows are being cleaned.",1,"正在被清潔，需要有人。"],["Some plants have been placed on the steps.",0,"已經被擺好，完成狀態。"],["The shelves are being stocked.",1,"正在被補貨，需要有人。"]]},"k":["沒人的照片，聽到 is being + p.p. 幾乎可以直接刪掉","have been + p.p. 是景物照最常見的正解句型","有人正在做動作時，is being + p.p. 才可能正確"],"q":{"q":"照片：空無一人的餐廳，桌上已擺好餐具。哪一句正確？","o":["The tables have been set.","The tables are being set.","A waiter is setting the tables.","The tables are being cleared."],"a":0,"e":"沒有人在動作，用完成式被動 have been set。"}},{"t":"位置與方向：介系詞一次搞定","b":"景物照很愛考東西的<b>相對位置<\/b>，介系詞聽錯一個字就錯：<br><b>next to / beside<\/b> 旁邊、<b>between<\/b> 兩者之間、<b>in front of / behind<\/b> 前／後、<b>above / over<\/b> 上方、<b>below / under<\/b> 下方、<b>on top of<\/b> 在頂部、<b>along<\/b> 沿著、<b>across from<\/b> 對面、<b>in a row<\/b> 排成一排、<b>on both sides of<\/b> 兩側。","a":"想像你在<b>佈置房間<\/b>：沙發「靠著」牆、燈「在」沙發「旁邊」、畫「掛在」沙發「上方」，每個位置都有對應的介系詞。","w":{"type":"cards","items":[["next to","在……旁邊<br><i>A lamp is next to the bed.<\/i>"],["between","在兩者之間<br><i>A table is between two chairs.<\/i>"],["across from","在……對面<br><i>The bank is across from the park.<\/i>"],["along","沿著<br><i>Trees are planted along the road.<\/i>"],["on top of","在……頂端<br><i>A box is on top of the cabinet.<\/i>"],["in a row","排成一排<br><i>Bicycles are parked in a row.<\/i>"],["overlook","俯瞰（動詞）<br><i>The balcony overlooks the sea.<\/i>"],["lined up","排列整齊<br><i>Chairs are lined up against the wall.<\/i>"]]},"k":["位置描述常和 have been placed / are arranged 一起出現","注意單複數：a chair / some chairs","overlook（俯瞰）、line（沿……排列）也是常考動詞"],"q":{"q":"「腳踏車排成一排停著」最接近哪一句？","o":["Bicycles are parked in a row.","Bicycles are being ridden.","A bicycle is on top of a car.","Bicycles are being repaired."],"a":0,"e":"in a row = 排成一排；are parked 描述停放狀態。"}},{"t":"相似音陷阱：耳朵要分得出來","b":"Part 1、2 很常用<b>發音相近的字<\/b>當陷阱。例如照片是 copying（影印），選項卻說 coffee；照片是 walking，選項說 working。<br>聽到選項裡有<b>聽起來很像照片裡的東西<\/b>，反而要提高警覺。這個練習會念出兩個相似字中的一個，請選出你聽到的那個。","a":"像<b>傳話遊戲<\/b>：「洗碗」聽成「喜歡」，只差一點點，意思完全不同。","w":{"type":"pairs","tip":"按「播放」，選出你聽到的單字","items":[["walking","working"],["copy","coffee"],["file","pile"],["lock","rock"],["glass","grass"],["ship","sheep"],["row","low"],["seat","sit"],["fold","hold"],["light","right"]]},"k":["聽到和照片中物品發音相似的字，先懷疑","l / r、短母音 / 長母音 是最常見的混淆","只聽懂一個單字就選答案，最容易掉進相似音陷阱"],"q":{"q":"照片是一位男士在影印，選項說 \"He's making some coffee.\"，這是哪一種陷阱？","o":["相似音陷阱","時態陷阱","位置陷阱","人數陷阱"],"a":0,"e":"copy 和 coffee 發音相近，屬於相似音陷阱。"}},{"t":"聽寫練習：把耳朵練細","b":"聽寫（dictation）是提升 Part 1 的最佳方法：聽一句、打出來、對答案。對不上的字通常就是你<b>聽不出來的連音或弱讀<\/b>，例如 <i>is being<\/i> 常常被念得很快，<i>has been<\/i> 的 has 幾乎聽不到。<br>建議每天聽寫 5–10 句，錯的字整理成清單反覆聽。","a":"聽寫像<b>對照片描圖<\/b>：描一次，你才會發現原本沒注意到的細節。","w":{"type":"dict","items":[["The chairs have been stacked against the wall.","椅子已經靠牆疊好了。"],["She's handing a folder to a colleague.","她正把資料夾遞給同事。"],["Some merchandise is on display.","一些商品正在展示中。"],["The man is adjusting a microscope.","那位男士正在調整顯微鏡。"],["A path runs along the river.","一條小路沿著河延伸。"]]},"k":["聽寫時大小寫和標點不用太在意，專注單字","has been、is being、some、a 等弱讀字最容易漏","打錯的字回頭多聽幾次，跟著念"],"q":{"q":"下列哪一個字在句子裡最常被念得很輕、容易聽漏？","o":["has（在 has been 中）","microscope","colleague","merchandise"],"a":0,"e":"has been 中的 has 是功能字，常弱讀成 /əz/，很容易聽漏，但它決定了時態。"}}],"p2":[{"t":"Part 2 怎麼考？六大題型","b":"Part 2 共 <b>25 題<\/b>，題目和三個回應 (A)(B)(C) <b>全部只用聽的<\/b>，是唯一完全沒有文字的 Part。<br>題型分六大類：<b>WH 疑問句<\/b>（Who/What/When/Where/Why/How）、<b>Yes/No 疑問句<\/b>、<b>選擇疑問句<\/b>（A or B）、<b>否定／附加問句<\/b>、<b>請求與提議<\/b>（Could you...? / Why don't we...?）、<b>直述句<\/b>。<br>新制考試裡<b>間接回答<\/b>比例很高：正解常常不是直接回答，而是「還沒決定」、「去問某人」這類合理回應。","a":"Part 2 像<b>在辦公室走廊被同事搭話<\/b>：對方隨口問一句，你要給出自然的回應，而不是考你背了多少標準答案。","w":{"type":"layers","items":[{"h":"WH 疑問句","s":"抓第一個字","tag":"最多","d":"聽到 Where 就找地點、When 找時間、Who 找人或部門。WH 問句<b>不能用 Yes/No 回答<\/b>，聽到 Yes/No 開頭可以直接刪掉。"},{"h":"Yes/No 疑問句","s":"Do/Is/Have/Can 開頭","tag":"","d":"正解不一定有 Yes 或 No，常見「I'm almost done.」「I think so.」或直接提供資訊。"},{"h":"選擇疑問句","s":"A or B?","tag":"","d":"正解常是選一個、Either is fine、Neither，或間接表態。通常不用 Yes/No 回答。"},{"h":"否定／附加問句","s":"Isn't...? / ..., isn't it?","tag":"","d":"把否定和附加部分去掉，當成一般問句理解即可。"},{"h":"請求與提議","s":"Could you / Would you like / Why don't we","tag":"","d":"Why don't we...? 是提議不是問原因。回答 Sure / That sounds good / Sorry, I can't... 都常見。"},{"h":"直述句","s":"沒有問號","tag":"最難","d":"對方陳述一件事（例如印表機沒墨了），正解是合理的反應：提供解決方法、追問或同意。"}]},"k":["Part 2 每題三個選項，聽到明顯錯的立刻刪","WH 問句聽到 Yes/No 開頭可直接刪除","間接回答（不知道、還沒決定、問某人）常常是正解"],"q":{"q":"聽到 \"Why don't we take a break?\"，這句話的功能是？","o":["提議休息","詢問不休息的原因","抱怨工作太多","請求幫忙"],"a":0,"e":"Why don't we...? 是常見的提議句型，意思是「我們要不要……？」"}},{"t":"WH 疑問詞：聽第一個字決定一半","b":"Part 2 有將近一半是 WH 疑問句，<b>第一個字聽清楚就能刪掉大部分錯誤選項<\/b>。<br>Who → 人名、職稱、部門；When → 時間點、期間（how soon）；Where → 地點、位置、也可以是人（Ask Ms. Lee）；Why → 原因（不一定有 because）；How → 方式、狀態、數量（How many/much/long/often）；What time / What kind → 依後面的字決定。","a":"疑問詞像<b>寄包裹的分類標籤<\/b>：貼上「Where」就只能放進地點那一格。","w":{"type":"sort","tip":"這個回應最適合回答哪一種問句？","buckets":["Who","When","Where","Why"],"items":[["The marketing manager.",0,"職稱 → Who。"],["Not until next Tuesday.",1,"時間 → When。"],["On the top shelf.",2,"位置 → Where。"],["Because the client canceled.",3,"原因 → Why。"],["Someone from Accounting.",0,"部門的人 → Who。"],["In about an hour.",1,"多久以後 → When。"],["Across from the lobby.",2,"位置 → Where。"],["To save on shipping costs.",3,"目的不定詞也能回答 Why。"]]},"k":["When / Where 發音相近，要特別注意","Why 的回答常以不定詞 To... 或直接說明原因","Who 的答案可以是部門、職稱"],"q":{"q":"\"Where can I find the budget report?\" 最適合的回應是？","o":["Ms. Chen has a copy.","Last Friday.","Yes, it's ready.","About ten pages."],"a":0,"e":"回答「陳小姐那裡有一份」，間接告訴你去哪裡拿。Yes 不能回答 WH 問句。"}},{"t":"間接回答：多益最愛的「萬用正解」","b":"新制 Part 2 大量出現<b>間接回答<\/b>。下列句型幾乎可以回應任何問題，聽到時要特別留意：<br><b>不知道／還沒決定<\/b>：I'm not sure. / It hasn't been decided yet.<br><b>轉介<\/b>：You should ask Mr. Kim. / Let me check.<br><b>反問<\/b>：Didn't you get the e-mail?<br><b>給出條件或原因<\/b>：It depends on the budget.","a":"就像有人問你「這週五聚餐在哪？」，你說「我還沒收到通知耶」。雖然沒回答地點，卻是最自然的回應。","w":{"type":"listen","tip":"這些句子在 Part 2 常常是正解，聽熟它們","items":[["It hasn't been decided yet.","還沒決定。"],["Let me check the schedule.","我查一下行程表。"],["You'd better ask the manager.","你最好問經理。"],["I haven't heard anything about it.","我沒聽說這件事。"],["It depends on the weather.","要看天氣。"],["Didn't you get the memo?","你沒收到備忘錄嗎？"],["I'll find out and let you know.","我查清楚再告訴你。"],["Either is fine with me.","我都可以。"]]},"k":["「不知道、還沒決定、問某人、查一下」常是正解","反問句也可以是合理回應","不要只找「直接回答」，要找「最自然」的回應"],"q":{"q":"\"When will the new manager start?\" 下列哪一個是合理的間接回答？","o":["That hasn't been announced yet.","At the main office.","Yes, she will.","The manager of sales."],"a":0,"e":"「還沒宣布」是典型的間接回答，合情合理。"}},{"t":"三大陷阱：相似音、重複字、聯想字","b":"Part 2 的錯誤選項通常用以下三招：<br><b>相似音<\/b>：題目說 copy，選項有 coffee。<br><b>重複字<\/b>：題目出現 budget，錯誤選項也有 budget，但答非所問。<br><b>聯想字<\/b>：題目講 umbrella，錯誤選項講 rain。<br>記住：<b>聽到和題目一樣或很像的字，通常是陷阱<\/b>。","a":"出題者像<b>魔術師<\/b>：用你熟悉的字吸引注意力，讓你沒發現整句話根本答非所問。","w":{"type":"sort","tip":"題目：\"Has the conference room been reserved?\"，這個錯誤選項屬於哪種陷阱？","buckets":["重複字","相似音","聯想字"],"items":[["The conference was very informative.",0,"重複 conference，但內容答非所問。"],["I'd like to reserve a table for two.",0,"重複 reserve，講的是訂餐廳。"],["It's a reserved person.",0,"reserved 在這裡是「內向的」，一字多義也屬重複字陷阱。"],["The room is full of brooms.",1,"room / broom 音近。"],["He deserved the award.",1,"reserved / deserved 音近。"],["The projector and the screen.",2,"會議室聯想到投影機，但沒回答問題。"],["About twenty chairs.",2,"會議室聯想到椅子數量。"]]},"k":["題目中的字在選項重複出現 → 先懷疑","發音相近的字 → 先懷疑","和題目情境有關卻沒回答問題 → 聯想陷阱"],"q":{"q":"題目 \"Who's going to the trade show?\"，選項 \"It was a great show.\" 是哪種陷阱？","o":["重複字陷阱","相似音陷阱","聯想陷阱","這是正解"],"a":0,"e":"重複了 show，但沒有回答「誰要去」。"}},{"t":"其他問句：Yes/No、否定、附加、選擇","b":"這幾類問句的關鍵是<b>不要被形式迷惑<\/b>：<br>否定問句 Isn't...? 和附加問句 ..., isn't it? 都當成一般問句理解。<br>選擇疑問句 A or B? 回答其中一個、Either、Neither、或間接表態。<br>Yes/No 問句的正解，常常<b>省略 Yes/No 直接給資訊<\/b>。","a":"否定和附加問句像<b>包了一層包裝紙的禮物<\/b>，拆掉包裝（not、isn't it）看裡面的問題就好。","w":{"type":"fill","items":[["\"Would you like tea or coffee?\" — ___",["Coffee, please.","Yes, I would.","It's very hot."],0,"選擇疑問句通常不能用 Yes 回答。"],["\"Isn't the report due today?\" — ___",["It was extended to Friday.","No, I didn't report it.","Today is sunny."],0,"當成「報告是今天截止嗎？」回答延到週五。"],["\"You've met Mr. Diaz, haven't you?\" — ___",["Yes, at last year's conference.","He's in a meeting.","No, I haven't met it."],0,"附加問句：你見過 Diaz 先生吧？回答在去年研討會見過。"],["\"Do you want to sit by the window or the aisle?\" — ___",["I don't mind.","Yes, please.","The window is open."],0,"I don't mind = 都可以。"],["\"Have you finished the presentation slides?\" — ___",["I just need to add the charts.","Yes, I presented.","The slides are white."],0,"間接表示快好了。"]]},"k":["否定、附加問句 → 去掉 not / 附加部分再理解","選擇疑問句 → 選一個、都可、都不、或間接表態","Yes/No 問句的正解常常省略 Yes/No"],"q":{"q":"\"Should we meet in the morning or in the afternoon?\" 哪一個回答最不適當？","o":["Yes, we should.","The afternoon would be better.","Either works for me.","I'm free all day."],"a":0,"e":"選擇疑問句用 Yes 回答答非所問，其他三個都是合理回應。"}},{"t":"聽寫練習：常見問句","b":"把 Part 2 常見的問句聽寫幾次，就會熟悉它們被<b>快速念出來<\/b>時的樣子。例如 <i>Would you<\/i> 常連音成 /wʊdʒu/、<i>Did you<\/i> 變成 /dɪdʒu/、<i>What do you<\/i> 變成 /wədəjə/。","a":"連音像<b>手寫的草書<\/b>：字都在，只是連在一起寫。看多了就認得出來。","w":{"type":"dict","items":[["Would you like me to send the files now?","要我現在寄檔案給你嗎？"],["Where did you put the client's contract?","你把客戶的合約放哪了？"],["Why don't we ask Lisa to join us?","我們要不要請 Lisa 一起來？"],["How long will the repairs take?","修理要多久？"],["Isn't the shipment supposed to arrive today?","貨不是應該今天到嗎？"]]},"k":["Would you / Did you / Could you 都會連音","疑問句的第一個字最重要，聽寫時先抓第一個字","跟著念（shadowing）可以讓聽力和口說一起進步"],"q":{"q":"\"Did you\" 在口語中常被念成什麼樣子？","o":["/dɪdʒu/，兩個字連在一起","/dɪd/ /ju/，每個字清楚分開","/du/","/dɪdɪt/"],"a":0,"e":"d 和 y 相遇時常連音成 /dʒ/，Did you 聽起來像 \"didja\"。"}}],"p34":[{"t":"先看題目再聽：預讀是 Part 3、4 的命脈","b":"Part 3、4 的題目和選項<b>都印在試題本上<\/b>，每段錄音配 3 題。高分關鍵是：<b>錄音開始前先看完 3 題題目<\/b>（有時間的話再看選項），知道要聽什麼。<br>三題的答案通常<b>依照對話順序出現<\/b>：第一題答案在開頭、第二題在中段、第三題在結尾。聽到第一題的答案就立刻畫記，不要等整段聽完。","a":"預讀像<b>出門前先看購物清單<\/b>：進了超市（錄音）才不會亂逛，看到要買的東西（答案）就直接放進推車。","w":{"type":"steps","order":true,"items":[["上一組一答完，立刻看下一組題目","利用題目播放的空檔，不要等"],["圈出每題的疑問詞和關鍵字","What problem / Who / What will the man do next"],["判斷要聽「誰」說的話","the man / the woman / the speakers"],["邊聽邊作答","答案多半依序出現，聽到就畫"],["錄音結束前畫完，馬上預讀下一組","跟不上就猜一個，不要卡在同一組"]]},"k":["Part 3、4 的題目和選項印在試題本上","先看題目，答案依序出現","第三題常考「下一步」：What will ... do next?"],"q":{"q":"Part 3 一段對話通常配幾題？","o":["3 題","1 題","2 題","5 題"],"a":0,"e":"Part 3 共 13 段對話、39 題，每段 3 題；Part 4 共 10 段獨白、30 題，每段也是 3 題。"}},{"t":"題型地圖：五種常見問法","b":"Part 3、4 的題目幾乎都是固定問法，認得問法就知道答案在哪：<br><b>主旨／目的<\/b>：What are the speakers discussing? Why is the man calling? → 開頭。<br><b>身分／地點<\/b>：Who most likely is the woman? Where does the conversation take place? → 整段線索。<br><b>細節<\/b>：What problem / When / How much → 聽到就答。<br><b>下一步<\/b>：What will the man probably do next? → 結尾。<br><b>意圖題<\/b>：Why does the man say, \"...\"? → 看那句話的前後文。<br><b>圖表題<\/b>：Look at the graphic. → 對照聽到的資訊和圖表。","a":"題型像<b>考古題的分類目錄<\/b>：知道是哪一類題目，就知道要翻到錄音的哪一頁。","w":{"type":"layers","items":[{"h":"主旨／目的題","s":"What is the conversation mainly about?","tag":"開頭","d":"答案通常在前兩句。打電話的目的常用 I'm calling to... / I'm calling about... 帶出來。"},{"h":"身分／地點題","s":"Who is the man? Where are they?","tag":"整段","d":"從關鍵字推：boarding pass → 機場；prescription → 藥局；check out → 飯店或圖書館。"},{"h":"細節題","s":"What / When / How much / What problem","tag":"中段","d":"答案通常會<b>換句話說<\/b>（paraphrase），不一定用原字。"},{"h":"下一步題","s":"What will the woman do next?","tag":"結尾","d":"聽最後一兩句：I'll... / Let me... / Why don't you...?"},{"h":"意圖題","s":"What does the man mean when he says, \"...\"?","tag":"新制","d":"同一句話在不同情境意思不同，一定要看<b>前後文<\/b>，不能只看字面。"},{"h":"圖表題","s":"Look at the graphic.","tag":"新制","d":"錄音不會直接說答案，會說圖表上的「另一個欄位」，例如說地點讓你找房號、說條件讓你找價格。"}]},"k":["主旨題看開頭、下一步題看結尾","意圖題一定要看上下文","圖表題：聽到的資訊和答案在圖表上是不同欄位"],"q":{"q":"\"What will the woman most likely do next?\" 答案通常出現在錄音的哪裡？","o":["結尾","開頭","中間","不一定會出現"],"a":0,"e":"下一步題的答案通常在最後一兩句，例如 I'll send it right away."}},{"t":"換句話說：同義改寫是答案的偽裝","b":"Part 3、4、7 的正解很少直接照抄原文，而是<b>換一種說法<\/b>。原文說 <i>the copier is broken<\/i>，選項寫 <i>A machine is not working<\/i>；原文說 <i>fully booked<\/i>，選項寫 <i>not available<\/i>。<br>反過來說，<b>選項中出現原文一模一樣的字，反而常是陷阱<\/b>。","a":"同義改寫像<b>朋友換了髮型<\/b>：你要認的是那個人，而不是髮型。","w":{"type":"cards","items":[["fully booked","→ not available / no vacancies"],["the copier is being repaired","→ a machine is being fixed"],["I'll e-mail you the details","→ send some information"],["the registration fee is waived","→ there is no registration fee"],["sign up","→ register / enroll"],["reduce costs","→ save money / cut expenses"],["a colleague","→ a coworker"],["at no charge","→ free of charge / complimentary"]]},"k":["正解常用同義字改寫原文","和原文一模一樣的字反而要小心","平常整理「原文 → 選項」對照筆記非常有效"],"q":{"q":"對話中說 \"Our flight has been canceled.\"，哪個選項是正確的改寫？","o":["A trip has been called off.","A flight was delayed.","A ticket was lost.","A flight is full."],"a":0,"e":"cancel = call off（取消）。delayed 是延誤，不同。"}},{"t":"三人對話與口音：分清楚誰在說話","b":"新制 Part 3 有<b>三人對話<\/b>，題目會用名字指定說話者，例如 <i>What does Raj suggest?<\/i>。注意對話中有人叫名字的地方（Thanks, Lucy.），那就是線索。<br>多益錄音包含<b>美國、英國、加拿大、澳洲<\/b>口音。英式和澳式口音常把 <i>can't<\/i> 念成 /kɑːnt/、<i>schedule<\/i> 念成 /ˈʃedjuːl/、字尾 r 不捲舌。網站的語音會盡量混用不同口音。","a":"三人對話像<b>聽一場三人視訊會議<\/b>：要記住誰說了什麼，名字就是每個人的名牌。","w":{"type":"listen","tip":"同一句話，用不同口音聽聽看（依你的瀏覽器提供的聲音而定）","accent":true,"items":[["I can't make it to the meeting on Tuesday.","我週二沒辦法參加會議。"],["Could you check the schedule for me?","可以幫我看一下時間表嗎？"],["The garage is around the corner.","車庫在轉角那邊。"],["We'll need a new advertisement for the launch.","發表會需要新的廣告。"],["Thanks, Lucy. That would be a great help.","謝了 Lucy，幫了大忙。"]]},"k":["三人對話題目會指名說話者，注意對話中的稱呼","多益有美、英、加、澳四種口音","can't、schedule、advertisement 是常見的口音差異字"],"q":{"q":"三人對話中，題目問 \"What does Lucy offer to do?\"，最重要的線索是？","o":["對話中有人叫 Lucy 名字的前後","第一個說話的人","最後一句話","女生說的所有話"],"a":0,"e":"三人對話常有兩位同性別說話者，要靠稱呼（Thanks, Lucy.）判斷是誰說的。"}},{"t":"圖表題：答案不會被直接念出來","b":"圖表題（Look at the graphic.）會配一張表格、價目表、地圖、行程表或長條圖。關鍵規則：<b>錄音說的是 A 欄位，答案要你選 B 欄位<\/b>。<br>例如選項是房間號碼，錄音只會說「在電梯旁邊」；選項是價格，錄音只會說「要熱食和甜點、不要飲料」。所以預讀時要先看<b>選項是圖表中的哪一欄<\/b>，再聽另一欄的資訊。","a":"圖表題像<b>對照菜單點餐<\/b>：你跟服務生說「我要有雞肉、不要辣的」，服務生自己找出是第幾號餐。","w":{"type":"steps","order":true,"items":[["先看選項屬於圖表的哪一欄","選項是價格？房號？日期？"],["找出「另一欄」可能是什麼","價格的另一欄是內容、房號的另一欄是位置"],["聽錄音裡描述另一欄的資訊","例如 next to the elevators、no drinks"],["在圖表上對應，選出答案","注意否定和例外：except、not、instead"]]},"k":["圖表題錄音不會直接念出答案","預讀時先確認選項在圖表的哪一欄","注意 instead、no longer、except 這類改變答案的字"],"q":{"q":"圖表是樓層表（房號、位置、座位數），選項是房號。錄音最可能提到什麼？","o":["房間的位置或大小","房號本身","演講者的名字","研討會的票價"],"a":0,"e":"圖表題錄音會說另一欄的資訊，例如位置或座位數，讓你自己對應到房號。"}},{"t":"Part 4 七大獨白類型","b":"Part 4 是一個人說話，類型很固定，認出類型就能預測內容：<b>電話留言<\/b>、<b>公共廣播<\/b>（機場、車站、商店）、<b>會議或演講開場<\/b>、<b>廣告<\/b>、<b>導覽<\/b>、<b>新聞與路況氣象<\/b>、<b>介紹講者或頒獎<\/b>。每種類型的開頭幾乎都有固定說法。","a":"就像看電視時<b>聽到前奏就知道是哪個節目<\/b>：Attention, passengers 就是廣播；Hi, this is ... calling 就是留言。","w":{"type":"grid","cols":["類型","常見開頭","常考問題"],"rows":[["電話留言","Hi, this is ... calling from ...","誰打來？目的？要聽者做什麼？"],["公共廣播","Attention, passengers / shoppers","地點？什麼改變了？提供什麼？"],["會議開場","Thanks for coming / Let's get started","聽者是誰？主題？下一步？"],["廣告","Are you looking for ...?","賣什麼？優惠？怎麼購買？"],["導覽","Welcome to ... I'm your guide","地點？行程順序？禁止事項？"],["新聞／路況","This is ... with your traffic update","原因？建議？接下來播什麼？"],["介紹與頒獎","It's my pleasure to introduce ...","這個人的成就？獎品？"]]},"k":["電話留言最常問「打電話的目的」和「要聽者做什麼」","廣播最常問「改變了什麼」","廣告最常問「優惠是什麼」"],"q":{"q":"聽到 \"Attention, shoppers.\" 這段獨白最可能是？","o":["商店廣播","電話留言","產品廣告","新聞報導"],"a":0,"e":"Attention, shoppers 是賣場、百貨公司的廣播開頭。"}}],"p5g":[{"t":"先看選項：三秒判斷題型","b":"Part 5 有 30 題，平均每題只能用 <b>20–30 秒<\/b>。第一步不是讀題目，而是<b>先看四個選項<\/b>：<br><b>詞性題<\/b>：四個選項同字根不同詞性（success / successful / successfully / succeed）→ 只看空格前後就能答。<br><b>文法題<\/b>：選項是同一動詞的不同形式、或連接詞／介系詞／代名詞 → 要看句子結構。<br><b>單字題<\/b>：四個選項詞性相同、意思不同 → 要讀懂句意與搭配詞。","a":"像<b>醫生看診先分科<\/b>：先知道是哪一科的病，才知道要做哪種檢查，不用每個病人都全身健檢。","w":{"type":"sort","tip":"看選項判斷這是哪一類題目","buckets":["詞性題","文法題","單字題"],"items":[["(A) create (B) creative (C) creatively (D) creation",0,"同字根不同詞性。"],["(A) submit (B) submitted (C) submitting (D) to submit",1,"同一動詞的不同形式，考時態、語態或動狀詞。"],["(A) although (B) despite (C) however (D) because",1,"連接詞、介系詞、副詞的區分。"],["(A) reserve (B) deserve (C) conserve (D) preserve",2,"都是動詞，意思不同。"],["(A) he (B) him (C) his (D) himself",1,"代名詞格位。"],["(A) profit (B) profitable (C) profitably (D) profitability",0,"同字根不同詞性。"],["(A) issue (B) matter (C) topic (D) subject",2,"都是名詞，考語意與搭配。"]]},"k":["詞性題最快：只看空格前後","文法題看句子結構：主詞、動詞、子句","單字題要讀懂句意，搭配詞是關鍵"],"q":{"q":"選項是 (A) efficient (B) efficiently (C) efficiency (D) efficiencies，這是哪一類題？","o":["詞性題","時態題","單字題","連接詞題"],"a":0,"e":"四個選項同字根、不同詞性，是詞性題。"}},{"t":"詞性位置規則：空格前後決定一切","b":"詞性題約佔 Part 5 的四分之一到三分之一，是最穩定的得分題。記住幾個位置規則：","a":"句子像<b>樂高<\/b>：每個位置只能卡進特定形狀的積木，看凹槽的形狀（前後字）就知道要放哪一塊。","w":{"type":"grid","cols":["空格位置","要放","例子"],"rows":[["冠詞 a/the、所有格 his/our 之後","名詞（或形容詞＋名詞）","the <b>success<\/b> of the project"],["介系詞之後","名詞／動名詞","for <b>approval<\/b> / by <b>using<\/b>"],["名詞之前","形容詞","a <b>reliable<\/b> supplier"],["be 動詞之後","形容詞（或 p.p. / V-ing）","The plan is <b>feasible<\/b>."],["動詞前後、句首句尾","副詞","<b>carefully<\/b> review / arrive <b>promptly<\/b>"],["be 動詞與 p.p. 之間","副詞","is <b>widely<\/b> used"],["形容詞之前","副詞","<b>extremely<\/b> popular"],["助動詞之後","原形動詞","will <b>expand<\/b>"]]},"k":["冠詞、所有格、介系詞後面 → 名詞","修飾名詞 → 形容詞；修飾動詞、形容詞、整句 → 副詞","be + ___ + p.p. 中間 → 副詞"],"q":{"q":"\"The new policy has been ------- accepted by employees.\" 空格要放什麼詞性？","o":["副詞","形容詞","名詞","動詞"],"a":0,"e":"has been 和 accepted 之間修飾過去分詞，放副詞，例如 widely。"}},{"t":"字尾辨詞性：不認識的字也能答","b":"就算不認識單字，看<b>字尾<\/b>也能猜出詞性：<br>名詞：-tion, -sion, -ment, -ness, -ity, -ance/-ence, -er/-or（人）, -ee（人）, -ist（人）<br>形容詞：-ful, -less, -ous, -ive, -able/-ible, -al, -ic, -ent/-ant<br>副詞：大多是 -ly（但 friendly、costly、timely 是形容詞！）<br>動詞：-ize, -ify, -en, -ate","a":"字尾像<b>制服<\/b>：看到穿 -tion 制服的就是名詞家族，穿 -ly 制服的多半是副詞家族——但要小心少數「穿錯制服」的例外。","w":{"type":"sort","tip":"看字尾判斷詞性","buckets":["名詞","形容詞","副詞","動詞"],"items":[["reliability",0,"-ity 名詞字尾。"],["informative",1,"-ive 形容詞字尾。"],["simplify",3,"-ify 動詞字尾。"],["punctually",2,"-ly 副詞。"],["costly",1,"陷阱！cost + ly 是形容詞「昂貴的」。"],["employee",0,"-ee 表示「被……的人」。"],["strengthen",3,"-en 動詞字尾：加強。"],["timely",1,"陷阱！timely 是形容詞「及時的」。"],["maintenance",0,"-ance 名詞字尾。"],["prioritize",3,"-ize 動詞字尾。"]]},"k":["名詞字尾：-tion, -ment, -ness, -ity, -ance","形容詞字尾：-ive, -ful, -ous, -able, -al","friendly, costly, timely, likely 是形容詞"],"q":{"q":"下列哪一個是形容詞，不是副詞？","o":["friendly","quickly","frequently","recently"],"a":0,"e":"friendly 是名詞 friend + ly 形成的形容詞（友善的）。"}},{"t":"時態：找時間訊號字","b":"時態題的答案幾乎都藏在<b>時間訊號字<\/b>裡：<br><b>過去式<\/b>：yesterday, last week, ago, in 2020<br><b>現在完成式<\/b>：since, for + 期間, recently, already, so far, over the past...<br><b>未來式<\/b>：tomorrow, next month, soon, upcoming<br><b>未來完成式<\/b>：by the time + 現在式, by next year<br><b>時間／條件子句<\/b>（when, if, before, after, as soon as, once）用<b>現在式表未來<\/b>。","a":"時間訊號字像<b>路標<\/b>：看到 since 就轉進「完成式」車道，看到 ago 就轉進「過去式」車道。","w":{"type":"fill","items":[["Ms. Kim ___ for this company since 2018.",["has worked","worked","works"],0,"since + 過去時間點 → 現在完成式。"],["The package ___ two days ago.",["arrived","has arrived","arrives"],0,"ago → 過去式，不能用現在完成式。"],["We will start the meeting as soon as everyone ___.",["arrives","will arrive","arrived"],0,"as soon as 時間子句用現在式表未來。"],["By the end of this year, we ___ 20 new stores.",["will have opened","opened","have opened"],0,"By + 未來時間 → 未來完成式。"],["Over the past five years, sales ___ steadily.",["have grown","grew","will grow"],0,"over the past + 期間 → 現在完成式。"]]},"k":["ago / yesterday / last → 過去式","since / for / over the past → 現在完成式","if / when / as soon as 子句用現在式表未來"],"q":{"q":"\"If it ------- tomorrow, the picnic will be canceled.\"","o":["rains","will rain","rained","has rained"],"a":0,"e":"if 條件子句用現在式表未來：If it rains tomorrow..."}},{"t":"主動被動與分詞：誰做？誰被做？","b":"選項出現同一動詞的 V / V-ing / p.p. / be p.p. 時，先問：<b>主詞是「做動作的人」還是「被做的東西」？<\/b><br>報告、會議、產品通常是<b>被<\/b>做的：The report <b>was submitted<\/b>. The meeting <b>will be held<\/b>.<br>分詞當形容詞時：主動用 <b>V-ing<\/b>（an <b>exciting<\/b> plan 令人興奮的計畫），被動或感受用 <b>p.p.<\/b>（<b>excited<\/b> staff 感到興奮的員工；<b>attached<\/b> file 附加的檔案）。<br>小技巧：空格後面<b>有受詞<\/b>多半是主動，<b>沒有受詞<\/b>（或接 by）多半是被動。","a":"主被動像<b>寄包裹<\/b>：寄件人（主動）寄出包裹；包裹（被動）被寄出。包裹自己不會寄自己。","w":{"type":"fill","items":[["The new branch ___ next month.",["will be opened","will open it","opening"],0,"分店是被開設的（也可以說 will open，但選項中 will open it 多了受詞）。"],["Please read the ___ document before the meeting.",["attached","attaching","attach"],0,"文件是「被附加的」→ attached。"],["The results of the survey were ___.",["surprising","surprised","surprise"],0,"結果「令人驚訝」→ surprising。"],["Employees ___ in the program should sign up by Friday.",["interested","interesting","interest"],0,"員工「感到有興趣的」→ interested。"],["All applications ___ by the HR department.",["are reviewed","review","reviewing"],0,"申請書是被審查的，後面接 by。"]]},"k":["主詞是事物且後面沒受詞 → 多半被動","感覺動詞：人 → p.p.（interested），事物 → V-ing（interesting）","attached / enclosed / updated / detailed 常當形容詞用"],"q":{"q":"\"Please review the ------- schedule.\"（行程已經被修改過）","o":["revised","revising","revise","revision"],"a":0,"e":"行程是被修改過的，用過去分詞 revised 修飾名詞。"}},{"t":"連接詞、介系詞、副詞：看後面接什麼","b":"這是 Part 5、6 的必考題。判斷方法只有一個：<b>看空格後面是子句還是名詞<\/b>。<br><b>連接詞<\/b> + 子句（主詞＋動詞）：although, because, while, unless, once, whereas<br><b>介系詞<\/b> + 名詞／V-ing：despite, because of, due to, during, in spite of, prior to<br><b>連接副詞<\/b>：放在句首或分號後面、要加逗號：however, therefore, moreover, nevertheless","a":"連接詞是<b>雙向車道的連接橋<\/b>，兩邊都是完整的路（子句）；介系詞是<b>停車格<\/b>，後面只能停一輛車（名詞）。","w":{"type":"sort","tip":"這個字是連接詞、介系詞、還是連接副詞？","buckets":["連接詞（接子句）","介系詞（接名詞）","連接副詞"],"items":[["although",0,"Although it rained, ..."],["despite",1,"Despite the rain, ..."],["because of",1,"because of the delay"],["however",2,"...; however, ..."],["while",0,"while I was out"],["during",1,"during the meeting"],["therefore",2,"...; therefore, ..."],["unless",0,"unless you call"],["due to",1,"due to bad weather"],["nevertheless",2,"...; nevertheless, ..."]]},"k":["後面是子句 → 連接詞；是名詞 → 介系詞","although = though = even though（連接詞）；despite = in spite of（介系詞）","however 是副詞，不能直接連接兩個子句"],"q":{"q":"\"------- the heavy traffic, Mr. Lee arrived on time.\"","o":["Despite","Although","However","Because"],"a":0,"e":"後面是名詞片語 the heavy traffic，要用介系詞 Despite。"}},{"t":"關係代名詞：缺什麼補什麼","b":"關係代名詞連接兩個句子，判斷步驟：<br>1. 看<b>先行詞<\/b>是人還是物：人 → who/whom/whose；物 → which；都可以 → that。<br>2. 看關係子句<b>缺什麼<\/b>：缺主詞 → who/which；缺受詞 → whom/which（可省略）；後面直接接名詞 → whose；子句完整、缺地點時間 → where/when。<br>3. <b>逗號後面不能用 that<\/b>。<br>4. 沒有先行詞時用 <b>what<\/b>（= the thing that）。","a":"關係代名詞像<b>拼圖的缺角<\/b>：看缺的是哪一塊（主詞、受詞、所有格），就補那一塊。","w":{"type":"fill","items":[["The manager ___ hired me has retired.",["who","which","whose"],0,"先行詞是人，子句缺主詞 → who。"],["The printer, ___ we bought last year, is broken.",["which","that","who"],0,"逗號後不能用 that，物 → which。"],["She is the designer ___ work won the award.",["whose","who","which"],0,"後面接名詞 work → 所有格 whose。"],["This is the hotel ___ we stayed last year.",["where","which","what"],0,"子句完整，缺地點 → where。"],["___ the client wants is a lower price.",["What","That","Which"],0,"沒有先行詞，What = the thing that。"]]},"k":["人 who、物 which、所有格 whose、地點 where","逗號後不用 that","沒有先行詞用 what"],"q":{"q":"\"Applicants ------- résumés are incomplete will not be considered.\"","o":["whose","who","which","whom"],"a":0,"e":"後面接名詞 résumés，表示「應徵者的履歷」，用所有格 whose。"}}],"p5v":[{"t":"字彙題怎麼解：搭配詞比字義更重要","b":"四個選項詞性相同、意思不同時，就是字彙題。很多時候四個字中文意思都說得通，關鍵在<b>英文的固定搭配（collocation）<\/b>。例如「參加訓練」是 <i>undergo / receive training<\/i>，不是 <i>join training<\/i>；「達成協議」是 <i>reach an agreement<\/i>。<br>解題順序：找出空格的<b>搭配對象<\/b>（動詞的受詞、名詞前的形容詞、後面的介系詞）→ 選最自然的組合。","a":"搭配詞像<b>咖啡配奶精<\/b>：咖啡配醬油在文法上沒錯，但沒有人這樣喝。","w":{"type":"steps","order":true,"items":[["確認是單字題","四個選項同詞性、不同意思"],["找空格的搭配對象","後面的受詞？前面的名詞？後面的介系詞？"],["刪掉文法不合的","及物／不及物、後面要接 to V 還是 V-ing"],["選最常見的搭配","例如 meet a deadline、place an order"],["不確定就選最常見的商務用法","多益反覆出現同一批搭配"]]},"k":["中文翻譯通順不代表英文正確","看介系詞：responsible for / eligible for / comply with","及物與不及物：attend the meeting / participate in the meeting"],"q":{"q":"「趕上截止期限」最自然的英文是？","o":["meet the deadline","catch the deadline","reach the deadline","do the deadline"],"a":0,"e":"meet a deadline 是固定搭配。"}},{"t":"高頻動詞搭配","b":"下面是多益反覆出現的動詞＋名詞搭配，點卡片看中文與例句。建議整組背，看到前半就能想到後半。","a":"背搭配詞像<b>背整首歌<\/b>：聽到前奏就能接下去唱，比一個字一個字背快多了。","w":{"type":"cards","items":[["place an order","下訂單<br><i>We placed an order for 50 chairs.<\/i>"],["meet a deadline","趕上期限<br><i>We must meet the deadline.<\/i>"],["make a reservation","預約<br><i>I'd like to make a reservation.<\/i>"],["submit a proposal","提交提案<br><i>Please submit your proposal by Friday.<\/i>"],["conduct a survey","進行調查<br><i>We conducted a customer survey.<\/i>"],["launch a product","推出產品<br><i>They launched a new phone.<\/i>"],["reach an agreement","達成協議<br><i>Both sides reached an agreement.<\/i>"],["raise funds","籌募資金<br><i>The event raised funds for charity.<\/i>"],["file a complaint","提出申訴<br><i>He filed a complaint with the manager.<\/i>"],["take effect","生效<br><i>The new rule takes effect today.<\/i>"],["undergo renovation","進行整修<br><i>The lobby is undergoing renovation.<\/i>"],["address a problem","處理問題<br><i>We need to address this problem.<\/i>"]]},"k":["place an order、meet a deadline、take effect 是超高頻","address 當動詞是「處理」","conduct 常搭配 survey / research / interview"],"q":{"q":"\"The new regulations will ------- effect on July 1.\"","o":["take","make","do","have"],"a":0,"e":"take effect（生效）是固定片語。"}},{"t":"易混淆字：長得像、意思差很多","b":"多益很愛把<b>拼字相近<\/b>的字放在同一題：complimentary（免費的）vs complementary（互補的）、affect（影響，v.）vs effect（效果，n.）、personal（個人的）vs personnel（人員）、adapt（適應）vs adopt（採用）。點開卡片複習。","a":"像<b>雙胞胎<\/b>：長得很像，但個性完全不同，要靠小細節分辨。","w":{"type":"cards","items":[["complimentary / complementary","免費贈送的 / 互補的"],["affect / effect","影響（v.）/ 效果、影響（n.）"],["personal / personnel","個人的 / 人員、人事部"],["adapt / adopt","適應、改編 / 採用、收養"],["accept / except","接受 / 除了"],["lose / loose","遺失 / 鬆的"],["stationary / stationery","靜止的 / 文具"],["economic / economical","經濟的（相關）/ 節省的"],["considerable / considerate","相當大的 / 體貼的"],["respectful / respective","尊敬的 / 各自的"]]},"k":["complimentary breakfast = 免費早餐","personnel = 人員（集合名詞）","economical = 省錢的；economic = 經濟上的"],"q":{"q":"\"The hotel offers ------- Wi-Fi to all guests.\"（免費提供）","o":["complimentary","complementary","compliment","complement"],"a":0,"e":"complimentary = 免費贈送的。complementary 是互補的。"}},{"t":"介系詞片語：固定組合直接背","b":"形容詞或名詞後面要接哪個介系詞，是 Part 5 的常客。常見組合：<br><b>be responsible for<\/b> 負責、<b>be eligible for<\/b> 有資格、<b>be familiar with<\/b> 熟悉、<b>comply with<\/b> 遵守、<b>in charge of<\/b> 負責、<b>on behalf of<\/b> 代表、<b>in accordance with<\/b> 依照、<b>with regard to<\/b> 關於、<b>prior to<\/b> 在……之前、<b>in addition to<\/b> 除……之外。","a":"介系詞片語像<b>固定的鑰匙和鎖<\/b>：responsible 這把鎖只能用 for 這把鑰匙打開。","w":{"type":"fill","items":[["Ms. Lee is responsible ___ the training program.",["for","of","to"],0,"be responsible for。"],["All staff must comply ___ the safety rules.",["with","to","for"],0,"comply with。"],["I'm writing on behalf ___ the committee.",["of","for","with"],0,"on behalf of 代表。"],["Please arrive prior ___ 9 A.M.",["to","of","than"],0,"prior to = before。"],["Are you familiar ___ this software?",["with","to","of"],0,"be familiar with 熟悉。"],["The product is ___ high demand.",["in","on","at"],0,"in high demand 需求很高。"]]},"k":["responsible / eligible → for","comply / familiar → with","prior / in addition / due → to"],"q":{"q":"\"------- addition to a competitive salary, we offer health insurance.\"","o":["In","On","At","By"],"a":0,"e":"in addition to（除……之外）。"}},{"t":"多益主題字庫：八大情境","b":"多益單字幾乎都集中在職場情境。按主題背比按字母背有效得多，因為同一段對話或文章會出現同一組字。到<b>釣魚碼頭<\/b>可以用遊戲方式複習這八大主題共 160 個高頻單字。","a":"按主題背單字像<b>整理衣櫃<\/b>：上衣、褲子、外套分開放，要找的時候一下就找到。","w":{"type":"grid","cols":["主題","代表單字","常見場景"],"rows":[["辦公室日常","agenda, memo, deadline, extension","開會、行政、設備故障"],["人事招募","applicant, résumé, promote, eligible","徵才、面試、升遷、福利"],["財務會計","invoice, budget, reimburse, overdue","報帳、付款、預算、稽核"],["行銷業務","campaign, launch, competitor, survey","新產品、廣告、市場調查"],["旅遊交通","itinerary, fare, delay, accommodation","出差、機場、飯店"],["餐飲活動","catering, venue, refreshments, attendee","研討會、宴會、外燴"],["製造物流","inventory, shipment, defect, warehouse","工廠、出貨、庫存"],["合約客服","warranty, complaint, renew, valid","合約、保固、客訴、訂閱"]]},"k":["按主題背，同一段文章會出現同一組字","每天 30–50 字，搭配例句","釣魚碼頭可以隨機複習並記錄你答錯的字"],"q":{"q":"下列哪一個單字最可能出現在「財務會計」相關的文章？","o":["reimburse","itinerary","catering","defect"],"a":0,"e":"reimburse（核銷、退費）是報帳常用字。"}},{"t":"一字多義：熟悉的字，陌生的意思","b":"多益很愛考<b>常見字的商務意思<\/b>，Part 7 的同義字題也常考這種字：<br><b>address<\/b>：地址 → 處理（address a problem）、演講<br><b>issue<\/b>：問題 → 發行、核發（issue a refund）、期刊的一期<br><b>charge<\/b>：費用 → 負責（in charge of）、收費<br><b>book<\/b>：書 → 預訂<br><b>run<\/b>：跑 → 經營（run a business）<br><b>cover<\/b>：蓋 → 涵蓋、支付（cover the cost）、代班","a":"一字多義像<b>同一個人在不同場合的身分<\/b>：在家是爸爸，在公司是經理，看場合判斷。","w":{"type":"cards","items":[["address","處理<br><i>address customer concerns<\/i>"],["issue","核發、發行<br><i>issue a refund / the May issue<\/i>"],["charge","負責；收費<br><i>in charge of / charge a fee<\/i>"],["run","經營；舉辦<br><i>run a store / The sale runs until May.<\/i>"],["cover","支付；代班<br><i>cover travel expenses / cover for a colleague<\/i>"],["figure","數字<br><i>sales figures<\/i>"],["party","（合約的）一方<br><i>both parties signed<\/i>"],["term","條款；任期<br><i>terms and conditions<\/i>"]]},"k":["address / issue / cover 在多益常是動詞","figure = 數字；party = 當事人一方","同義字題要用上下文判斷，不能只看最常見的意思"],"q":{"q":"\"The company will cover all travel expenses.\" 中 cover 的意思是？","o":["支付","覆蓋","隱藏","報導"],"a":0,"e":"cover the expenses = 支付費用。"}}],"p6":[{"t":"Part 6 是什麼？四種題型","b":"Part 6 共 <b>4 篇短文 × 4 題 = 16 題<\/b>，文章類型有 e-mail、公告、信件、廣告、文章。和 Part 5 最大的不同是：<b>很多題要看上下文才能答<\/b>。<br>每篇固定有 <b>1 題插入句<\/b>（選一個完整句子放進空格），其他 3 題是詞性、文法、單字題。<br>建議每篇用 <b>2 分鐘左右<\/b>完成。","a":"Part 5 像<b>單張拼圖<\/b>，Part 6 像<b>拼一整幅畫<\/b>：每一塊都要和旁邊的圖案接得上。","w":{"type":"layers","items":[{"h":"詞性題","s":"和 Part 5 一樣","tag":"快","d":"看空格前後的位置，通常不用讀上下文。"},{"h":"時態題","s":"要看上下文","tag":"陷阱","d":"單看那一句可能四個時態都對，要看文章日期、前後句的時間來判斷。"},{"h":"連接副詞題","s":"however / therefore / in addition","tag":"常考","d":"判斷前後兩句的邏輯關係：轉折、因果、補充、舉例。"},{"h":"插入句題","s":"選一整句放進文章","tag":"每篇 1 題","d":"看空格前後句，找代名詞（it, they, this）、指示詞、連接詞的線索。"}]},"k":["Part 6 共 16 題，每篇 1 題插入句","時態題要看全文的時間點","每篇約 2 分鐘"],"q":{"q":"Part 6 每篇短文固定會有幾題插入句？","o":["1 題","2 題","4 題","不一定有"],"a":0,"e":"新制 Part 6 每篇都有一題「選擇最適合的句子插入」。"}},{"t":"時態題：從上下文找時間","b":"Part 6 的時態題，<b>只看空格那一句常常無法判斷<\/b>。例如 <i>The workshop ------- in Room 3.<\/i> 可以是過去、現在或未來。要回到文章找線索：e-mail 的日期、前一句提到的時間、文章是「預告」還是「回顧」。","a":"就像接到朋友一句「我們在餐廳」：要看他是傳「昨天的照片」還是「現在的定位」，才知道是過去還是現在。","w":{"type":"fill","items":[["（公告：下週的活動）The seminar ___ in the main hall.",["will be held","was held","has been held"],0,"公告在預告下週活動 → 未來式。"],["（感謝信：昨天的演講）Your talk ___ very well received.",["was","will be","is being"],0,"回顧昨天的事 → 過去式。"],["（通知：目前施工中）The lobby ___ renovated this week.",["is being","was","will have been"],0,"這週正在進行 → 現在進行式被動。"],["（新聞：剛宣布）The company ___ a new CEO.",["has appointed","will appoint","appoints"],0,"剛發生、對現在有影響 → 現在完成式。"]]},"k":["先看文件日期與內容是預告還是回顧","感謝信、報告多用過去式；公告、邀請多用未來式","一句話四個時態都可能時，答案一定在上下文"],"q":{"q":"一封 e-mail 寫「感謝您上週參加我們的研討會」，接下來描述研討會內容最可能用哪個時態？","o":["過去式","未來式","現在進行式","未來完成式"],"a":0,"e":"研討會已經在上週結束，描述它用過去式。"}},{"t":"轉折語：判斷前後句的關係","b":"Part 6 很愛考句首的<b>連接副詞<\/b>，要先判斷前後兩句的關係：<br><b>轉折<\/b>：however, nevertheless, on the other hand<br><b>因果<\/b>：therefore, as a result, consequently<br><b>補充<\/b>：in addition, moreover, furthermore, also<br><b>舉例<\/b>：for example, for instance<br><b>時間順序<\/b>：then, afterward, meanwhile, finally<br><b>替代<\/b>：instead, otherwise","a":"轉折語像<b>導航的方向指示<\/b>：however 是「迴轉」，therefore 是「直走到目的地」，in addition 是「順路再停一站」。","w":{"type":"sort","tip":"這個轉折語表示什麼關係？","buckets":["轉折","因果","補充","舉例"],"items":[["however",0,"前後相反。"],["as a result",1,"前因後果。"],["moreover",2,"再補充一點。"],["for instance",3,"舉例說明。"],["nevertheless",0,"儘管如此。"],["therefore",1,"因此。"],["in addition",2,"此外。"],["on the other hand",0,"另一方面（對比）。"],["consequently",1,"結果、因此。"]]},"k":["前後相反 → however / nevertheless","前因後果 → therefore / as a result","再加一點 → in addition / moreover"],"q":{"q":"\"Our sales rose by 20%. -------, we plan to hire more staff.\"","o":["Therefore","However","For example","Otherwise"],"a":0,"e":"銷售成長 → 所以要多請人，因果關係用 Therefore。"}},{"t":"插入句題：抓代名詞和指示詞","b":"插入句題是 Part 6 最難的題型。四個選項都是文法正確的句子，要選<b>和上下文最連貫的<\/b>。解題線索：<br><b>代名詞<\/b>：下一句的 it / they / this 指的是什麼？那個東西必須在插入句裡出現。<br><b>指示詞<\/b>：this offer、these changes、such requests 要有前文。<br><b>連接詞<\/b>：also、however、as a result 開頭的句子要和前一句有對應關係。<br><b>刪去法<\/b>：和文章主題無關、或與內容矛盾的先刪。","a":"插入句題像<b>補一段影片的漏格<\/b>：前一格人站著、後一格人坐著，中間那格一定是「坐下」的動作。","w":{"type":"steps","order":true,"items":[["讀空格前一句","說到哪裡了？最後提到的名詞是什麼？"],["讀空格後一句","有沒有 it、this、they、also 等需要前文的字？"],["檢查每個選項","它能不能接前一句？後一句的代名詞能不能指到它？"],["刪掉無關或矛盾的句子","提到文章沒提過的主題、或與日期內容衝突"],["選最連貫的那句","讀起來前中後一氣呵成"]]},"k":["下一句的 it / this / they 是最強線索","跟主題無關的句子先刪","與內容矛盾（例如日期衝突）的句子一定錯"],"q":{"q":"空格後一句是 \"Simply print it and attach it to the box.\"，插入句最可能是？","o":["A shipping label will be e-mailed to you.","Our store opens at 9 A.M.","Thank you for shopping with us.","Refunds take five days."],"a":0,"e":"下一句要 print it，it 必須是可以列印的東西 → shipping label。"}},{"t":"書信常用句型：開頭、結尾、客套話","b":"Part 6、7 的書信有很多固定句型，熟悉之後讀得更快，也能直接猜出插入句：<br>開頭說明目的：<i>I am writing to...<\/i> / <i>This is to inform you that...<\/i><br>附件：<i>Please find attached...<\/i> / <i>Enclosed is...<\/i><br>道歉：<i>We apologize for any inconvenience.<\/i><br>結尾邀請聯絡：<i>Please do not hesitate to contact me.<\/i> / <i>Should you have any questions, ...<\/i><br>期待：<i>We look forward to hearing from you.<\/i>","a":"書信句型像<b>客服的標準話術<\/b>：開場、說明、道歉、結尾，每一段都有固定說法。","w":{"type":"cards","items":[["I am writing to...","我寫信是為了……（說明目的）"],["Please find attached...","附件是……"],["We regret to inform you that...","很遺憾通知您……（壞消息）"],["We are pleased to announce...","很高興宣布……（好消息）"],["Should you have any questions, ...","若有任何問題……（倒裝條件句）"],["Please do not hesitate to contact me.","請隨時與我聯絡。"],["We look forward to hearing from you.","期待您的回覆。（to + V-ing）"],["Thank you for your understanding.","感謝您的體諒。"]]},"k":["look forward to + V-ing","Should you have... = If you should have...","We regret to inform you 後面接壞消息"],"q":{"q":"\"We look forward to ------- you at the event.\"","o":["seeing","see","seen","be seeing"],"a":0,"e":"look forward to 的 to 是介系詞，接動名詞 seeing。"}}],"p7":[{"t":"文件類型地圖：先認出這是什麼","b":"Part 7 共 <b>54 題<\/b>：單篇 29 題（約 10 篇）、雙篇 2 組 10 題、三篇 3 組 15 題。文件類型很固定，<b>先看標題和格式認出類型<\/b>，就能預測會考什麼。","a":"像<b>拿到一封信先看信封<\/b>：帳單、喜帖、廣告傳單一眼就分得出來，裡面寫什麼也大概猜得到。","w":{"type":"grid","cols":["文件類型","長相","常考"],"rows":[["E-mail／信件","To / From / Subject","寫信目的、要收件人做什麼、附件"],["公告／通知","NOTICE、ATTENTION","對象、時間地點、改變了什麼"],["廣告","大標題、價格、優惠","賣什麼、優惠條件、如何購買"],["文章／新聞","標題、日期、引述","主旨、人物、原因、未來計畫"],["簡訊／線上聊天","人名＋時間","意圖題（某句話的意思）、下一步"],["表格／發票","欄位、數字","金額計算、日期、勾選項目"],["網頁／評論","星等、選單","優缺點、推論"]]},"k":["單篇 29 題、雙篇 10 題、三篇 15 題","先看文件類型與標題，預測題目","簡訊題幾乎必考意圖題"],"q":{"q":"看到文件有 To、From、Subject 欄位，這最可能是？","o":["E-mail","廣告","發票","新聞"],"a":0,"e":"To / From / Subject 是 e-mail 的標準格式。"}},{"t":"先看題目再讀文章：掃描與略讀","b":"Part 7 不要從頭精讀。有效的流程是：<br>1. <b>先看題目<\/b>（不一定要看選項），圈出關鍵字：人名、數字、日期、專有名詞。<br>2. <b>掃描（scanning）<\/b>：帶著關鍵字去文章找對應的位置，只細讀那一兩句。<br>3. <b>略讀（skimming）<\/b>：主旨題才需要快速看開頭和結尾。<br>4. 選項和原文比對，正解通常是<b>同義改寫<\/b>。","a":"像<b>在字典裡查字<\/b>：你不會從第一頁讀起，而是直接翻到那個字母、找到那個字。","w":{"type":"steps","order":true,"items":[["看題目，圈關鍵字","例如 Why did Ms. Park miss the deadline? → Ms. Park, deadline"],["判斷題型","主旨、細節、推論、NOT、同義字、意圖、插入"],["掃描文章找關鍵字","專有名詞、數字最好找"],["細讀前後一兩句","答案通常就在附近"],["比對選項的同義改寫","原文 business trip → 選項 traveling for work"]]},"k":["先看題目，帶著問題找答案","專有名詞、數字是最好的掃描目標","主旨題才需要看全文開頭結尾"],"q":{"q":"Part 7 最有效率的閱讀方式是？","o":["先看題目，再帶著關鍵字找答案","從頭到尾逐字精讀","只看選項，不看文章","先讀最後一段"],"a":0,"e":"先看題目再找答案，可以避免花時間讀和題目無關的部分。"}},{"t":"七種題型與解法","b":"Part 7 的題目問法很固定：","a":"題型像<b>工具箱裡的工具<\/b>：拿對工具（解法），螺絲才轉得動。","w":{"type":"layers","items":[{"h":"主旨／目的題","s":"What is the purpose of...? / What is mainly discussed?","tag":"開頭","d":"答案通常在第一段或標題。e-mail 的目的常在 I am writing to... 之後。"},{"h":"細節題","s":"What / When / Where / How much...?","tag":"最多","d":"用題目關鍵字掃描文章，答案常是同義改寫。"},{"h":"推論題","s":"What is suggested / implied / most likely true?","tag":"","d":"答案不會直接寫出，但一定有根據。不要用自己的常識推太遠。"},{"h":"NOT 題","s":"What is NOT mentioned / true?","tag":"費時","d":"四個選項中三個在文章裡找得到，找不到（或矛盾）的那個就是答案。可以最後做。"},{"h":"同義字題","s":"The word \"...\" is closest in meaning to","tag":"快","d":"一定要看上下文，常考一字多義（cover、address、figure）。把選項代回句子看是否通順。"},{"h":"意圖題","s":"At 10:15, what does X mean when he writes, \"...\"?","tag":"簡訊","d":"看那句話前後的對話，判斷說話者的真正意思。"},{"h":"插入句題","s":"In which position [1]–[4] does the sentence belong?","tag":"","d":"和 Part 6 一樣找代名詞、指示詞、連接詞線索。"}]},"k":["NOT 題最費時，可以放到最後","同義字題一定要把選項代回原句","推論題要有文章根據，不能腦補"],"q":{"q":"\"What is NOT mentioned in the article?\" 最好的解法是？","o":["逐一在文章找到三個有提到的選項，剩下的就是答案","選最長的選項","只讀第一段","選和文章最無關的字"],"a":0,"e":"NOT 題用刪去法：把文章有提到的三個刪掉。"}},{"t":"同義字題：代回原句看看","b":"同義字題問「某個字最接近哪個意思」，<b>四個選項通常都是那個字的可能意思<\/b>，只有一個符合上下文。方法：把每個選項<b>代回原句<\/b>，讀起來最通順、意思沒變的就是答案。","a":"像<b>試穿鞋子<\/b>：四雙鞋都是你的尺寸，但只有一雙適合今天的場合。","w":{"type":"fill","items":[["\"The company will <b>cover<\/b> your hotel costs.\" cover ≈",["pay for","hide","report on","protect"],0,"公司會支付住宿費。"],["\"We need to <b>address<\/b> these complaints quickly.\" address ≈",["deal with","speak to","write on","locate"],0,"處理客訴。"],["\"Sales <b>figures<\/b> for May were higher than expected.\" figures ≈",["numbers","shapes","people","pictures"],0,"銷售數字。"],["\"The offer is <b>valid<\/b> until June 30.\" valid ≈",["effective","true","strong","logical"],0,"優惠有效到六月底。"],["\"Please <b>observe<\/b> all safety rules.\" observe ≈",["follow","watch","notice","celebrate"],0,"observe rules = 遵守規定。"]]},"k":["把選項代回原句，看意思是否不變","常考一字多義的常見字","最常見的意思往往是陷阱"],"q":{"q":"\"The meeting room can accommodate 50 people.\" accommodate 最接近？","o":["hold","please","adjust","lend"],"a":0,"e":"會議室可以容納 50 人，accommodate = hold。"}},{"t":"雙篇與三篇：跨文件對照","b":"多篇閱讀每組 5 題，通常有 <b>1–2 題需要同時看兩篇<\/b>才能答。常見的對照方式：<br>第一篇有<b>規則或價目表<\/b>，第二篇有<b>某人的情況<\/b> → 判斷他適用哪一條。<br>第一篇有<b>日期或期限<\/b>，第二篇有<b>某人的行動日期<\/b> → 判斷是否來得及。<br>三篇閱讀先看每篇的<b>類型和寫信者<\/b>，畫出「誰對誰、做了什麼」的關係。","a":"像<b>對發票和購物清單<\/b>：清單寫要買什麼，發票寫實際買了什麼，兩張一比就知道漏買了哪樣。","w":{"type":"steps","order":true,"items":[["先看每篇的類型與標題","廣告＋報名表＋E-mail？公告＋E-mail？"],["看 5 題題目，標出需要跨篇的","Look for 人名、日期、價格出現在不同篇"],["先做只需一篇的題目","通常第 1、2 題只看第一篇"],["跨篇題：把兩篇的資訊配對","例如 E-mail 說『週四的課』→ 廣告查週四是哪一門"],["注意更改與例外","instead、no longer、has been moved"]]},"k":["多篇閱讀每組 5 題，至少 1 題跨篇","日期、價格、人名是跨篇的連結點","先做單篇就能答的題目"],"q":{"q":"廣告寫「2/15 前報名打 85 折」，報名表日期是 2/10。可以推論什麼？","o":["這位報名者可以享有折扣","報名者錯過了期限","課程被取消了","報名者要付全額"],"a":0,"e":"2/10 早於 2/15，符合早鳥優惠，這就是典型的跨篇推論。"}},{"t":"時間不夠怎麼辦？取捨策略","b":"Part 7 寫不完是最常見的問題。策略：<br><b>先易後難<\/b>：簡訊、短公告、表單通常最快；長篇文章和三篇閱讀可以留到後面。<br><b>不在一題卡超過 2 分鐘<\/b>：先猜一個，做記號，最後有時間再回來。<br><b>NOT 題、插入句題比較費時<\/b>，可以放到該組最後做。<br><b>最後一分鐘全部畫滿<\/b>，答錯不倒扣。","a":"像<b>考試時先做會的題目<\/b>：把會的分數先拿到手，難題留給剩下的時間。","w":{"type":"sort","tip":"時間緊迫時，這類題目要先做還是後做？","buckets":["先做（快）","後做（費時）"],"items":[["簡訊對話的細節題",0,"篇幅短，很快找到答案。"],["同義字題",0,"只要看一句話。"],["三篇閱讀的跨篇推論題",1,"要讀三篇並對照。"],["NOT 題",1,"要在文章裡找三個選項。"],["表單的金額題",0,"直接看數字。"],["長篇文章的插入句題",1,"要理解整篇結構。"],["廣告的優惠內容題",0,"通常有醒目的標示。"]]},"k":["不在一題卡超過 2 分鐘","NOT 題、插入句題、跨篇題可以後做","時間到前全部畫滿，不倒扣"],"q":{"q":"Part 7 剩下 3 分鐘還有 8 題沒做，最好的做法是？","o":["全部先畫一個答案，有時間再看","仔細做完其中 2 題，其他空著","全部空著","只做最後一題"],"a":0,"e":"多益答錯不倒扣，先確保每題都有答案，再用剩下時間盡量做。"}}]};</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   Data
   ========================================================= */
const { islands, questions, sets: SETS, vocab: VOCAB } = window.DATA;
const QMAP = new Map(questions.map(q => [q.id, q]));
const HUB = { id:'hub', subj:0, name:'中央港口廣場', nick:'多益廣場', emoji:'⛲', q:0, r:0, chap:'群島總覽', sec:'', kp:[] };
const ALL = [HUB, ...islands];
const IMAP = new Map(ALL.map(i => [i.id, i]));
const QBY = {}; islands.forEach(i => QBY[i.id] = []); questions.forEach(q => QBY[q.i].push(q));
const SUBJ = { 1:'聽力 Listening', 2:'閱讀 Reading' };
const SUBJ_SHORT = { 0:'群島總覽', 1:'聽力', 2:'閱讀' };
const ISL_COLOR = { p1:'#f5c376', p2:'#f3a28a', p34:'#eaa6c4', p5g:'#8fd3c1', p5v:'#93c4ee', p6:'#acd98b', p7:'#9fb0f2' };
const PART_ISL = { 1:'p1', 2:'p2', 3:'p34', 4:'p34', 5:'p5g', 6:'p6', 7:'p7' };
const PART_NAME = { 1:'照片描述', 2:'應答問題', 3:'簡短對話', 4:'簡短獨白', 5:'句子填空', 6:'段落填空', 7:'閱讀測驗' };
const islandColor = i => i.id === 'hub' ? '#f1e2c6' : ISL_COLOR[i.id];
const LETTERS = 'ABCD';
const isListen = q => q.pt <= 4;
const hideText = q => q.pt <= 2;            // Part 1–2: stem and options are only heard
const srcLabel = q => `Part ${q.pt}・${q.t}`;
const srcLong = q => `本站依多益（TOEIC L&R）官方題型原創的練習題，不是 ETS 官方試題。${isListen(q) ? '語音由你的瀏覽器即時朗讀。' : ''}`;
const stemText = q => q.pt === 1 ? `【照片】${q.ph.d}` : q.p && q.pt >= 6 ? `${SETS[q.p].t}｜${q.q}` : q.q;
const stripTags = h => String(h || '').replace(/<[^>]+>/g, ' ');
const searchText = q => q._s || (q._s = [stemText(q), q.o.join(' '), q.e, q.t, q.p ? (SETS[q.p].au ? SETS[q.p].au.map(x => x[1]).join(' ') + SETS[q.p].zh : SETS[q.p].docs.map(d => stripTags(d[1])).join(' ')) : ''].join(' ').toLowerCase());

/* =========================================================
   Session store (memory + sessionStorage, no database)
   ========================================================= */
const KEY = 'toeic-isles-v1';
const store = { attempts: [], marks: new Set(), sound: true, music: true, fish: {}, introSeen: false, voice: { rate: 1, accent: 'mix', auto: true }, words: {} };
const LS = (() => { try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return localStorage; } catch (e) { try { return sessionStorage; } catch (e2) { return null; } } })();
try {
  const raw = LS && LS.getItem(KEY);
  if (raw) { const s = JSON.parse(raw); store.attempts = (s.attempts || []).filter(a => QMAP.has(a.q)); store.marks = new Set((s.marks || []).filter(id => QMAP.has(id))); store.sound = s.sound !== false; store.music = s.music !== false; store.layout = s.layout || 'side'; store.fish = s.fish || {}; store.tut = s.tut || {}; store.introSeen = !!s.introSeen; store.voice = Object.assign(store.voice, s.voice || {}); store.words = s.words || {}; store.examCfg = s.examCfg || null; }
} catch (e) {}
function save() {
  try { LS && LS.setItem(KEY, JSON.stringify({ attempts: store.attempts, marks: [...store.marks], sound: store.sound, music: store.music, fish: store.fish, tut: store.tut, layout: store.layout, introSeen: store.introSeen, voice: store.voice, words: store.words, examCfg: store.examCfg })); } catch (e) {}
}
function lastMap() { const m = new Map(); for (const a of store.attempts) m.set(a.q, a); return m; }
function islandStats(iid) {
  const lm = lastMap(); const pool = iid === 'hub' ? questions : QBY[iid];
  let answered = 0, correct = 0;
  for (const q of pool) { const a = lm.get(q.id); if (a) { answered++; if (a.ok) correct++; } }
  return { total: pool.length, answered, correct, acc: answered ? correct / answered : null };
}
function streak() { let s = 0; for (let k = store.attempts.length - 1; k >= 0 && store.attempts[k].ok; k--) s++; return s; }
function masteryColor(st) {
  if (!st.answered) return '#ffffff';
  if (st.acc >= .8) return '#3fb56f';
  if (st.acc >= .6) return '#f2b134';
  return '#e0574c';
}
function record(q, pick, ctx) {
  const ok = pick === q.a;
  store.attempts.push({ q: q.id, p: pick, ok, t: Date.now(), c: ctx });
  save(); refreshStats(); updateFlags();
  return ok;
}

/* =========================================================
   Utilities

function pick(cx, cy) {
  const rect = canvas.getBoundingClientRect();
  ptr.x = ((cx - rect.left) / rect.width) * 2 - 1; ptr.y = -((cy - rect.top) / rect.height) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  const hn = ray.intersectObjects(npcMeshes, false)[0];
  const hi = ray.intersectObjects(pickables, false)[0];
  if (hn && (!hi || hn.distance < hi.distance + .5)) return { npc: hn.object.userData.npc };

}

  const sec = { L: { n: 0, ok: 0 }, R: { n: 0, ok: 0 } };
