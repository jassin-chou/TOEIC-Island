  const l = sec.L.n ? interp(LT, sec.L.ok / sec.L.n) : null, r = sec.R.n ? interp(RT, sec.R.ok / sec.R.n) : null;
  const n = sec.L.n + sec.R.n, ok = sec.L.ok + sec.R.ok;
  return { sec, l, r, total: l != null && r != null ? l + r : null, acc: n ? ok / n : 0, ok, n };
}
function examResult() {
  const ex = exam; const S = examScores(); const s = Math.floor(((ex.end || Date.now()) - ex.start) / 1000);
  const by = {};
  for (const id of ex.list) { const q = QMAP.get(id); const b = by[q.pt] = by[q.pt] || { n: 0, ok: 0 }; b.n++; if (ex.picks.get(id) === q.a) b.ok++; }
  const wrong = ex.list.filter(id => ex.picks.has(id) && ex.picks.get(id) !== QMAP.get(id).a);
  const skipped = ex.list.filter(id => !ex.picks.has(id));
  const box = (v, t) => `<div><b>${v == null ? '–' : v}</b><span>${t}</span></div>`;
  return `<div class="sc2">${box(S.l, `聽力（${S.sec.L.ok}/${S.sec.L.n}）`)}${box(S.r, `閱讀（${S.sec.R.ok}/${S.sec.R.n}）`)}${box(S.total, '估計總分')}</div>
  <div class="score"><b style="color:${S.acc >= .7 ? 'var(--good)' : 'var(--bad)'}">${Math.round(S.acc * 100)}<small style="font-size:18px">%</small></b><div><div style="font-family:var(--f-display);font-weight:800;font-size:17px">${S.total != null ? `粗估落在 ${certTag(S.total)}` : `答對 ${S.ok}/${S.n} 題`}</div><div style="color:var(--ink-2);font-size:13px">未作答 ${skipped.length}・用時 ${Math.floor(s / 60)} 分 ${s % 60} 秒（建議 ${ex.mins} 分）。量尺分數是依答對率粗估，正式考試每回換算不同。</div></div></div>
  <h3>各 Part 得分</h3><div class="heat">${Object.entries(by).map(([pt, b]) => `<button data-isl-go="${PART_ISL[pt]}" style="border-color:${b.ok === b.n ? 'var(--good)' : b.ok / b.n < .6 ? 'var(--bad)' : 'var(--line)'}"><b>Part ${pt} ${PART_NAME[pt]}</b><span>${b.ok}/${b.n}・${pct(b.ok / b.n)}</span></button>`).join('')}</div>
  ${wrong.length ? `<h3>錯題與解析</h3>${wrong.map(id => reviewItem(QMAP.get(id), ex.picks.get(id))).join('')}` : ''}
  <div class="qnav"><button class="btn" data-act="exam-quit">結束</button><button class="btn pri" data-act="exam-again">再考一次</button></div>`;
}

/* =========================================================
   History modal
   ========================================================= */
let histFilter = 'all'; let clearArmed = false;
function openHistory() {
  const m = $('#modal'); const all = islandStats('hub'); const n = store.attempts.length; const ok = store.attempts.filter(a => a.ok).length;
  let list = store.attempts.slice().reverse();
  if (histFilter === 'wrong') list = list.filter(a => !a.ok);
  if (histFilter === 'mark') { const seen = new Set(); list = [...store.marks].map(id => ({ q: id, mark: true })).filter(x => !seen.has(x.q) && seen.add(x.q)); }
  const heat = islands.map(i => { const st = islandStats(i.id); return `<button data-isl-go="${i.id}" style="border-color:${st.answered ? masteryColor(st) : 'var(--line)'}"><b>${i.emoji} ${esc(i.nick)}</b><span>${st.answered}/${st.total}${st.answered ? ' · ' + pct(st.acc) : ''}</span></button>`; }).join('');
  m.innerHTML = `<div class="sheet card" role="dialog" aria-modal="true" aria-labelledby="h-h">
  <div class="p-head"><div class="p-emo" style="background:var(--paper-2)">📜</div><div class="p-title"><div class="p-crumb">保存在這台電腦的瀏覽器裡</div><h2 id="h-h">作答紀錄</h2></div><button class="x" data-h="close" aria-label="關閉">×</button></div>
  <div class="p-body">
   <div class="kv"><div><b>${n}</b><span>作答次數</span></div><div><b>${n ? pct(ok / n) : '–'}</b><span>整體正確率</span></div><div><b>${all.answered}/${all.total}</b><span>題庫覆蓋</span></div></div>
   <h3>島嶼熟練度</h3><div class="heat">${heat}</div>
   <h3>紀錄</h3><div class="row" style="justify-content:space-between"><div class="seg">${[['all', '全部'], ['wrong', '只看答錯'], ['mark', `收藏 ${store.marks.size}`]].map(([k, t]) => `<button data-hf="${k}" aria-pressed="${histFilter === k}">${t}</button>`).join('')}</div><button class="btn sm" data-h="clear">${clearArmed ? '再按一次確認清除' : '清除紀錄'}</button></div>
   <div style="margin-top:10px">${list.length ? `<ul class="log">${list.slice(0, 300).map(a => a.mark ? markRow(a.q) : logRow(a)).join('')}</ul>` : `<div class="empty">${histFilter === 'mark' ? '還沒有收藏題目。答題時點右上角的 ★ 收藏。' : '還沒有作答紀錄。點一座島開始練習。'}</div>`}</div>
  </div></div>`;
  m.hidden = false;
  m.onclick = e => {
    if (e.target === m) { m.hidden = true; clearArmed = false; return; }
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.h === 'close') { m.hidden = true; clearArmed = false; }
    else if (b.dataset.h === 'clear') { if (!clearArmed) { clearArmed = true; openHistory(); } else { store.attempts = []; save(); clearArmed = false; refreshStats(); updateFlags(); openHistory(); toast('已清除作答紀錄'); if (current) renderPanel(); } }
    else if (b.dataset.hf) { histFilter = b.dataset.hf; openHistory(); }
    else if (b.dataset.islGo) { m.hidden = true; selectIsland(b.dataset.islGo); }
    else if (b.dataset.redo) { m.hidden = true; const q = QMAP.get(b.dataset.redo); selectIsland(q.i, { quiz: { list: [q.id], label: '重做' } }); }
  };
}
function markRow(id) { const q = QMAP.get(id); const isl = IMAP.get(q.i); return `<li><span class="r" style="color:var(--sun)">★</span><span class="m"><span class="qt">${esc(stemText(q))}</span><small>${isl.emoji} ${esc(isl.nick)}・${srcLabel(q)}</small></span><button class="btn sm" data-redo="${q.id}">練習</button></li>`; }

/* =========================================================
   HUD + dock + keyboard
   ========================================================= */
function refreshStats() {
  const n = store.attempts.length, ok = store.attempts.filter(a => a.ok).length;
  $('#st-n').textContent = n; $('#st-acc').textContent = n ? pct(ok / n) : '–'; $('#st-streak').textContent = streak();
  $('#st-cov').textContent = `${lastMap().size}/${questions.length}`; $('#b-hist').textContent = n;
}
function setSoundBtn() { const b = $('#btn-sound'); b.textContent = store.sound ? '音效 開' : '音效 關'; b.setAttribute('aria-pressed', store.sound); }
document.querySelector('.dock').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const a = b.dataset.act;
  if (a === 'home') goHome();
  else if (a === 'exam') openExamSetup();
  else if (a === 'voice') openVoice();
  else if (a === 'history') openHistory();
  else if (a === 'fish') goFishing();
  else if (a === 'music') { if (music.on) { musicStop(); store.music = false; } else { store.music = true; musicStart(); } save(); }
  else if (a === 'sound') { store.sound = !store.sound; save(); setSoundBtn(); if (store.sound) beep(true); }
  else if (a === 'guide') $('#guide').classList.toggle('open');
});
addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  if (e.key === 'Escape') { const m = $('#modal'); if (!m.hidden) { m.hidden = true; return; } if ($('#guide').classList.contains('open')) { $('#guide').classList.remove('open'); return; } if (!panel.hidden) closePanel(); return; }
  if (!$('#modal').hidden || panel.hidden) return;
  if (fishingMode) {
    if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); if (fishTab !== 'rod') return; if (['idle', 'miss', 'done'].includes(fish.phase)) { cast(); } else if (['wait', 'bite'].includes(fish.phase)) pull(); return; }
    const fm = { a: 0, b: 1, c: 2, d: 3, '1': 0, '2': 1, '3': 2, '4': 3 }[e.key.toLowerCase()];
    if (fm != null && fish.phase === 'question') { e.preventDefault(); fishPick(fm); }
    return;
  }
  const inQuiz = exam ? !exam.done : (quiz && tab === 'quiz' && quiz.idx < quiz.list.length);
  if (!inQuiz) return;
  const map = { a: 0, b: 1, c: 2, d: 3, '1': 0, '2': 1, '3': 2, '4': 3 };
  const k = map[e.key.toLowerCase()];
  if (k != null) { e.preventDefault(); doPick(k); }
  else if (e.key.toLowerCase() === 'r') { const pb = panel.querySelector('[data-act="play"]'); if (pb && !pb.disabled) { e.preventDefault(); pb.click(); } }
  else if (e.key === 'Enter' || e.key === 'ArrowRight') {
    const ae = document.activeElement; if (e.key === 'Enter' && ae && ae.tagName === 'BUTTON' && !ae.disabled && !ae.classList.contains('opt')) return;
    const nb = panel.querySelector('[data-act="next"]'); if (nb) { e.preventDefault(); nb.click(); } }
  else if (e.key === 'ArrowLeft') { const pb = panel.querySelector('[data-act="prev"]'); if (pb && !pb.disabled) pb.click(); }
});

/* =========================================================
   Intro
   ========================================================= */
function showIntro() {
  const m = $('#modal');
  m.innerHTML = `<div class="intro card" role="dialog" aria-modal="true" aria-labelledby="in-h"><h2 id="in-h">歡迎來到多益群島</h2>
  <p>7 座六角小島對應多益 TOEIC Listening & Reading 的七個 Part，加上中央的多益廣場。共 ${questions.length} 題原創練習題、${Object.values(TUT).reduce((a, b) => a + b.length, 0)} 課互動教學和 ${VOCAB.words.length} 個高頻單字。</p>
  <ul><li><span>🖱️</span><div>拖曳旋轉、滾輪縮放、右鍵平移。點一座島就能看重點、上教學、開始答題。</div></li>
  <li><span>🔊</span><div>聽力題會用瀏覽器的英文語音<b>自動朗讀</b>，Part 1、2 的文字作答後才顯示。可以在下方「聲音」調整語速和口音。</div></li>
  <li><span>🧢</span><div>戴黃帽、披紅披風的是你的分身<b>小益</b>。你選哪座島，他就走過橋去那裡。</div></li>
  <li><span>🎣</span><div>到<b>單字釣魚碼頭</b>拋竿，每條魚帶來一個多益單字，答對才收進魚簍。</div></li>
  <li><span>📝</span><div>在多益廣場開<b>模擬考</b>，交卷後估算聽力、閱讀分數和證書顏色。</div></li>
  <li><span>🚩</span><div>島上旗子顯示熟練度：白色未作答、紅色低於 60%、黃色低於 80%、綠色 80% 以上。</div></li></ul>
  <div class="legend"><span><i class="flagdot" style="background:var(--m)"></i>西側暖色島：聽力 Part 1–4</span><span><i class="flagdot" style="background:var(--t)"></i>東側冷色島：閱讀 Part 5–7</span></div>
  <label style="display:flex;align-items:center;gap:8px;margin:-4px 0 12px;font-size:13.5px"><input type="checkbox" id="intro-music" ${store.music ? 'checked' : ''}> 播放背景配樂（聽力朗讀時會自動降低音量）</label>
  <button class="btn pri wide" data-m="go">開始探索</button></div>`;
  m.hidden = false;
  m.onclick = e => { if (e.target === m || e.target.closest('[data-m="go"]')) { const cb = $('#intro-music'); store.music = !!(cb && cb.checked); if (store.music) musicStart(); m.hidden = true; store.introSeen = true; save(); if (tts.ok) loadVoices(); } };
  setTimeout(() => $('[data-m="go"]', m)?.focus(), 50);
}

/* =========================================================
   Loop
   ========================================================= */

const clock = new THREE.Clock(); let hoverT = 0;
function loop() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  waterU.uTime.value = t;
  for (const n of npcs) updateNPC(n, dt, t);
  fishTick(dt, t);
  for (const n of npcs) {
    const cur = n.wps[n.wi]; const prevWp = n.wps[n.wi - 1];
    let y = TOP; if (cur && cur.bridge) { const a = prevWp ? prevWp.p : cur.p; const d0 = Math.hypot(cur.p.x - a.x, cur.p.z - a.z) || 1; const d1 = Math.hypot(cur.p.x - n.g.position.x, cur.p.z - n.g.position.z); y = cur.p.y + (a.y - cur.p.y) * Math.min(1, d1 / d0); }
    else if (cur && prevWp && prevWp.bridge) { const d0 = Math.hypot(cur.p.x - prevWp.p.x, cur.p.z - prevWp.p.z) || 1; const d1 = Math.hypot(cur.p.x - n.g.position.x, cur.p.z - n.g.position.z); y = cur.p.y + (prevWp.p.y - cur.p.y) * Math.min(1, d1 / d0); }
    n.g.position.y = y + (n.g.userData.yOff || 0);
  }
  for (const c of clouds) { c.position.x += c.userData.v * dt; if (c.position.x > 120) c.position.x = -120; }
  for (const b of boats) { const u = b.userData; u.a += u.v * dt; b.position.set(Math.cos(u.a) * u.r, -.25 + Math.sin(t * 1.6 + u.r) * .08, Math.sin(u.a) * u.r * .8); b.rotation.y = -u.a; b.rotation.z = Math.sin(t * 1.3 + u.r) * .05; }
  for (const [id, o] of islandObj) {
    const lm = o.lm.userData;
    if (lm.spin) lm.spin.rotation.y += dt * 1.2;
    if (lm.spin2) lm.spin2.rotation.y = Math.sin(t * .8) * .6;
    if (lm.hand) lm.hand.rotation.z = -t * .8;
    if (lm.float) lm.float.position.y = 3 + Math.sin(t * 1.2) * .15;
    if (lm.bubble) lm.bubble.position.y = .85 + (t * .6 % 1) * .4;
    if (lm.jet) lm.jet.scale.setScalar(1 + Math.sin(t * 6) * .15);
    if (lm.waves) lm.waves.forEach(w => { const s = 1 + ((t * .7 + w.userData.wave * .33) % 1) * .8; w.scale.set(s, s, s); });
    const want = (hoverId === id ? .22 : 0) + (current && current.id === id ? .14 : 0);
    o.topM.emissive.copy(o.baseColor); o.topM.emissiveIntensity += (want - o.topM.emissiveIntensity) * Math.min(1, dt * 8);
    o.flag.rotation.y = Math.sin(t * 3 + o.grp.position.x) * .25;
  }
  // camera
  if (fly) {
    fly.t += dt / fly.dur; const k = fly.t >= 1 ? 1 : 1 - Math.pow(1 - fly.t, 3);
    controls.target.lerpVectors(fly.fromT, fly.toT, k); camera.position.lerpVectors(fly.fromP, fly.toP, k);
    if (fly.t >= 1) fly = null;
  } else if (follow) {
    const goal = hero.g.position.clone(); goal.y = TOP;
    const d = goal.sub(controls.target).multiplyScalar(1 - Math.exp(-dt * 3.5));
    controls.target.add(d); camera.position.add(d);
    if (!hero.wps.length && d.length() < .002) follow = false;
  }
  // view offset easing
  offX += (wantOffX - offX) * Math.min(1, dt * 7); offY += (wantOffY - offY) * Math.min(1, dt * 7); applyView();
  controls.update();
  if ((hoverT += dt) > .06) { hoverT = 0; hoverTick(); }
  renderer.render(scene, camera);
  updateLabels();
  requestAnimationFrame(loop);
}

/* boot */
setupPierLabel(); applyLayout(); onResize(); applyTheme(); refreshStats(); setSoundBtn(); updateFlags(); goHome(0);
requestAnimationFrame(loop);

addEventListener('hashchange', fromHash);
if (location.hash && (IMAP.has(location.hash.slice(1)) || location.hash === '#fishing')) setTimeout(fromHash, 300);
else if (!store.introSeen) showIntro();
setTimeout(() => { say(npcs[0], `<b>${npcs[0].name}</b>：Welcome！點我們聊天也能學考點喔。`, '', 4000); }, 1800);
addEventListener('pointerdown', function first() { removeEventListener('pointerdown', first, true); if (store.music && store.introSeen && !music.on) musicStart(); }, true);
window.__toeic = { fish, goFishing, selectIsland, store, doPick, questions, openHistory, startExam, tts, SETS };
