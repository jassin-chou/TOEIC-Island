<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="多益 TOEIC 聽力與閱讀 3D 互動練習城：題庫、互動教學、語音聽力、單字釣魚、模擬考">
<title>多益群島 TOEIC Isles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;600;800&family=Noto+Sans+TC:wght@400;500;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D toy city; chunky plastic cards float at the edges (guide left, island panel right, dock bottom). */
:root{
  --sky-a:#fde6c4; --sky-b:#cfe8e6;
  --paper:#fffaf1; --paper-2:#f7eddd; --ink:#3a2d27; --ink-2:#78665a; --line:#ead9c2; --line-2:#d9c3a5;
  --accent:#2d6bd3; --accent-2:#1d4fa6; --accent-ink:#ffffff; --sun:#f2b134;
  --good:#24935a; --good-bg:#e2f3e7; --bad:#cf463c; --bad-bg:#fbe4df; --warn:#c98a10;
  --m:#e2794a; --t:#24938c;
  --shadow:rgba(90,55,20,.16); --scrim:rgba(58,45,39,.38);
  --water:#8ccfcb; --fog:#e9e3cf; --night:0;
  --f-display:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Fredoka","Chiron GoRound TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sky-a:#18203a; --sky-b:#2b3657;
  --paper:#222a3b; --paper-2:#2a3347; --ink:#f4ece1; --ink-2:#b5ab9d; --line:#3a4459; --line-2:#4b5670;
  --accent:#78a6ff; --accent-2:#4f7fdc; --accent-ink:#0e1630; --sun:#f6c75b;
  --good:#5bd18e; --good-bg:#1d3a2b; --bad:#ff7d70; --bad-bg:#45252a; --warn:#f0bf4c;
  --m:#f39a6d; --t:#4cc4bb;
  --shadow:rgba(0,0,0,.45); --scrim:rgba(6,10,22,.55);
  --water:#2a5d72; --fog:#27304b; --night:1; color-scheme:dark }}
:root[data-theme="dark"]{
  --sky-a:#18203a; --sky-b:#2b3657;
  --paper:#222a3b; --paper-2:#2a3347; --ink:#f4ece1; --ink-2:#b5ab9d; --line:#3a4459; --line-2:#4b5670;
  --accent:#78a6ff; --accent-2:#4f7fdc; --accent-ink:#0e1630; --sun:#f6c75b;
  --good:#5bd18e; --good-bg:#1d3a2b; --bad:#ff7d70; --bad-bg:#45252a; --warn:#f0bf4c;
  --m:#f39a6d; --t:#4cc4bb;
  --shadow:rgba(0,0,0,.45); --scrim:rgba(6,10,22,.55);
  --water:#2a5d72; --fog:#27304b; --night:1; color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 70%);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}

/* ---------- world labels ---------- */
.il{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:999px;background:var(--paper);border:2px solid var(--line);box-shadow:0 3px 0 var(--line-2);white-space:nowrap;pointer-events:auto;cursor:pointer;font-family:var(--f-display);will-change:transform;transition:background .15s}
.il:hover,.il.hot{background:var(--paper-2)}
.il.sel{border-color:var(--accent);box-shadow:0 3px 0 var(--accent-2)}
.il-emo{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:var(--paper-2);font-size:15px}
.il-txt{display:flex;flex-direction:column;line-height:1.15}
.il-txt b{font-weight:800;font-size:13px}
.il-txt small{font-size:10.5px;color:var(--ink-2);font-family:var(--f-body)}
.il-ring{font-family:var(--f-num);font-size:10.5px;font-weight:600;color:var(--ink-2);padding-left:4px;border-left:1px solid var(--line)}
#labels.far .il-txt small,#labels.far .il-ring{display:none}
#labels.far .il{padding:2px 8px 2px 3px}
.nl{position:absolute;left:0;top:0;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--ink);white-space:nowrap;will-change:transform;pointer-events:none;
  text-shadow:0 0 2px var(--paper),0 0 2px var(--paper),1px 1px 0 var(--paper),-1px -1px 0 var(--paper),1px -1px 0 var(--paper),-1px 1px 0 var(--paper)}
.nl.main{color:var(--accent);font-size:13px;font-weight:800;text-align:center;line-height:1.1;text-shadow:0 0 3px var(--paper),0 0 3px var(--paper),0 0 6px var(--paper),1px 1px 0 var(--paper),-1px -1px 0 var(--paper),1px -1px 0 var(--paper),-1px 1px 0 var(--paper)}
.nl.main::after{content:"▼";display:block;font-size:9px;line-height:1}
#labels.far .nl:not(.main){display:none}
.bubble{position:absolute;left:0;top:0;max-width:240px;padding:8px 12px;border-radius:14px;background:var(--paper);border:2px solid var(--line);box-shadow:0 4px 0 var(--line-2),0 10px 24px var(--shadow);font-size:13px;line-height:1.5;will-change:transform;pointer-events:none;white-space:normal}
.bubble b{font-family:var(--f-display)}
.bubble.big{font-family:var(--f-display);font-weight:800;font-size:16px;padding:6px 14px}
.bubble.ok{border-color:var(--good);color:var(--good)} .bubble.no{border-color:var(--bad);color:var(--bad)}

/* ---------- UI shell ---------- */
#ui{position:fixed;inset:0;pointer-events:none;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr) minmax(0,440px);grid-template-rows:auto minmax(0,1fr) auto;gap:12px;
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--paper);border:2px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line-2),0 16px 34px var(--shadow)}
.top{grid-column:1/-1;grid-row:1;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;min-width:0}
.brand{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px}
.brand .logo{width:44px;height:44px;flex:none}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;line-height:1.1;text-wrap:balance}
.brand p{margin:2px 0 0;font-size:12px;color:var(--ink-2)}
.stats{pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:8px}
.stat{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:2px 10px}
.stat b{font-family:var(--f-num);font-weight:700;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--ink-2);letter-spacing:.06em}
.stat + .stat{border-left:2px dashed var(--line)}

/* guide */
#guide{grid-column:1;grid-row:2/4;align-self:start;max-height:100%;overflow:auto;pointer-events:auto;padding:12px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.g-search{display:flex;gap:6px}
.g-search input{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--paper-2);color:var(--ink)}
.g-hub{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:14px;border:2px solid var(--line);background:var(--paper-2)}
.g-hub b{font-family:var(--f-display)}
.g-subj{display:flex;flex-direction:column;gap:6px}
.g-subj h2{margin:4px 2px 0;font-family:var(--f-display);font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:.03em}
.g-subj h2 i{width:12px;height:12px;border-radius:4px;display:inline-block}
.g-ch{font-size:11.5px;color:var(--ink-2);margin:4px 2px 0;display:flex;align-items:center;gap:6px;letter-spacing:.03em}
.g-ch i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid var(--line-2)}
.g-isl{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 8px;border-radius:12px;border:2px solid transparent;background:transparent}
.g-isl:hover{background:var(--paper-2)}
.g-isl.sel{border-color:var(--accent);background:var(--paper-2)}
.g-isl .e{font-size:16px;text-align:center}
.g-isl .n{min-width:0}
.g-isl .n b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-isl .n small{display:block;font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-isl .p{font-family:var(--f-num);font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}
.meter{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:3px}
.meter i{display:block;height:100%;border-radius:9px;background:var(--good)}
.flagdot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:3px;border:1px solid var(--line-2)}
#g-results{display:flex;flex-direction:column;gap:4px}
.res{text-align:left;padding:7px 9px;border-radius:12px;border:2px solid var(--line);background:var(--paper-2);font-size:12.5px;line-height:1.45}
.res small{display:block;color:var(--ink-2);font-size:11px}
.res mark{background:color-mix(in srgb,var(--sun) 45%,transparent);color:inherit;border-radius:3px}

/* panel */
#panel{grid-column:3;grid-row:2/4;min-height:0;max-height:100%;display:flex;flex-direction:column;pointer-events:auto;overflow:hidden;transform-origin:right center;animation:pin .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pin{from{transform:translateX(30px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.p-head{display:flex;gap:12px;align-items:flex-start;padding:14px 14px 10px 16px;border-bottom:2px dashed var(--line)}
.p-emo{width:46px;height:46px;flex:none;display:grid;place-items:center;font-size:24px;border-radius:14px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line-2)}
.p-title{flex:1;min-width:0}
.p-crumb{font-size:11.5px;color:var(--ink-2);letter-spacing:.03em}
.p-title h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.25;text-wrap:balance}
.p-title .sub{font-size:13px;color:var(--ink-2)}
.x{flex:none;width:36px;height:36px;border-radius:12px;border:2px solid var(--line);background:var(--paper-2);display:grid;place-items:center;font-size:18px;line-height:1}
.tabs{display:flex;gap:6px;padding:10px 14px 0}
.tab{flex:1;padding:7px 6px;border-radius:12px 12px 0 0;border:2px solid var(--line);border-bottom:none;background:var(--paper-2);font-size:13.5px;font-weight:700;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
.p-body{flex:1;min-height:0;overflow:auto;padding:14px 16px 18px;border-top:2px solid var(--line);overscroll-behavior:contain}
.p-body h3{font-family:var(--f-display);font-size:15px;margin:14px 0 6px;font-weight:800}
.p-body h3:first-child{margin-top:0}
.kp{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.kp li{position:relative;padding:8px 10px 8px 34px;background:var(--paper-2);border-radius:12px;font-size:13.5px;line-height:1.55}
.kp li::before{content:attr(data-n);position:absolute;left:9px;top:8px;width:18px;height:18px;border-radius:6px;background:var(--line);font-family:var(--f-num);font-size:11px;font-weight:700;display:grid;place-items:center;color:var(--ink-2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{background:var(--paper-2);border-radius:12px;padding:8px 10px}
.kv b{display:block;font-family:var(--f-num);font-size:20px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.kv span{font-size:11.5px;color:var(--ink-2)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:5px 11px;border-radius:999px;border:2px solid var(--line);background:var(--paper);font-size:12.5px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent-2);color:var(--accent-ink)}
.lbl{font-size:12px;color:var(--ink-2);margin:10px 0 5px;letter-spacing:.04em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:14px;border:2px solid var(--line-2);border-bottom-width:5px;background:var(--paper-2);font-weight:700;font-size:14px;transition:transform .06s}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.pri{background:var(--accent);border-color:var(--accent-2);color:var(--accent-ink)}
.btn.wide{width:100%}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:11px;border-bottom-width:4px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* quiz */
.qtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--paper-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.e{background:color-mix(in srgb,var(--sun) 25%,var(--paper));color:var(--ink)}
.qprog{margin-left:auto;font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.star{border:none;background:none;font-size:18px;padding:0 2px;line-height:1;color:var(--line-2)}
.star[aria-pressed="true"]{color:var(--sun)}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.qstem{font-size:16px;line-height:1.7;margin:0 0 12px;font-weight:500}
.prev{font-size:12px;color:var(--ink-2);margin:-6px 0 10px}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;width:100%;text-align:left;padding:10px 12px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--paper);font-size:14.5px;line-height:1.55;transition:transform .06s,background .15s}
.opt:hover:not([disabled]){background:var(--paper-2);border-color:var(--line-2)}
.opt:active:not([disabled]){transform:translateY(2px)}
.opt .k{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--paper-2);border:2px solid var(--line);font-family:var(--f-num);font-weight:700}
.opt .tag{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;align-self:center;white-space:nowrap}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{background:var(--good);border-color:var(--good);color:var(--paper)}
.opt.right .tag{background:var(--good);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.opt.wrong .tag{background:var(--bad);color:var(--paper)}
.opt.dim{opacity:.6}
.fb{margin-top:12px;border-radius:16px;padding:12px 14px;border:2px solid var(--line);background:var(--paper-2);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.fb.ok{border-color:var(--good)} .fb.no{border-color:var(--bad)}
.fb .v{font-family:var(--f-display);font-weight:800;font-size:18px}
.fb.ok .v{color:var(--good)} .fb.no .v{color:var(--bad)}
.fb .ans{margin:4px 0 6px;font-weight:700}
.fb .exp{margin:0;font-size:13.5px;line-height:1.7}
.fb .src{margin-top:8px;font-size:11.5px;color:var(--ink-2)}
.qnav{display:flex;gap:8px;margin-top:14px}
.qnav .btn{flex:1}
.hint{font-size:11.5px;color:var(--ink-2);text-align:center;margin-top:8px}
.hint kbd{font-family:var(--f-num);font-size:11px;padding:0 5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;background:var(--paper)}
.fig{margin:0 0 12px;border-radius:12px;border:2px solid var(--line);background:var(--paper-2);padding:10px;overflow-x:auto}
.fig pre{margin:0;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;color:var(--ink)}
.fig svg{display:block;max-width:100%;height:auto;margin:auto}
.empty{padding:18px;border-radius:14px;background:var(--paper-2);text-align:center;color:var(--ink-2)}

/* log list */
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 10px;border-radius:12px;background:var(--paper-2);font-size:13px;line-height:1.5}
.log .r{font-weight:800;font-family:var(--f-num);font-size:15px;line-height:1.3}
.log .r.ok{color:var(--good)} .log .r.no{color:var(--bad)}
.log .m{min-width:0}
.log .m small{display:block;color:var(--ink-2);font-size:11.5px}
.log .qt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* dock */
.dock{grid-column:2;grid-row:3;justify-self:center;align-self:end;display:flex;gap:6px;padding:6px;pointer-events:auto;flex-wrap:wrap;justify-content:center}
.dock .btn{font-size:13px;padding:7px 12px}
.badge{font-family:var(--f-num);font-size:11px;min-width:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);line-height:18px}
#g-toggle{display:none}

/* modal */
.modal{position:fixed;inset:0;display:grid;place-items:center;background:var(--scrim);pointer-events:auto;z-index:20;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:min(780px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;animation:pop .25s ease-out}
.sheet .p-body{border-top:2px solid var(--line)}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.heat button{text-align:left;padding:7px 9px;border-radius:12px;border:2px solid var(--line);background:var(--paper-2);font-size:12px;line-height:1.35}
.heat button b{display:block;font-size:12.5px}
.heat button span{font-family:var(--f-num);color:var(--ink-2)}
.intro{width:min(560px,100%);padding:22px 22px 18px;max-height:100%;overflow:auto;animation:pop .3s ease-out}
.intro h2{font-family:var(--f-display);font-size:26px;font-weight:800;margin:0 0 4px;letter-spacing:.03em;text-wrap:balance}
.intro p{margin:0 0 12px;color:var(--ink-2)}
.intro ul{margin:0 0 16px;padding:0;list-style:none;display:grid;gap:8px}
.intro li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:8px 10px;background:var(--paper-2);border-radius:12px;font-size:13.5px}
.intro li span{font-size:20px;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink-2);margin-bottom:14px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.t{padding:8px 16px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:700;font-size:13.5px;box-shadow:0 8px 20px var(--shadow);animation:pop .2s ease-out;white-space:nowrap}
.score{display:flex;align-items:center;gap:16px;padding:14px;border-radius:16px;background:var(--paper-2);margin-bottom:12px}
.score b{font-family:var(--f-num);font-size:44px;line-height:1;font-weight:700}
details.rv{border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--paper)}
details.rv summary{cursor:pointer;font-size:13px}
details.rv + details.rv{margin-top:6px}

.fishstage{padding:18px 16px;border-radius:16px;background:linear-gradient(180deg,var(--paper-2),color-mix(in srgb,var(--water) 35%,var(--paper)));text-align:center;margin-bottom:12px}
.fishstage p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2)}
.fs-big{font-family:var(--f-display);font-weight:800;font-size:20px}
.fishstage.bite{background:color-mix(in srgb,var(--sun) 40%,var(--paper));animation:shake .3s infinite}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.btn.pulse{animation:pls .5s infinite alternate}
@keyframes pls{to{transform:scale(1.04)}}
.odds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.odds span{background:var(--paper-2);border-radius:12px;padding:7px 9px;font-size:12px;color:var(--ink-2);line-height:1.4}
.odds b{display:block;font-size:13px}
.fishcard{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;background:color-mix(in srgb,var(--water) 30%,var(--paper));border:2px solid var(--line);margin-bottom:10px;animation:pop .3s ease-out}
.fc-pic{flex:none;display:grid;place-items:center}
.fc-pic svg{max-width:120px}
.fc-name{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.3}
.fc-meta{font-size:12.5px;color:var(--ink-2)}
.concept{padding:10px 12px;border-radius:14px;border:2px dashed var(--line-2);background:var(--paper);font-size:13.5px;line-height:1.6;margin-bottom:12px}
.concept b{display:block;font-family:var(--f-display);font-size:12px;letter-spacing:.06em;color:var(--ink-2)}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.bk{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:8px 6px;border-radius:14px;background:var(--paper-2);border:2px solid var(--line)}
.bk b{font-size:12.5px} .bk small{font-size:11px;color:var(--ink-2);line-height:1.4}
.bk.no b{color:var(--ink-2)}
/* panel layouts: side (default) / centered / full screen */
.x.lay{width:auto;display:inline-flex;gap:5px;padding:0 10px;font-size:12.5px;font-weight:700;margin-left:6px}
.x.lay + .x{margin-left:6px}
.p-head .x:first-of-type{margin-left:auto}
body.pl-center #panel{position:fixed;left:50%;top:50%;translate:-50% -50%;width:min(760px,calc(100vw - 48px));max-height:min(88vh,calc(100vh - 48px));z-index:14;animation:popc .25s ease-out}
body.pl-full #panel{position:fixed;z-index:14;max-height:none;width:auto;border-radius:22px;animation:popc .25s ease-out;
  top:max(12px,env(safe-area-inset-top,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px))}
body.pl-full #panel .p-body > *, body.pl-full #panel .tabs{max-width:820px;margin-left:auto;margin-right:auto;box-sizing:border-box}
body.pl-full #panel .tabs{width:100%;box-sizing:border-box}
body.pl-center #panel .qstem, body.pl-full #panel .qstem{font-size:17.5px}
body.pl-center #panel .opt, body.pl-full #panel .opt{font-size:15.5px;padding:12px 14px}
body.pl-center.sheet-open .dock, body.pl-full.sheet-open .dock{display:none}
@keyframes popc{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
/* ---------- interactive lessons ---------- */
.learn-cta{margin:12px 0 2px}
.l-hint{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 12px;margin-bottom:10px;border-radius:12px;background:color-mix(in srgb,var(--accent) 10%,var(--paper));font-size:12.5px}
.lsteps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.lstep{width:32px;height:32px;border-radius:10px;border:2px solid var(--line);border-bottom-width:4px;background:var(--paper);font-family:var(--f-num);font-weight:700;font-size:13px}
.lstep.done{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.lstep.on{background:var(--accent);border-color:var(--accent-2);color:var(--accent-ink)}
.lprog{margin-left:auto;font-size:12px;color:var(--ink-2);font-family:var(--f-num)}
.lesson{display:flex;flex-direction:column;gap:12px}
.l-eyebrow{font-size:11.5px;letter-spacing:.08em;color:var(--ink-2)}
.p-body .l-title{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.35;margin:-6px 0 0!important;text-wrap:balance}
.l-body{font-size:14.5px;line-height:1.85}
.l-body b{color:var(--accent-2)}
:root[data-theme="dark"] .l-body b{color:var(--accent)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .l-body b{color:var(--accent)} }
.l-cap{display:block;font-family:var(--f-display);font-size:12px;letter-spacing:.08em;color:var(--ink-2);margin-bottom:4px}
.l-ana{padding:11px 14px;border-radius:14px;background:color-mix(in srgb,var(--sun) 18%,var(--paper));border:2px solid color-mix(in srgb,var(--sun) 45%,var(--line));font-size:14px;line-height:1.75}
.l-w{padding:12px;border-radius:16px;border:2px solid var(--line);background:var(--paper-2)}
.l-keys{padding:10px 14px;border-radius:14px;border:2px dashed var(--line-2)}
.l-keys ul{margin:0;padding-left:20px;font-size:13.5px;line-height:1.7}
.l-q{padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--paper)}
.l-q p{margin:0 0 8px;font-weight:600;font-size:14.5px}
.l-opts{display:flex;flex-direction:column;gap:6px}
.l-opts button{display:flex;gap:8px;align-items:flex-start;text-align:left;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-size:13.5px;line-height:1.5}
.l-opts .k{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--paper-2);font-family:var(--f-num);font-weight:700;font-size:12px}
.l-opts .right{border-color:var(--good);background:var(--good-bg)} .l-opts .wrong{border-color:var(--bad);background:var(--bad-bg)} .l-opts .dim{opacity:.55}
.tw-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:8px}
.tw-score{font-family:var(--f-num)}
.tw-note{font-size:12px;color:var(--ink-2);margin-top:6px}
.tw-out{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--paper);border:2px solid var(--line);font-size:13.5px;line-height:1.7}
.tw-done{margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;color:var(--good)}
.srt{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.srt li{padding:8px 10px;border-radius:12px;background:var(--paper);border:2px solid var(--line)}
.srt li.ok{border-color:var(--good)} .srt li.no{border-color:var(--bad)}
.srt-t{font-size:13.5px;font-weight:600;margin-bottom:6px}
.srt-b{display:flex;flex-wrap:wrap;gap:5px}
.srt-b button{padding:3px 10px;border-radius:999px;border:2px solid var(--line);background:var(--paper-2);font-size:12px;font-weight:600}
.srt-b button:hover:not([disabled]){border-color:var(--accent)}
.srt-b button.right{background:var(--good);border-color:var(--good);color:var(--paper)} .srt-b button.wrong{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.srt-b button[disabled]:not(.right):not(.wrong){opacity:.45}
.srt-why{font-size:12.5px;margin-top:6px;color:var(--ink-2)}
.srt li.ok .srt-why{color:var(--good)} .srt li.no .srt-why{color:var(--bad)}
.tw-scroll{overflow-x:auto}
.tw-table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;line-height:1.5;background:var(--paper);border-radius:12px;overflow:hidden;border:2px solid var(--line)}
.tw-table th,.tw-table td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tw-table thead th{background:var(--paper-2);font-family:var(--f-display);font-size:12.5px}
.tw-table thead th button{border:none;background:none;font:inherit;font-weight:800;padding:0;border-bottom:2px dotted var(--line-2)}
.tw-table thead th button[aria-pressed="true"]{color:var(--accent)}
.tw-table tbody th{font-weight:700;background:var(--paper-2);white-space:nowrap}
.tw-table td.hl{background:color-mix(in srgb,var(--accent) 12%,var(--paper))}
.own{display:inline-block;white-space:nowrap;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700}
.own.u{background:color-mix(in srgb,var(--accent) 18%,var(--paper));color:var(--accent-2)} .own.p{background:var(--paper-2);color:var(--ink-2);border:1px solid var(--line)}
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.fcard{position:relative;min-height:92px;padding:10px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--paper);display:grid;place-items:center;text-align:center;line-height:1.45}
.fcard .fc-f{font-family:var(--f-display);font-weight:800;font-size:15px}
.fcard .fc-b{display:none;font-size:12.5px}
.fcard.open{background:color-mix(in srgb,var(--accent) 10%,var(--paper));border-color:var(--accent)}
.fcard.open .fc-f{display:none} .fcard.open .fc-b{display:block;animation:pop .2s ease-out}
.stp{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:6px}
.stp li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;column-gap:8px;padding:8px 10px;border-radius:12px;background:var(--paper);border:2px solid var(--line);animation:pop .2s ease-out}
.stp li::before{content:counter(s);grid-row:1/3;width:24px;height:24px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:12px}
.stp li b{font-size:13.5px} .stp li span{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.stp.done-list li::before{background:var(--good)}
.stp + .row{margin-top:8px}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pool button{padding:7px 12px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--paper);font-size:13px;font-weight:600}
.shake{animation:shake .3s 2;border-color:var(--bad)!important}
.lyr{display:flex;flex-direction:column;gap:5px}
.lyr-row{border-radius:12px;border:2px solid var(--line);background:color-mix(in srgb,var(--accent) calc(4% + var(--i) * 3%),var(--paper));overflow:hidden}
.lyr-row > button{width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;text-align:left;padding:8px 12px;border:none;background:none}
.lyr-h{font-family:var(--f-display);font-weight:800;font-size:14px}
.lyr-s{font-size:12.5px;color:var(--ink-2);flex:1;min-width:120px}
.lyr-tag{font-family:var(--f-num);font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--line-2)}
.lyr-d{padding:0 12px 10px;font-size:13px;line-height:1.7}
.lyr-row.open{border-color:var(--accent)}
.bars{display:flex;flex-direction:column;gap:6px}
.bar-r{display:grid;grid-template-columns:76px 1fr 64px;gap:8px;align-items:center;font-size:12.5px}
.bar-t{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--accent);border-radius:7px;transition:width .2s}
.bar-t i.r{background:var(--bad)} .bar-t i.y{background:var(--sun)}
.bar-r b{font-family:var(--f-num);text-align:right}
.enc{padding:12px;border-radius:14px;background:var(--paper);border:2px solid var(--line);text-align:center}
.enc-lay{font-family:var(--f-display);font-weight:800;font-size:15px;margin-bottom:8px}
.enc-boxes{display:flex;justify-content:center;flex-wrap:wrap;gap:3px;margin-bottom:8px}
.eb{padding:6px 9px;border-radius:7px;font-size:12px;font-weight:700;font-family:var(--f-num);animation:pop .25s ease-out;color:#2a2320}
.eb.d{background:#f5d48a} .eb.h4{background:#9fd3c7} .eb.h3{background:#a9c4f0} .eb.h2{background:#e8a9c4} .eb.b{background:var(--ink);color:var(--paper);letter-spacing:.1em}
.enc p{margin:0;font-size:13px;line-height:1.6}
.enc-track{display:flex;gap:4px;justify-content:center;margin:8px 0}
.enc-track button{width:16px;height:8px;border-radius:4px;border:none;background:var(--line)}
.enc-track button.on{background:var(--accent);width:26px}
.rq{display:grid;grid-template-columns:auto 1fr;gap:4px;align-items:center}
.rq-y{writing-mode:vertical-rl;font-size:12px;color:var(--ink-2)}
.rq-grid{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:3px;align-items:center}
.rq-lab{font-size:10.5px;color:var(--ink-2);white-space:nowrap;padding-right:4px}
.rq-lab.x{text-align:center;white-space:normal;padding:0}
.rq-c{aspect-ratio:1.6;border-radius:8px;border:2px solid transparent;font-family:var(--f-num);font-weight:700;color:#2a2320}
.rq-c.lo{background:#bfe3c6} .rq-c.mid{background:#f6d98e} .rq-c.hi{background:#f2a497}
.rq-c.sel{border-color:var(--ink);transform:scale(1.08)}
.rq-x{grid-column:2;text-align:center;font-size:12px;color:var(--ink-2)}
.lv-hi{color:var(--bad)} .lv-mid{color:var(--warn)} .lv-lo{color:var(--good)}
.sl{display:flex;flex-direction:column;gap:8px}
.sl label{font-size:13px;display:block}
.sl label input{display:block;margin-top:4px}
.sl b{font-family:var(--f-num)}
.sl input[type=range]{width:100%;accent-color:var(--accent)}
.tw-in{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink-2);flex:1;min-width:0}
.tw-in input{font:inherit;font-size:14px;padding:7px 10px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);min-width:0}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;margin:8px 0}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.hx{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all;line-height:1.7}
.hx mark{background:color-mix(in srgb,var(--sun) 55%,transparent);color:inherit;border-radius:2px}
.sq-form{display:flex;gap:8px;flex-wrap:wrap}
.sqlq{display:block;font-size:12px;padding:8px 10px;border-radius:10px;background:var(--ink);color:var(--paper);word-break:break-all;white-space:pre-wrap;margin-bottom:6px}
.sqlq b{color:var(--sun)}
.res{margin-top:6px;font-weight:700} .res.bad{color:var(--bad)} .res.good{color:var(--good)} .res.warn{color:var(--ink-2)}
.bk-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.bk-day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;border:2px solid var(--line);background:var(--paper)}
.bk-day.fut{opacity:.35}
.bk-day.need{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--paper))}
.bk-d{font-size:12px;font-weight:700}
.bk-bar{width:16px;height:52px;border-radius:5px;background:var(--line);display:flex;align-items:flex-end;overflow:hidden}
.bk-bar i{display:block;width:100%;background:var(--accent)}
.bk-t{font-size:10.5px;color:var(--ink-2)}
.tl{display:flex;flex-direction:column;gap:10px}
.tl-row{display:grid;grid-template-columns:64px 1fr 120px;gap:8px;align-items:center;font-size:12.5px}
.tl-t{position:relative;height:16px;border-radius:8px;background:var(--line)}
.tl-t i{display:block;height:100%;border-radius:8px} .tl-t i.g{background:var(--good)} .tl-t i.y{background:var(--sun)} .tl-t i.r{background:var(--bad)}
.tl-t em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);font-style:normal;font-size:10px;line-height:22px;padding-left:4px;white-space:nowrap;color:var(--ink);font-weight:700}
.tl-t em::after{content:attr(data-x);}
.tl-row b.ok{color:var(--good)} .tl-row b.no{color:var(--bad)}
.lv-row{display:grid;grid-template-columns:84px 1fr;gap:8px;align-items:center;font-size:13px;margin-bottom:6px}
.fw-rules{display:flex;flex-direction:column;padding:4px 10px;border-radius:12px;background:var(--paper);border:2px solid var(--line)}
.fw-rules .chk{margin:5px 0}
.fw-pk{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.fw-pk li{display:grid;grid-template-columns:1fr auto 84px;gap:8px;align-items:center;padding:6px 10px;border-radius:10px;background:var(--paper);border:2px solid var(--line);font-size:12.5px}
.fw-pk li.bad{border-color:var(--bad)}
.fw-pk b.pass{color:var(--good)} .fw-pk b.blk{color:var(--bad)}
.fw-pk small{color:var(--ink-2);text-align:right}
/* ---------- TOEIC: listening, passages, vocab ---------- */
.linkbtn{border:none;background:none;padding:0;font:inherit;color:var(--accent-2);text-decoration:underline;text-underline-offset:2px}
:root[data-theme="dark"] .linkbtn{color:var(--accent)}
.au-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-radius:14px;background:color-mix(in srgb,var(--accent) 10%,var(--paper));border:2px solid color-mix(in srgb,var(--accent) 30%,var(--line));margin-bottom:12px;font-size:13px;font-weight:600}
.au-bar .au-st{font-size:12px;color:var(--ink-2);margin-left:auto;font-weight:400}
.au-bar.playing .au-play{animation:pls .6s infinite alternate}
.au-bar.playing::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--bad);animation:pls .5s infinite alternate}
.ph{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;border:2px solid var(--line);background:linear-gradient(135deg,var(--paper-2),color-mix(in srgb,var(--sun) 14%,var(--paper)));margin-bottom:12px}
.ph-e{font-size:38px;line-height:1.15;letter-spacing:3px;flex:none;max-width:45%;text-align:center}
.ph-d{font-size:14px;line-height:1.65}
.ph-d b{display:block;font-family:var(--f-display);font-size:11.5px;letter-spacing:.08em;color:var(--ink-2)}
.hidden-txt{color:var(--ink-2);font-style:italic;font-weight:400}
.peek{margin:-4px 0 10px}
.qstem.en,.srt-t.en{font-family:"Segoe UI","Helvetica Neue",Arial,var(--f-body)}
.opt .en{font-family:"Segoe UI","Helvetica Neue",Arial,var(--f-body)}
.trans{margin-top:10px;border:2px dashed var(--line-2);border-radius:12px;padding:8px 12px;background:var(--paper)}
.trans summary{cursor:pointer;font-weight:700;font-size:13px}
.trans .ln{font-size:13.5px;line-height:1.65;margin:5px 0;font-family:"Segoe UI","Helvetica Neue",Arial,var(--f-body)}
.trans .ln b{display:inline-block;min-width:30px;font-family:var(--f-body);font-size:12px;color:var(--accent-2);margin-right:6px}
.trans .zh{font-size:12.5px;color:var(--ink-2);margin-top:8px;line-height:1.75;border-top:1px dashed var(--line);padding-top:6px}
.passage{margin:0 0 12px;display:flex;flex-direction:column;gap:10px}
.doc{border:2px solid var(--line);border-radius:14px;background:var(--paper);overflow:hidden}
.doc-h{padding:5px 12px;background:var(--paper-2);font-family:var(--f-display);font-weight:800;font-size:12.5px;letter-spacing:.04em;border-bottom:1px solid var(--line)}
.ptext{white-space:pre-wrap;padding:10px 12px;font-family:Georgia,"Times New Roman",var(--f-body);font-size:14px;line-height:1.7;max-height:440px;overflow:auto}
body.pl-full .ptext,body.pl-center .ptext{max-height:none}
.blank{display:inline-block;padding:0 8px;border-radius:6px;background:color-mix(in srgb,var(--sun) 40%,var(--paper));font-family:var(--f-num);font-weight:700}
.blank.cur{background:var(--accent);color:var(--accent-ink)}
.ins{color:var(--accent-2);font-family:var(--f-num)}
.gtab{border-collapse:collapse;width:100%;font-size:13px;background:var(--paper);font-family:"Segoe UI","Helvetica Neue",Arial,var(--f-body)}
.gtab caption{font-weight:800;padding:2px 2px 6px;text-align:left}
.gtab th,.gtab td{border:1px solid var(--line-2);padding:5px 8px;text-align:left}
.gtab th{background:var(--paper-2)}
.estbox{margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--paper-2);font-size:13.5px;line-height:1.6}
.estbox b{font-family:var(--f-num);font-size:22px}
.estbox small{display:block;color:var(--ink-2);font-size:11.5px}
.cert{display:inline-block;padding:1px 10px;border-radius:999px;font-weight:800;font-size:12px;color:#2a2320;vertical-align:middle}
.c-gold{background:#f2c94c}.c-blue{background:#93bdf5}.c-green{background:#8fd39a}.c-brown{background:#d1ab86}.c-orange{background:#f4aa72}
.sc2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.sc2 div{background:var(--paper-2);border-radius:14px;padding:10px;text-align:center}
.sc2 b{display:block;font-family:var(--f-num);font-size:28px;line-height:1.1}
.sc2 span{font-size:12px;color:var(--ink-2)}
/* lesson widgets */
.lsn{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lsn li{display:flex;gap:8px;align-items:stretch}
.lsn-t{flex:1;text-align:left;padding:7px 10px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-size:13.5px;line-height:1.5;min-height:38px}
.lsn-t b{display:block;font-family:"Segoe UI","Helvetica Neue",Arial,var(--f-body)}
.lsn-t small{color:var(--ink-2)}
.lsn-t.open{border-color:var(--accent)}
.pairs-box{text-align:center;padding:14px;border-radius:14px;background:var(--paper);border:2px solid var(--line)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.dw-ok{color:var(--good);font-weight:700}
.dw-no{color:var(--bad);text-decoration:underline wavy;font-weight:700}
.tw-in input.en{font-family:"Segoe UI","Helvetica Neue",Arial,var(--f-body)}
/* vocab */
.vcard{padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--paper);margin:10px 0}
.vcard .vw{font-family:"Segoe UI","Helvetica Neue",Arial,var(--f-body);font-size:24px;font-weight:800}
.vcard .vp{color:var(--ink-2);font-size:13px;margin:0 6px}
.vcard .vz{font-weight:700}
.vcard .vx{margin-top:6px;font-size:13.5px;font-family:"Segoe UI","Helvetica Neue",Arial,var(--f-body)}
.vcard .vx b{color:var(--accent-2)}
.wl{list-style:none;margin:0 0 12px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:5px}
.wl li{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:10px;background:var(--paper-2);font-size:12.5px;line-height:1.3}
.wl li b{font-family:"Segoe UI","Helvetica Neue",Arial,var(--f-body);font-size:13px}
.wl li small{color:var(--ink-2);display:block}
.wl li .wst{margin-left:auto;font-weight:800}
.wl .say{border:none;background:var(--paper);border-radius:8px;width:26px;height:26px;flex:none;font-size:12px}
.vacc{font-size:12px;color:var(--ink-2)}

@media (max-width: 900px){
  #ui{grid-template-columns:minmax(0,260px) minmax(0,1fr) minmax(0,380px)}
}
@media (max-width: 760px){
  #ui{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  .brand{padding:6px 12px 6px 6px;gap:8px} .brand h1{font-size:17px;white-space:nowrap} .brand .logo{width:32px;height:32px} .brand p{display:none}
  .stats{padding:4px 2px;flex-wrap:nowrap} .stat{min-width:0;padding:0 8px} .stat b{font-size:15px} .stat span{font-size:10px;white-space:nowrap} .stat.opt2,.stat.opt3{display:none}
  #guide{position:fixed;left:0;top:0;bottom:0;width:min(320px,86vw);max-height:none;border-radius:0 20px 20px 0;z-index:15;transform:translateX(-105%);transition:transform .25s;
    padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px))}
  #guide.open{transform:none}
  #g-toggle{display:inline-flex}
  #panel{position:fixed;left:0;right:0;bottom:0;max-height:62%;border-radius:22px 22px 0 0;z-index:12;animation:up .28s ease-out;
    padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .dock{grid-column:1}
  body.sheet-open .dock{display:none}
  body.pl-full #panel{max-height:none;border-radius:0;left:0;right:0;top:0;bottom:0;padding-top:env(safe-area-inset-top,0px)}
  .x.lay span{display:none}
  .qstem{font-size:15px}
  .kv b{font-size:17px}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>

<script>window.DATA={"islands":[{"id":"p1","subj":1,"chap":"Part 1 照片描述","sec":"Photographs","name":"照片描述 Photographs","nick":"相片燈塔","emoji":"📷","q":0,"r":-1,"kp":["考試 6 題：看照片，聽 4 個描述（不印出來、只念一次）選最符合的","人物照的正解多半是現在進行式 be + V-ing，描述當下的動作","沒有人的照片：have been + p.p. 多半正確，is being + p.p.（正在被做）幾乎一定錯","wearing 是穿著（狀態），putting on / trying on 是正在穿上（動作）","相似音陷阱：copy / coffee、walk / work；只聽到一個熟悉的字就選很危險","只描述照片看得到的事實，不要推論照片外的事"]},{"id":"p2","subj":1,"chap":"Part 2 應答問題","sec":"Question-Response","name":"應答問題 Question-Response","nick":"回音碼頭","emoji":"💬","q":-1,"r":0,"kp":["考試 25 題：聽一句話，選 3 個回應中最適當的，題目和選項全部不印出來","WH 疑問句不能用 Yes/No 回答，聽到 Yes/No 開頭可直接刪除","間接回答常是正解：還沒決定、我查一下、去問某人、反問句","三大陷阱：相似音、重複字、聯想字——和題目一樣的字反而要小心","Why don't we...? 是提議，不是問原因","選擇疑問句（A or B）常見正解：選一個、Either is fine、Neither"]},{"id":"p34","subj":1,"chap":"Part 3–4 對話與獨白","sec":"Conversations & Talks","name":"簡短對話與獨白","nick":"對話廣播站","emoji":"📻","q":-1,"r":1,"kp":["Part 3 共 13 段對話 39 題、Part 4 共 10 段獨白 30 題，每段 3 題","錄音開始前先看題目，三題答案通常依照錄音順序出現","主旨題看開頭、下一步題看結尾、細節題聽到就答","正解多半是同義改寫：fully booked → not available","意圖題要看那句話的前後文；圖表題錄音說的是圖表的「另一欄」","多益錄音包含美、英、加、澳四種口音，三人對話要注意稱呼"]},{"id":"p5g","subj":2,"chap":"Part 5 句子填空・文法","sec":"Incomplete Sentences","name":"句子填空：文法","nick":"文法工坊","emoji":"🛠️","q":1,"r":-1,"kp":["Part 5 共 30 題，每題建議 20–30 秒，先看選項判斷題型","詞性題：冠詞／所有格／介系詞後放名詞，名詞前放形容詞，動詞前後放副詞","時態看訊號字：ago → 過去式、since / for → 現在完成式、if / when 子句用現在式表未來","後面是子句用連接詞（although），是名詞用介系詞（despite），however 是副詞","主詞是事物、後面沒有受詞 → 多半是被動語態","關係詞：人 who、物 which、所有格 whose、地點 where；逗號後不用 that"]},{"id":"p5v","subj":2,"chap":"Part 5 句子填空・字彙","sec":"Incomplete Sentences","name":"句子填空：字彙與搭配","nick":"字彙市集","emoji":"🧺","q":1,"r":0,"kp":["字彙題四個選項詞性相同、意思不同，關鍵是英文的固定搭配","高頻搭配：place an order、meet a deadline、take effect、undergo training","固定介系詞：responsible for、comply with、eligible for、prior to、in charge of","易混淆字：complimentary（免費）/ complementary（互補）、affect / effect、personal / personnel","及物與不及物：attend the meeting / participate in the meeting","一字多義：address 處理、issue 核發、cover 支付、figure 數字"]},{"id":"p6","subj":2,"chap":"Part 6 段落填空","sec":"Text Completion","name":"段落填空 Text Completion","nick":"書信郵局","emoji":"✉️","q":0,"r":1,"kp":["Part 6 共 4 篇 × 4 題 = 16 題，每篇固定 1 題插入句","時態題常常要看文章日期與上下文，單看一句無法判斷","連接副詞：轉折 however、因果 therefore、補充 in addition、舉例 for example","插入句看下一句的代名詞與指示詞（it, this, they）要能指回插入句","書信固定句型：I am writing to...、Please find attached...、look forward to + V-ing","每篇建議約 2 分鐘完成"]},{"id":"p7","subj":2,"chap":"Part 7 閱讀測驗","sec":"Reading Comprehension","name":"閱讀測驗 Reading Comprehension","nick":"閱讀圖書館","emoji":"📚","q":2,"r":-1,"kp":["Part 7 共 54 題：單篇 29 題、雙篇 10 題、三篇 15 題","先看題目、圈關鍵字，再掃描文章找答案，不要從頭精讀","題型：主旨、細節、推論、NOT、同義字、意圖、插入句","同義字題把選項代回原句；NOT 題用刪去法，可以最後做","多篇閱讀至少 1 題要跨篇對照：日期、價格、人名是連結點","不在一題卡超過 2 分鐘；時間到前全部畫滿，答錯不倒扣"]}],"questions":[{"id":"P1-01","i":"p1","pt":1,"t":"單人動作","q":"","o":["She's carrying a box upstairs.","She's reading a newspaper.","She's loading paper into a machine.","She's repairing a copier."],"a":2,"e":"正在把紙放進機器：loading paper into a machine。repairing（修理）動作不符；newspaper 和 paper 是相似字陷阱。","ph":{"e":"👩‍💼📄🖨️","d":"一位女士站在影印機前，手上拿著一疊紙，正把紙放進進紙匣。"}},{"id":"P1-02","i":"p1","pt":1,"t":"單人動作","q":"","o":["A man is chopping some vegetables.","A man is tasting some soup.","A man is setting a table.","A man is washing some dishes."],"a":0,"e":"chop 切碎、剁。其他動作畫面中都沒有。","ph":{"e":"👨‍🍳🥕🔪","d":"一位穿圍裙的男士在廚房流理台前，拿刀切紅蘿蔔。"}},{"id":"P1-03","i":"p1","pt":1,"t":"單人動作","q":"","o":["He's typing on a keyboard.","He's pouring a cup of coffee.","He's opening a window.","He's plugging in a cable."],"a":0,"e":"正在打字 typing on a keyboard。咖啡只是擺著，沒有在倒；窗戶也沒有在開。","ph":{"e":"🧑‍💻☕🪟","d":"一位男士坐在窗邊的桌前，用筆電打字，旁邊放著一杯咖啡。"}},{"id":"P1-04","i":"p1","pt":1,"t":"單人動作","q":"","o":["A worker is painting a wall.","A worker is climbing down a ladder.","A worker is putting on a helmet.","A worker is stacking some bricks."],"a":0,"e":"putting on（正在戴上）是動作；畫面中安全帽已經戴著，應該用 wearing。這是 Part 1 經典陷阱。","ph":{"e":"👷‍♂️🪜🧱","d":"一位戴安全帽的工人站在梯子上，正在牆上刷油漆。"}},{"id":"P1-05","i":"p1","pt":1,"t":"單人動作","q":"","o":["She's cleaning some glassware.","She's putting on a lab coat.","She's looking into a microscope.","She's writing on a whiteboard."],"a":2,"e":"looking into a microscope 正在看顯微鏡。putting on a lab coat 是「穿上」的動作，她已經穿著了。","ph":{"e":"👩‍🔬🔬","d":"實驗室裡，一位穿白袍的女士彎腰看著顯微鏡。"}},{"id":"P1-06","i":"p1","pt":1,"t":"單人動作","q":"","o":["A man is sitting on a bench.","A man is planting a tree.","A man is mowing the lawn.","A man is watering some plants."],"a":3,"e":"watering plants 澆花。planting 種植、mowing 割草都不是畫面中的動作。","ph":{"e":"🧑‍🦳🌳🪴","d":"公園裡，一位老先生蹲在花圃旁，正在用水管澆花。"}},{"id":"P1-07","i":"p1","pt":1,"t":"多人動作","q":"","o":["They're shaking hands.","They're waiting for an elevator.","They're exchanging business cards.","They're signing a document."],"a":0,"e":"shaking hands 握手。exchanging business cards 是另一個常見的商務動作，但畫面中沒有。","ph":{"e":"👥🤝💼","d":"兩位穿西裝的人在辦公大樓大廳面對面握手。"}},{"id":"P1-08","i":"p1","pt":1,"t":"多人動作","q":"","o":["The chairs are being stacked.","Some people are looking at menus.","Some people are leaving the restaurant.","A waiter is serving some food."],"a":1,"e":"畫面沒有服務生，也沒有人在疊椅子。look at menus 符合。","ph":{"e":"👨‍👩‍👧‍👦🍽️","d":"餐廳裡，四個人圍坐在一張圓桌旁，正在看菜單。"}},{"id":"P1-09","i":"p1","pt":1,"t":"多人動作","q":"","o":["Some people are leaving the room.","Some people are standing in a line.","A woman is turning off a projector.","A woman is giving a presentation."],"a":3,"e":"giving a presentation 正在簡報。","ph":{"e":"🧑‍🤝‍🧑📊","d":"會議室裡，一位女士站在螢幕前指著長條圖，其他人坐著聽。"}},{"id":"P1-10","i":"p1","pt":1,"t":"多人動作","q":"","o":["Some luggage is being loaded onto a cart.","A train is leaving the station.","Some passengers are walking along a platform.","Some passengers are boarding a bus."],"a":2,"e":"沿著月台走 walking along a platform。boarding a bus 交通工具錯。","ph":{"e":"🚶‍♀️🚶‍♂️🛤️","d":"火車站月台上，幾個乘客拖著行李往列車方向走。"}},{"id":"P1-11","i":"p1","pt":1,"t":"物品狀態","q":"","o":["Some chairs are being arranged around a table.","Some people are seated at a table.","Some chairs have been arranged around a table.","A table is being cleared."],"a":2,"e":"畫面沒有人：物品狀態要用 have been + p.p.（已經被排好）。is being + p.p. 表示「正在被人排」，需要畫面裡有人在做。","ph":{"e":"🪑🪑🪑🏢","d":"空無一人的會議室，椅子整齊地排在長桌兩側。"}},{"id":"P1-12","i":"p1","pt":1,"t":"物品狀態","q":"","o":["Some books are being placed on shelves.","A woman is reaching for a book.","The shelves are empty.","Some books have been placed on shelves."],"a":3,"e":"沒有人在動作，用完成式被動 have been placed。","ph":{"e":"📚📚📚","d":"書架上排滿了書，最上層放著幾個收納盒。"}},{"id":"P1-13","i":"p1","pt":1,"t":"物品狀態","q":"","o":["A driver is getting out of a car.","Some cars are being washed.","Some vehicles are parked in a lot.","A car is being towed away."],"a":2,"e":"are parked（停放著）是狀態描述。being washed / being towed 都需要有人在動作。","ph":{"e":"🚗🚗🅿️","d":"停車場裡停著幾輛車，地上畫著白線，沒有人。"}},{"id":"P1-14","i":"p1","pt":1,"t":"物品狀態","q":"","o":["A picture is being hung on the wall.","A lamp has been knocked over.","A picture is hanging on the wall.","A sofa is being moved."],"a":2,"e":"is hanging（掛著）是狀態；is being hung 是「正被人掛上去」。","ph":{"e":"🖼️🛋️💡","d":"客廳牆上掛著一幅畫，下方是一張沙發，旁邊立著一盞落地燈。"}},{"id":"P1-15","i":"p1","pt":1,"t":"物品狀態","q":"","o":["Some fruit is displayed in containers.","Some fruit is being weighed.","A clerk is restocking the shelves.","Some boxes are being unloaded from a truck."],"a":0,"e":"displayed（陳列著）。畫面沒有店員，也沒有卡車。","ph":{"e":"🍎🍊🍌🛒","d":"超市的水果區，蘋果、橘子、香蕉整齊地堆在木箱裡。"}},{"id":"P1-16","i":"p1","pt":1,"t":"物品狀態","q":"","o":["A bicycle is leaning against a railing.","A bicycle is being repaired.","A man is riding a bicycle.","Some trees are being trimmed."],"a":0,"e":"lean against（靠著）。沒有人在騎或修。","ph":{"e":"🚲🌳🛣️","d":"人行道旁的樹下，一輛腳踏車靠在欄杆上。"}},{"id":"P1-17","i":"p1","pt":1,"t":"物品狀態","q":"","o":["The warehouse doors are being closed.","A forklift is lifting a pallet.","Workers are stacking boxes.","Boxes have been stacked on top of one another."],"a":3,"e":"stacked on top of one another（一個疊一個）。畫面沒有工人和堆高機。","ph":{"e":"📦📦📦🏭","d":"倉庫裡，紙箱一層層堆到天花板附近。"}},{"id":"P1-18","i":"p1","pt":1,"t":"物品狀態","q":"","o":["A ship is being painted.","Some boats are sailing in open water.","Some boats are docked in a harbor.","People are swimming near the shore."],"a":2,"e":"docked（停靠著）。sailing 是航行中，不符。","ph":{"e":"⛵🌊🏝️","d":"港口裡停著幾艘帆船，海面平靜。"}},{"id":"P1-19","i":"p1","pt":1,"t":"人與物","q":"","o":["A man is lifting a heavy box.","A man is checking a list.","A man is driving a truck.","A truck is being loaded with furniture."],"a":1,"e":"拿著寫字板核對：checking a list。","ph":{"e":"🧑‍💼📋🚚","d":"一位男士站在貨車旁，手上拿著寫字板在核對貨物。"}},{"id":"P1-20","i":"p1","pt":1,"t":"人與物","q":"","o":["A woman is trying on a jacket.","Some clothes are being folded.","A woman is paying at the counter.","A woman is holding up a dress."],"a":3,"e":"hold up 舉起。trying on a jacket 衣物種類和動作都不對。","ph":{"e":"👩‍🦰🛍️👗","d":"服飾店裡，一位女士把一件洋裝舉起來在身前比對。"}},{"id":"P1-21","i":"p1","pt":1,"t":"人與物","q":"","o":["The floor is being mopped.","A worker is emptying a trash can.","A sign is being put up.","The floor has been carpeted."],"a":0,"e":"is being mopped（正被拖著），畫面裡有人在做，所以進行式被動正確。","ph":{"e":"🧹🏢🧑‍🔧","d":"辦公室走廊上，一位清潔人員正在拖地，旁邊放著黃色警示牌。"}},{"id":"P1-22","i":"p1","pt":1,"t":"人與物","q":"","o":["Some desks are being moved.","The students are leaving the classroom.","An instructor is writing on a board.","An instructor is erasing a board."],"a":2,"e":"writing on a board。erasing（擦掉）動作相反。","ph":{"e":"👨‍🏫📝🎓","d":"教室裡，一位講師在白板上寫字，學員坐在桌前。"}},{"id":"P1-23","i":"p1","pt":1,"t":"人與物","q":"","o":["A customer is buying a cake.","Some bread is being sliced.","A baker is putting bread into a basket.","The oven is being cleaned."],"a":2,"e":"putting bread into a basket。畫面沒有顧客。","ph":{"e":"🧑‍🍳🍞🧺","d":"麵包店櫃台後，店員正把剛出爐的麵包放進籃子。"}},{"id":"P1-24","i":"p1","pt":1,"t":"風景","q":"","o":["Some people are crossing a bridge.","A bridge spans a river.","A boat is passing under a bridge.","The buildings are under construction."],"a":1,"e":"span 橫跨。畫面沒有人和船，也沒有施工。","ph":{"e":"🌉🏙️🌇","d":"黃昏時分，一座橋橫跨河面，對岸是城市高樓。"}},{"id":"P2-01","i":"p2","pt":2,"t":"Where 問句","q":"Where is the new photocopier?","o":["Next to the reception desk.","Twenty copies, please.","It was delivered yesterday."],"a":0,"e":"問「哪裡」，回答地點 Next to the reception desk（在接待櫃台旁）。Twenty copies 用 copier/copies 的相似字陷阱；It was delivered yesterday 回答的是 When。"},{"id":"P2-02","i":"p2","pt":2,"t":"Where 問句","q":"Where should I put these boxes?","o":["Yes, I put them away.","Just leave them by the door.","About twenty kilograms."],"a":1,"e":"問放哪裡，回答「放門邊就好」。Yes/No 不能回答 WH 問句；About twenty kilograms 答的是重量。"},{"id":"P2-03","i":"p2","pt":2,"t":"Where 問句","q":"Where's the quarterly sales report?","o":["Every three months.","Mr. Ross has it on his desk.","Sales increased by ten percent."],"a":1,"e":"回答在誰手上（間接給出位置）。Sales increased 重複 sales 一字的陷阱；Every three months 是 quarterly 的意思，聯想陷阱。"},{"id":"P2-04","i":"p2","pt":2,"t":"Where 問句","q":"Where are we holding the training workshop?","o":["It hasn't been decided yet.","A workshop on leadership.","From nine to five."],"a":0,"e":"「還沒決定」是 Part 2 最常見的萬用正解之一。From nine to five 答時間；A workshop on leadership 重複 workshop。"},{"id":"P2-05","i":"p2","pt":2,"t":"When 問句","q":"When will the new menu be available?","o":["Starting next Monday.","At the restaurant downstairs.","Yes, it's very available."],"a":0,"e":"問何時，答 Starting next Monday。"},{"id":"P2-06","i":"p2","pt":2,"t":"When 問句","q":"When does the flight to Singapore depart?","o":["I've never been to Singapore.","It's been delayed until noon.","From Gate 23."],"a":1,"e":"回答延到中午，提供時間資訊。From Gate 23 答的是 Where。"},{"id":"P2-07","i":"p2","pt":2,"t":"When 問句","q":"When did you send the invoice to the client?","o":["To the accounting department.","First thing this morning.","About three hundred dollars."],"a":1,"e":"問何時寄，答「今天一早」。First thing this morning 是常見時間用語。"},{"id":"P2-08","i":"p2","pt":2,"t":"When 問句","q":"When is the deadline for the budget proposal?","o":["Let me check the schedule.","A proposal from the marketing team.","It's over budget."],"a":0,"e":"「我查一下行程表」屬於間接回答，邏輯上合理。其他兩個都只是重複 budget/proposal。"},{"id":"P2-09","i":"p2","pt":2,"t":"Who 問句","q":"Who's in charge of ordering office supplies?","o":["In the supply closet.","Pens and paper, mostly.","Ms. Lin handles that."],"a":2,"e":"問誰負責，答人名 Ms. Lin。"},{"id":"P2-10","i":"p2","pt":2,"t":"Who 問句","q":"Who will be giving the presentation at the conference?","o":["At the convention center.","The head of research.","It was very informative."],"a":1,"e":"回答職稱也算回答 Who：研究部主管。"},{"id":"P2-11","i":"p2","pt":2,"t":"Who 問句","q":"Who should I talk to about my travel reimbursement?","o":["By train, I think.","Someone in Accounting can help you.","It was a pleasant trip."],"a":1,"e":"回答部門（會計部的人）也是 Who 的常見正解。"},{"id":"P2-12","i":"p2","pt":2,"t":"Who 問句","q":"Who left this umbrella in the conference room?","o":["Room 304.","It might be Daniel's.","It's supposed to rain later."],"a":1,"e":"回答「可能是 Daniel 的」。It's supposed to rain 是聯想陷阱（umbrella→rain）。"},{"id":"P2-13","i":"p2","pt":2,"t":"What 問句","q":"What time does the store close today?","o":["At eight thirty.","It's on Main Street.","Yes, it's very close."],"a":0,"e":"問時間，答 At eight thirty。close（關門）和 close（近的）一字多義陷阱。"},{"id":"P2-14","i":"p2","pt":2,"t":"What 問句","q":"What did you think of the new advertising campaign?","o":["About two weeks.","We think so, too.","It was very creative."],"a":2,"e":"問看法，回答評價 It was very creative。"},{"id":"P2-15","i":"p2","pt":2,"t":"What 問句","q":"What's the fastest way to get to the airport?","o":["Yes, it's very fast.","It leaves at six.","Take the express train."],"a":2,"e":"問方法，回答搭特快車。"},{"id":"P2-16","i":"p2","pt":2,"t":"What 問句","q":"What kind of position are you applying for?","o":["The application form is online.","A sales manager role.","I applied last week."],"a":1,"e":"問哪種職位，答 A sales manager role。"},{"id":"P2-17","i":"p2","pt":2,"t":"Why 問句","q":"Why is the parking lot closed today?","o":["Because I drove here.","It closes at ten.","It's being repaved."],"a":2,"e":"問原因，答正在重新鋪路。Why 問句不一定要用 Because 開頭；Because I drove here 有 because 卻答非所問。"},{"id":"P2-18","i":"p2","pt":2,"t":"Why 問句","q":"Why did Mr. Thompson leave early?","o":["Early next week.","He had a doctor's appointment.","He left it on the desk."],"a":1,"e":"說明原因：去看醫生。Early next week 重複 early；He left it on the desk 用 leave 的另一個意思。"},{"id":"P2-19","i":"p2","pt":2,"t":"Why 問句","q":"Why don't we take a short break?","o":["I took it yesterday.","Because it's broken.","That sounds like a good idea."],"a":2,"e":"Why don't we...? 是「提議」，不是問原因，回答同意即可。"},{"id":"P2-20","i":"p2","pt":2,"t":"Why 問句","q":"Why hasn't the shipment arrived yet?","o":["There was a problem at customs.","We ship worldwide.","It arrived on time."],"a":0,"e":"說明原因：海關出了問題。It arrived on time 與題意矛盾。"},{"id":"P2-21","i":"p2","pt":2,"t":"How 問句","q":"How was your business trip to London?","o":["For three days.","By plane.","Very productive, thanks."],"a":2,"e":"How was...? 問感想。By plane 答交通方式（How did you get...?）。"},{"id":"P2-22","i":"p2","pt":2,"t":"How 問句","q":"How many people are attending the workshop?","o":["It's very popular.","Around forty, I think.","In the main hall."],"a":1,"e":"How many 問數量，答 Around forty。"},{"id":"P2-23","i":"p2","pt":2,"t":"How 問句","q":"How long will the renovation take?","o":["It's very long.","The building on Fifth Avenue.","About three months."],"a":2,"e":"How long 問期間，答 About three months。"},{"id":"P2-24","i":"p2","pt":2,"t":"How 問句","q":"How often do you update the company Web site?","o":["On our home page.","Once a week.","Yes, it was updated."],"a":1,"e":"How often 問頻率，答 Once a week。"},{"id":"P2-25","i":"p2","pt":2,"t":"How 問句","q":"How much does it cost to ship this package overnight?","o":["Let me weigh it first.","To Chicago.","It arrived overnight."],"a":0,"e":"「我先秤重」是合理的間接回答，運費要看重量。"},{"id":"P2-26","i":"p2","pt":2,"t":"Yes/No 問句","q":"Have you finished reviewing the contract?","o":["Yes, it's under contract.","She reviewed the movie.","I'm almost done."],"a":2,"e":"Have you finished...? 回答「快好了」。不一定要回答 Yes/No 才是正解。"},{"id":"P2-27","i":"p2","pt":2,"t":"Yes/No 問句","q":"Is there a pharmacy near the hotel?","o":["There's one across the street.","Some medicine for a headache.","Yes, I booked the hotel."],"a":0,"e":"回答對面就有一家。Yes, I booked the hotel 雖然以 Yes 開頭但內容不對。"},{"id":"P2-28","i":"p2","pt":2,"t":"Yes/No 問句","q":"Did you get my e-mail about the schedule change?","o":["No, I'll mail it later.","The schedule is on the wall.","Yes, I read it this morning."],"a":2,"e":"回答 Yes，今天早上看過了。No, I'll mail it later 用 e-mail / mail 的相似音。"},{"id":"P2-29","i":"p2","pt":2,"t":"Yes/No 問句","q":"Are you going to the company picnic on Saturday?","o":["Sandwiches and drinks.","It was on Saturday.","I wouldn't miss it."],"a":2,"e":"I wouldn't miss it（我一定會去）是肯定的慣用說法。"},{"id":"P2-30","i":"p2","pt":2,"t":"Yes/No 問句","q":"Do you know if the printer is working again?","o":["The technician fixed it an hour ago.","I work on the second floor.","Yes, I printed my name."],"a":0,"e":"間接回答：技術人員一小時前修好了 → 可以用了。"},{"id":"P2-31","i":"p2","pt":2,"t":"否定與附加問句","q":"Isn't the director supposed to arrive at ten?","o":["Her train was delayed.","At the director's office.","No, I didn't arrive."],"a":0,"e":"否定問句的意思等同一般問句，「主任不是十點要到嗎？」回答她的火車誤點（所以會晚到）。"},{"id":"P2-32","i":"p2","pt":2,"t":"否定與附加問句","q":"You've been to our Seoul office before, haven't you?","o":["No, I haven't seen it.","It's a nice office chair.","Yes, a couple of times."],"a":2,"e":"附加問句只要看前面的敘述「你去過首爾辦公室吧？」回答去過幾次。"},{"id":"P2-33","i":"p2","pt":2,"t":"否定與附加問句","q":"The meeting starts at three, doesn't it?","o":["In the large conference room.","Actually, it was moved to four.","Yes, it started yesterday."],"a":1,"e":"Actually 開頭更正資訊，是常見正解形式。"},{"id":"P2-34","i":"p2","pt":2,"t":"否定與附加問句","q":"Haven't you met the new accountant yet?","o":["No, I've been out of the office all week.","Yes, we need more accounts.","He met the deadline."],"a":0,"e":"回答還沒見過，並說明原因。"},{"id":"P2-35","i":"p2","pt":2,"t":"選擇疑問句","q":"Would you like to meet on Tuesday or Wednesday?","o":["Wednesday works better for me.","We met last week.","Yes, I'd like to."],"a":0,"e":"選擇疑問句通常不能用 Yes/No 回答，要選一個或兩者皆可/皆不。"},{"id":"P2-36","i":"p2","pt":2,"t":"選擇疑問句","q":"Should we take a taxi or walk to the restaurant?","o":["Yes, we should.","I'll have the steak.","It's only five minutes away."],"a":2,"e":"間接選擇：只要走五分鐘 → 用走的。"},{"id":"P2-37","i":"p2","pt":2,"t":"選擇疑問句","q":"Do you want the report printed or sent by e-mail?","o":["Yes, please print it.","The report was long.","Either is fine."],"a":2,"e":"Either is fine（都可以）是選擇疑問句的經典正解。"},{"id":"P2-38","i":"p2","pt":2,"t":"選擇疑問句","q":"Is the conference in Berlin or in Munich this year?","o":["I've been to Berlin.","Yes, it's this year.","Neither—it's in Vienna."],"a":2,"e":"Neither（都不是）也是選擇疑問句常見答法。"},{"id":"P2-39","i":"p2","pt":2,"t":"請求與提議","q":"Could you help me move this table?","o":["It's a wooden table.","Sure, where do you want it?","I moved last year."],"a":1,"e":"請求協助，回答 Sure 並追問要放哪。"},{"id":"P2-40","i":"p2","pt":2,"t":"請求與提議","q":"Would you like me to call a taxi for you?","o":["I called him yesterday.","Thanks, that would be great.","Yes, it's a taxi."],"a":1,"e":"Would you like me to...? 是主動提議，回答接受或婉拒。"},{"id":"P2-41","i":"p2","pt":2,"t":"請求與提議","q":"Can I borrow your stapler for a minute?","o":["I bought a new one for you.","It's on the minute.","Of course, here you go."],"a":2,"e":"Of course, here you go（當然，拿去）。"},{"id":"P2-42","i":"p2","pt":2,"t":"請求與提議","q":"Let's order lunch from the Thai place.","o":["I had Thai food yesterday.","Lunch is at noon.","Yes, place it here."],"a":0,"e":"陳述提議時，間接拒絕也是正解：我昨天才吃過泰國菜（暗示不想）。"},{"id":"P2-43","i":"p2","pt":2,"t":"請求與提議","q":"Why don't you ask Mr. Hughes for advice?","o":["Because I asked him.","He's on vacation this week.","Some good advice."],"a":1,"e":"提議問 Hughes 先生，回答他這週休假（所以沒辦法），間接回應。"},{"id":"P2-44","i":"p2","pt":2,"t":"陳述句","q":"The printer on the third floor is out of toner.","o":["I'll order some more.","Three copies, please.","It's on the third floor."],"a":0,"e":"聽到問題陳述，回答解決方案：我再訂一些。"},{"id":"P2-45","i":"p2","pt":2,"t":"陳述句","q":"I can't find the file for the Mendez account.","o":["The account was closed.","I found it interesting.","Did you check the shared drive?"],"a":2,"e":"以反問提供建議：你看過共用磁碟了嗎？"},{"id":"P2-46","i":"p2","pt":2,"t":"陳述句","q":"Our new intern starts on Monday.","o":["I'll prepare a desk for her.","The internship ended.","It starts at nine."],"a":0,"e":"回應實習生要來，回答我幫她準備位子。"},{"id":"P2-47","i":"p2","pt":2,"t":"陳述句","q":"The air conditioner is making a strange noise.","o":["It's a strange story.","I'll call maintenance.","Turn it up, please."],"a":1,"e":"回應設備問題：我打給維修部。"},{"id":"P2-48","i":"p2","pt":2,"t":"陳述句","q":"This year's sales conference was very well organized.","o":["The planning committee worked hard.","It's in October.","We sold all of them."],"a":0,"e":"回應稱讚：籌備委員會很努力。"},{"id":"P2-49","i":"p2","pt":2,"t":"間接回答","q":"Has the budget for next year been approved?","o":["It's about the budget.","The board meets on Friday.","I approve of your plan."],"a":1,"e":"間接回答：董事會週五才開會 → 表示還沒核准。"},{"id":"P2-50","i":"p2","pt":2,"t":"間接回答","q":"Who's going to replace Ms. Duval when she retires?","o":["They're still interviewing candidates.","She'll retire in June.","I placed the order."],"a":0,"e":"「還在面試人選」→ 還沒決定是誰。replace / placed 音近陷阱。"},{"id":"P2-51","i":"p2","pt":2,"t":"間接回答","q":"Where can I get a copy of the employee handbook?","o":["It's posted on the intranet.","Every new employee.","Yes, I'll copy it."],"a":0,"e":"放在內部網站上，提供取得方式。"},{"id":"P2-52","i":"p2","pt":2,"t":"間接回答","q":"Are you coming to the client dinner tonight?","o":["Dinner was delicious.","The client is from Brazil.","I have to finish this report first."],"a":2,"e":"得先完成報告 → 暗示可能晚到或不確定，屬合理回應。"},{"id":"P2-53","i":"p2","pt":2,"t":"間接回答","q":"When will the new software be installed?","o":["Ask the IT department.","A new version of the software.","It was installed upstairs."],"a":0,"e":"「去問資訊部」：把問題轉給知道的人，是非常常見的正解。"},{"id":"P2-54","i":"p2","pt":2,"t":"間接回答","q":"Why is the elevator out of order?","o":["On the fifth floor.","I'm not sure, but the stairs are over there.","In alphabetical order."],"a":1,"e":"不知道原因並提供替代方案（樓梯在那邊）。order 一字多義陷阱。"},{"id":"P3-01-1","i":"p34","pt":3,"t":"主旨細節","q":"What does the woman ask the man to do?","o":["Contact the marketing department","Repair a copier","Make copies of some documents","Lead a staff meeting"],"a":2,"e":"女子開頭就說 make copies of these handouts。","p":"S3-01"},{"id":"P3-01-2","i":"p34","pt":3,"t":"細節","q":"What problem does the man mention?","o":["Some pages are missing.","An office is locked.","A machine is being fixed.","A meeting has been canceled."],"a":2,"e":"男子說 the copier on our floor is being repaired，換句話說就是 a machine is being fixed。","p":"S3-01"},{"id":"P3-01-3","i":"p34","pt":3,"t":"下一步","q":"When will the man deliver the handouts?","o":["Before lunch","At the end of the day","During the meeting","Tomorrow morning"],"a":0,"e":"最後一句 I'll bring them to your office before lunch。","p":"S3-01"},{"id":"P3-02-1","i":"p34","pt":3,"t":"目的","q":"Why is the woman calling?","o":["To make a reservation","To complain about a room","To cancel a booking","To register for a conference"],"a":0,"e":"I'd like to book a room，打來訂房。","p":"S3-02"},{"id":"P3-02-2","i":"p34","pt":3,"t":"細節","q":"What does the man say about the ocean-view rooms?","o":["They include breakfast.","They are not available.","They are being renovated.","They are more expensive."],"a":1,"e":"fully booked = not available。","p":"S3-02"},{"id":"P3-02-3","i":"p34","pt":3,"t":"細節","q":"What does the man ask the woman to provide?","o":["A registration number","A copy of her passport","A credit card number","A return date"],"a":0,"e":"I'll just need your conference registration number。","p":"S3-02"},{"id":"P3-03-1","i":"p34","pt":3,"t":"主旨細節","q":"What problem are the speakers discussing?","o":["A product will be delayed.","An advertisement contains errors.","A factory has closed.","A price has increased."],"a":0,"e":"won't be ready until the end of next month → 產品延遲。","p":"S3-03"},{" sing?","o":["Moving to a new location","Purchasing furniture","Hiring new staff","Renovating an office"],"a":1,"e":"office furniture 的報價。","p":"S3-11"},{"id":"P3-11-2","i":"p34","pt":3,"t":"細節","q":"Why does the woman reject Morrison Supplies?","o":["Its delivery date is too late.","It does not offer assembly.","Its price is too high.","Its products are low quality."],"a":0,"e":"can't deliver until March，女子說 That's too late。","p":"S3-11"},{"id":"P3-11-3","i":"p34","pt":3,"t":"下一步","q":"What does the woman ask the man to find out?","o":["Which colors are available","How much the delivery fee is","Whether assembly is included at no cost","When the new employees will start"],"a":2,"e":"ask if they offer free assembly。","p":"S3-11"},{"id":"P3-12-1","i":"p34","pt":3,"t":"主旨","q":"What are the speakers mainly discussing?","o":["A company budget","A professional seminar","A marketing campaign","A job opening"],"a":1,"e":"digital marketing seminar。","p":"S3-12"},{"id":"P3-12-2","i":"p34","pt":3,"t":"細節","q":"Why was an additional session added?","o":["The venue changed.","There was high demand.","The morning session was canceled.","A speaker was unavailable."],"a":1,"e":"because so many people were interested → high demand。","p":"S3-12"},{"id":"P3-12-3","i":"p34","pt":3,"t":"細節","q":"What should the man do first?","o":["Pay a registration fee","Contact the speaker","Reserve a seat online","Submit a form to his manager"],"a":3,"e":"submit a training request form to your manager first。","p":"S3-12"},{"id":"P4-01-1","i":"p34","pt":4,"t":"地點","q":"Where is the announcement being made?","o":["At a travel agency","At an airport","On an airplane","At a train station"],"a":1,"e":"flight、gate、passengers → 機場。","p":"S4-01"},{"id":"P4-01-2","i":"p34","pt":4,"t":"細節","q":"What has changed about the flight?","o":["The destination","The airline","The seat assignments","The departure gate"],"a":3,"e":"Gate 36 instead of Gate 22 → 登機門更改。","p":"S4-01"},{"id":"P4-01-3","i":"p34","pt":4,"t":"
